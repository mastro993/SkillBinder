# pstack role routing (project layer; overrides global settings).
#
# OMP dispatch selects only the agent name. The model is resolved here through
# modelRoles + task.agentModelOverrides, so a pstack panel entry is an agent
# name, not a raw model id.
#
# Verified against `omp models` on 2026-09-20:
#   deepseek/deepseek-v4-flash  thinking low,high,max
#   deepseek/deepseek-flash     thinking low,high,max
#   openai-codex/gpt-5.6-luna   thinking low,medium,high,xhigh,max
#   openai-codex/gpt-5.6-sol    thinking low,medium,high,xhigh,max
#   openai-codex/gpt-5.6-terra  thinking low,medium,high,xhigh,max
modelRoles:
  pstack_explore: deepseek/deepseek-v4-flash:high
  pstack_mechanical: deepseek/deepseek-flash:low
  pstack_implement: openai-codex/gpt-5.6-luna:high
  pstack_review: openai-codex/gpt-5.6-sol:xhigh
  pstack_design: openai-codex/gpt-5.6-terra:high

task:
  agentModelOverrides:
    scout: "@pstack_explore"
    librarian: "@pstack_explore"
    sonic: "@pstack_mechanical"
    task: "@pstack_implement"
    reviewer: "@pstack_review"
    security-reviewer: "@pstack_review"
    designer: "@pstack_design"
