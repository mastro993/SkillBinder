# Blocking filesystem, process, network, and environment work belongs in
# crates/engine. Crates that own it opt out at their crate root; everything
# else fails `cargo clippy -D warnings` when it reaches for these items.
# Clippy resolves names after expansion, so aliases, globs, `extern crate`,
# `include!`, and `#[path]` modules are all covered.

disallowed-types = [
    { path = "std::fs::DirBuilder", reason = "filesystem work belongs in crates/engine" },
    { path = "std::fs::DirEntry", reason = "filesystem work belongs in crates/engine" },
    { path = "std::fs::File", reason = "filesystem work belongs in crates/engine" },
    { path = "std::fs::OpenOptions", reason = "filesystem work belongs in crates/engine" },
    { path = "std::fs::ReadDir", reason = "filesystem work belongs in crates/engine" },
    { path = "std::net::TcpListener", reason = "network work belongs in crates/engine" },
    { path = "std::net::TcpStream", reason = "network work belongs in crates/engine" },
    { path = "std::net::UdpSocket", reason = "network work belongs in crates/engine" },
    { path = "std::process::Child", reason = "process work belongs in crates/engine" },
    { path = "std::process::Command", reason = "process work belongs in crates/engine" },
    { path = "std::os::unix::net::UnixDatagram", reason = "network work belongs in crates/engine", allow-invalid = true },
    { path = "std::os::unix::net::UnixListener", reason = "network work belongs in crates/engine", allow-invalid = true },
    { path = "std::os::unix::net::UnixStream", reason = "network work belongs in crates/engine", allow-invalid = true },
    { path = "tokio::fs::File", reason = "filesystem work belongs in crates/engine", allow-invalid = true },
    { path = "tokio::fs::OpenOptions", reason = "filesystem work belongs in crates/engine", allow-invalid = true },
    { path = "tokio::net::TcpListener", reason = "network work belongs in crates/engine", allow-invalid = true },
    { path = "tokio::net::TcpStream", reason = "network work belongs in crates/engine", allow-invalid = true },
    { path = "tokio::net::UdpSocket", reason = "network work belongs in crates/engine", allow-invalid = true },
    { path = "tokio::process::Command", reason = "process work belongs in crates/engine", allow-invalid = true },
]

