# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review policy. Project rules live in AGENTS.md, CONTRIBUTING.md, and docs/;
# this file points reviews at them instead of restating them.
language: "en-US"
tone_instructions: "Be direct and specific. Prioritize correctness, data safety, and approved scope over style. Cite the violated repository document when flagging a rule. Skip praise and nitpicks that rustfmt or Clippy already enforce."
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: |
    Summarize user-visible behavior first, then internal changes. Name the affected journey
    (onboarding, Discovery, imports, Library, folders, Sync, Settings) and crate. State which
    verification categories the PR claims: compilation, domain tests, native interaction,
    visual parity, or packaged-app smoke tests.
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_reviewers: false
  suggested_labels: true
  auto_apply_labels: false
  labeling_instructions:
    - label: "bug"
      instructions: "Fixes behavior that diverges from fixtures/contracts/domain-contract.md, docs/features/native.md, or a reported defect."
    - label: "enhancement"
      instructions: "Adds or improves a feature within the approved scope: onboarding, Discovery, imports, Library, flat folders, Sync, or Settings."
    - label: "documentation"
      instructions: "Changes only documentation under docs/, README.md, CONTRIBUTING.md, or AGENTS.md."
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "warning"
      requirements: "Conventional Commits format: `type(scope): imperative summary`, where type is one of feat, fix, refactor, perf, test, docs, build, ci, chore. Scope names the crate or area, such as engine, ui, client, proto, theme, desktop, xtask, ci."
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
    custom_checks:
      - name: "Approved product scope"
        mode: "warning"
        instructions: |
          Pass when the change stays inside the approved scope: four onboarding steps, Discovery,
          reviewed imports, Library, flat folders, shared-slug resolution, Sync, and Settings.
          Fail when it adds bindings or deployment screens, nested folders, tag-management UI,
          migration from `~/.skillbinder` or an old database, a daemon or network command
          transport, or a production debug server. Fail when it implements UI styling or visual
          polish without the PR description stating the user authorized that work.
      - name: "Behavior documentation updated"
        mode: "warning"
        instructions: |
          Pass when no user-visible behavior, ownership boundary, state flow, concurrency rule, or
          verification command changes. Otherwise pass only if the same PR updates the affected
          document: docs/features/native.md for behavior, docs/architecture/native.md for ownership,
          state flow, or concurrency, docs/native-gate.md and README.md for verification commands,
          and docs/supported-agents.md (regenerated by `cargo run -p xtask -- registry`) for
          registry changes. Fail when documentation describes behavior the code does not implement.
      - name: "Verification evidence categories"
        mode: "warning"
        instructions: |
          Pass when the PR description lists the verification performed and keeps these categories
          separate: compilation and lint, domain or integration tests, native interaction, visual
          parity, and packaged-app smoke tests. Fail when it claims native interaction, visual
          parity, or packaged-app behavior based only on compilation, unit tests, or fixture
          images. Documentation-only and CI-only PRs pass when they state that no runtime behavior
          changed.

  path_filters:
    - "!fixtures/baseline/**"
    - "!assets/**"
    - "!Cargo.lock"
    - "!docs/supported-agents.md"

  path_instructions:
    - path: "**/*.rs"
      instructions: |
        - Fallible operations use `Result`, `Option`, and `?`. Flag `unwrap`, `expect`, and `panic!`
          outside tests; the workspace warns on `unwrap_used` and `expect_used`.
        - State is modeled with typed data and enums, not stringly typed flags or booleans that
          encode several states.
        - Modules stay small and specialized by feature. Flag new swiss-army modules, empty crates,
          and pass-through services that only forward calls.
        - `unsafe` is forbidden workspace-wide.
        - Do not comment on formatting or lints that `cargo fmt` and Clippy with `-D warnings`
          already enforce in CI.
    - path: "crates/proto/**"
      instructions: |
        Shared IDs, typed inputs and results, immutable snapshots, and safe structured errors.
        No I/O, SQLite, Git, or GPUI dependencies. Domain vocabulary must match
        docs/agents/domain.md. Invariants are documented beside their owning types. Safe errors
        carry category, recovery action, retryability, and diagnostic identity without leaking
        home paths or credentials.
    - path: "crates/engine/**"
      instructions: |
        Owns domain operations and durable state. Review against fixtures/contracts/domain-contract.md
        and docs/features/native.md; a divergence is a defect, not a contract change.
        - One worker owns the SQLite connection and serializes library, metadata, and Git mutations.
          Discovery stays independent.
        - Sources must remain byte-identical. Flag any path that writes to, moves, or deletes
          discovered source directories or user project files.
        - Durable mutations are journaled. Recovery must complete or reverse interrupted moves
          before further mutations. Flag bypasses of source, revision, journal, or Git isolation
          checks.
        - Check path containment, link hop limits, traversal and preview bounds, and portable-name
          rules against the documented limits.
        - Git runs through the verified absolute executable with timeouts and disabled prompts.
          Commits cover only `.skillbinder.json` and `skills/`. Unrelated files are preserved.
        - Logs redact home paths and credential formats.
        - Tests use isolated data roots and local bare Git remotes. Flag tests that could touch a
          real user library, home directory, or network remote.
    - path: "crates/client/**"
      instructions: |
        Typed operations, cached projections, coalesced subscriptions, and request generations.
        Superseded reads must be rejected so older observations never replace newer ones. A failed
        projection refresh must never turn a completed mutation into a failure. No direct
        filesystem, SQLite, or Git access.
    - path: "crates/ui/**"
      instructions: |
        GPUI rendering and interaction only.
        - The UI calls typed client operations. Flag SQLite, filesystem mutation, hashing, Git, or
          other blocking work on the GPUI thread.
        - Use GPUI Kit public editing, focus, and overlay APIs through `gpui_kit`. Flag reimplemented
          components that GPUI Kit already provides and any patched or forked dependency source.
        - Visible icons use retained Hugeicons artwork. Unknown icon paths must fail explicitly,
          never fall back to different artwork.
        - Visible wording follows fixtures/contracts/ui-copy.md.
        - Dialogs restore focus on dismissal, refuse implicit Enter confirmation on review dialogs,
          and block dismissal while an operation is pending.
        - Visual fidelity and polish are deferred. Do not request styling, spacing, or color changes
          unless they break function or accessibility.
    - path: "crates/theme/**"
      instructions: |
        Colors, typography, dimensions, and motion only. Values trace to
        fixtures/contracts/design-tokens.json. No application logic.
    - path: "apps/desktop/**"
      instructions: |
        Native lifecycle, configuration, Tokio runtime, engine lifetime, process lock, and orderly
        shutdown. Quit paths must drain the engine and release the library lock before returning.
        Test controls and the MCP bridge exist only behind the `native-test` feature; flag anything
        that leaks them into ordinary builds.
    - path: "xtask/**"
      instructions: |
        Verification, registry documentation, fixtures, and packaging. `verify` must not claim
        native interaction or visual parity. Packaging must not sign or publish.
    - path: "fixtures/contracts/**"
      instructions: |
        Approved contracts. Treat any change as a scope decision: the PR description must justify
        it. Registry changes update registry-79.json with pinned provenance and regenerate
        docs/supported-agents.md. Asset and font changes keep license provenance intact.
    - path: "**/Cargo.toml"
      instructions: |
        Dependencies and lint policy are centralized in the root manifest. Flag new dependencies
        that duplicate the standard library or an existing dependency, version changes to GPUI Kit
        or the pinned `gpui-pre` patch without a stated dependency decision, and license-incompatible
        crates.
    - path: "docs/**"
      instructions: |
        Documentation must describe implemented behavior, not aspirational behavior, and use the
        vocabulary in docs/agents/domain.md. Check that commands match README.md and CI. Keep
        documentation independent of external architecture examples.
    - path: ".github/**"
      instructions: |
        CI runs fmt, xtask verify, Clippy with warnings denied, workspace tests, and native smoke
        tests on macOS, Windows, and Linux. Flag removed checks, widened permissions, unpinned
        third-party actions with write access, and secrets exposed to pull-request jobs.

  tools:
    # CI already runs Clippy with warnings denied on every platform.
    clippy:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "local"
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "docs/agents/domain.md"
      - "docs/architecture/native.md"
