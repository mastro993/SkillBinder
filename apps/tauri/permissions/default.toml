[[permission]]
identifier = "allow-system-bootstrap"
description = "Read the bounded application bootstrap state"
commands.allow = ["system_bootstrap"]

[[permission]]
identifier = "allow-git-environment-verify"
description = "Re-run the bounded system Git prerequisite check"
commands.allow = ["git_environment_verify"]

[[permission]]
identifier = "allow-onboarding-progress-update"
description = "Persist the current non-secret onboarding step"
commands.allow = ["onboarding_progress_update"]

[[permission]]
identifier = "allow-onboarding-complete-local"
description = "Create the local SkillBinder library and finish onboarding"
commands.allow = ["onboarding_complete_local"]

[[permission]]
identifier = "allow-discovery-start"
description = "Start a bounded scan over the registered search roots"
commands.allow = ["discovery_start"]

[[permission]]
identifier = "allow-discovery-results"
description = "Read one page of scan progress and candidates"
commands.allow = ["discovery_results"]

[[permission]]
identifier = "allow-discovery-cancel"
description = "Ask a running scan to stop at its next safe boundary"
commands.allow = ["discovery_cancel"]

[[permission]]
identifier = "allow-discovery-current"
description = "Read the scan the shell is currently holding"
commands.allow = ["discovery_current"]

[[permission]]
identifier = "allow-roots-pick"
description = "Pick a project-search root through the native folder picker"
commands.allow = ["roots_pick"]

[[permission]]
identifier = "allow-roots-register"
description = "Register a picked folder as a project-search root"
commands.allow = ["roots_register"]

[[permission]]
identifier = "allow-roots-list"
description = "List the registered project-search roots"
commands.allow = ["roots_list"]

[[permission]]
identifier = "allow-roots-update"
description = "Rename or disable a registered project-search root"
commands.allow = ["roots_update"]

[[permission]]
identifier = "allow-roots-remove"
description = "Remove a registered project-search root"
commands.allow = ["roots_remove"]

[[permission]]
identifier = "allow-imports-prepare"
description = "Prepare selected discovered skill imports"
commands.allow = ["imports_prepare"]

[[permission]]
identifier = "allow-imports-apply"
description = "Apply a prepared skill import"
commands.allow = ["imports_apply"]

[[permission]]
identifier = "allow-library-list"
description = "List managed library skills"
commands.allow = ["library_list"]

[[permission]]
identifier = "allow-library-skill-preview"
description = "Inspect a managed skill without changing the library"
commands.allow = ["library_skill_preview"]

[[permission]]
identifier = "allow-library-resolve-conflict"
description = "Choose which copy of a slug names one skill and move the others aside"
commands.allow = ["library_resolve_conflict"]

[[permission]]
identifier = "allow-diagnostics-reveal-logs"
description = "Open the application log folder in the device file manager"
commands.allow = ["diagnostics_reveal_logs"]

[[permission]]
identifier = "allow-git-sync-status"
description = "Read current Git remote and library sync status"
commands.allow = ["git_sync_status"]

[[permission]]
identifier = "allow-git-sync-connect"
description = "Configure a Git remote for the local library"
commands.allow = ["git_sync_connect"]

[[permission]]
identifier = "allow-git-sync-refresh"
description = "Refresh Git remote and library sync status"
commands.allow = ["git_sync_refresh"]

[[permission]]
identifier = "allow-git-sync-pull"
description = "Fast-forward the local library from its configured Git remote"
commands.allow = ["git_sync_pull"]

[[permission]]
identifier = "allow-git-sync-push"
description = "Commit managed library changes and push them to Git"
commands.allow = ["git_sync_push"]

[[permission]]
identifier = "allow-git-sync"
description = "Synchronize managed library changes with Git"
commands.allow = ["git_sync"]

[[permission]]
identifier = "allow-git-sync-disconnect"
description = "Remove the configured Git remote from SkillBinder"
commands.allow = ["git_sync_disconnect"]
