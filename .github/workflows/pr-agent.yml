name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# Isolate pull_request from issue_comment so a /ask comment cannot cancel an
# in-flight review (which would leave the required check cancelled).
concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-agent:
    name: PR-Agent review
    # Reviews every PR when it opens, and answers `/review`, `/improve`, `/ask …` comments.
    # Drafts wait for `ready_for_review`. Bot PRs (dependabot, renovate) are skipped. Fork
    # PRs, which get no secrets, wait for a `/review` comment from a repo collaborator.
    # Other comments never start the job. PR-Agent reads the diff through the API and never
    # checks out the PR's code. Model, tool, and ignore settings live in `.pr_agent.toml`
    # on the default branch (single source of truth; not duplicated here).
    # Skipped jobs (drafts, bots, forks) count as passing when this check is required.
    # issue_comment runs attach to the default branch and cannot satisfy the check; they
    # still serve slash commands. Only pull_request runs are gated.
    if: >-
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      ((github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The action's own Dockerfile pulls a rolling tag, so pin the release image (0.48.0) by digest.
      - id: pr-agent
        uses: docker://pragent/pr-agent@sha256:80edef71baa3df28c129d858d4b53784abfc14704c235efb32b6c461d5399a6d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Fail on blocking review
        if: github.event_name == 'pull_request'
        env:
          REVIEW: ${{ steps.pr-agent.outputs.review }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys


          def is_value_no(value):
              if not value:
                  return True
              value_str = str(value).strip().lower()
              return value_str in ("no", "none", "false")


          raw = os.environ.get("REVIEW", "").strip()
          if not raw:
              if os.environ.get("EVENT_ACTION", "") == "synchronize":
                  sys.exit(0)
              print("PR-Agent did not write a review output", file=sys.stderr)
              sys.exit(1)

          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"PR-Agent review output is not valid JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data, dict):
              print("PR-Agent review output is not an object", file=sys.stderr)
              sys.exit(1)

          security = data.get("security_concerns")
          if security is not None and not is_value_no(security):
              print("PR-Agent reported a security concern", file=sys.stderr)
              sys.exit(1)

          if data.get("merge_recommendation") == "changes_required":
              print("PR-Agent merge recommendation is changes_required", file=sys.stderr)
              sys.exit(1)
          PY
