name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: format, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check file sizes
        run: sh .githooks/pre-commit "$(git hash-object -t tree /dev/null)"
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libssl-dev libvulkan1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: checks
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Cache cccc
        id: cccc-cache
        uses: actions/cache@v4
        with:
          path: ~/.cccc
          key: cccc-cli-1.8.3-rust-1.99.1-${{ runner.os }}
      - name: Install cccc
        if: steps.cccc-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 install cccc-cli --version 1.8.3 --locked --root ~/.cccc
      - name: Check complexity
        run: ~/.cccc/bin/cccc .
      - name: Verify retained evidence
        run: cargo run -p xtask --locked -- verify
      - name: Check native graph
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --all-targets --all-features --locked
