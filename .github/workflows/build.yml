name: Build

# The release packages for macOS, Windows, and Linux. release.yml and nightly.yml call it with the
# version their `version` job stamped into the `stamp` artifact; the macOS image is then signed with
# the Developer ID and notarized. A pull request that changes packaging runs it unstamped and
# unsigned, so a broken platform shows up before a release needs it. See docs/release.md.
on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the `stamp` artifact's Cargo.toml and Cargo.lock
        type: string
        required: true
      ref:
        description: Commit to build
        type: string
        required: true
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/nightly.yml"
      - ".github/workflows/release.yml"
      - "xtask/src/package.rs"
      - "xtask/src/package/**"
      - "packaging/macos/**"
      - "packaging/windows/**"
      - "xtask/src/version.rs"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Darwin targets, combined into one universal binary.
          - os: macos-26
            target: universal-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          # A binary links against the build machine's glibc: the older runner's runs on more
          # distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Each runner's default shell: Git Bash on Windows would put its own link.exe ahead of MSVC's.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Stamp the version
        if: inputs.version
        uses: actions/download-artifact@v4
        with:
          name: stamp
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          # The runner image's Azure Ubuntu mirror can stop resolving; fetch from the main archive.
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential clang cmake ninja-build pkg-config libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libssl-dev libvulkan1
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # The pinned dmgbuild lays out the disk image's window. The runner's Python is externally
      # managed, so it goes into a virtual environment of its own.
      - name: Install dmgbuild
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --require-hashes --only-binary :all: -r packaging/macos/dmgbuild-requirements.txt
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"
      # The pinned Inno Setup 6 compiles the per-user setup program. Its installer is checked
      # against the release's SHA-256 before it runs, and installs for the runner's user only.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        env:
          INNO_VERSION: 6.7.4
          INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          $tag = 'is-' + $env:INNO_VERSION.Replace('.', '_')
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION.exe" -OutFile $installer
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne $env:INNO_SHA256) {
            throw "innosetup-$env:INNO_VERSION.exe does not match its SHA-256"
          }
          $folder = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $setup = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$folder" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup's installer exited with $($setup.ExitCode)" }
          Add-Content -Path $env:GITHUB_PATH -Value $folder
      # The pinned appimagetool builds the AppImage around the pinned static type 2 runtime, so the
      # AppImage needs no libfuse2. Both are checked against their release's SHA-256, and the tool
      # extracts itself to run, as the runner has no FUSE.
      - name: Install appimagetool
        if: runner.os == 'Linux'
        env:
          APPIMAGETOOL_VERSION: 1.9.1
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_VERSION: "20251108"
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          tools="$RUNNER_TEMP/appimage"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          curl -fsSL --retry 3 -o "$tools/runtime-x86_64" "https://github.com/AppImage/type2-runtime/releases/download/$RUNTIME_VERSION/runtime-x86_64"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" "$tools/appimagetool" "$RUNTIME_SHA256" "$tools/runtime-x86_64" | sha256sum --check --strict
          chmod +x "$tools/appimagetool"
          echo "$tools" >> "$GITHUB_PATH"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "SKILLBINDER_APPIMAGE_RUNTIME=$tools/runtime-x86_64" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A stamped version checks for app updates; an unstamped build never does (ADR 0018).
      - name: Stamp the release build
        if: inputs.version
        shell: bash
        run: echo "SKILLBINDER_RELEASE=1" >> "$GITHUB_ENV"
      # A temporary keychain holding only the Developer ID Application certificate; the runner is
      # discarded afterwards. It comes before the build, which compiles the team ID in.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && inputs.version
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one argument per keychain already in the search list
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity"
            exit 1
          fi
          echo "SKILLBINDER_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          # The stamped app checks that an app update's bundle carries this team's signature.
          team=$(sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p' <<<"$identity")
          if [ -z "$team" ]; then
            echo "::error::No team ID in the signing identity $identity"
            exit 1
          fi
          echo "SKILLBINDER_TEAM_ID=$team" >> "$GITHUB_ENV"
      - name: Build release application
        if: runner.os != 'macOS'
        run: cargo build -p skillbinder -p skillbinder-cli --release --locked --target ${{ matrix.target }}
      - name: Build universal macOS application
        if: runner.os == 'macOS'
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build -p skillbinder -p skillbinder-cli --release --locked --target "$target"
          done
          mkdir -p target/universal-apple-darwin/release
          for binary in skillbinder skillbinder-cli; do
            lipo -create -output "target/universal-apple-darwin/release/$binary" \
              "target/aarch64-apple-darwin/release/$binary" \
              "target/x86_64-apple-darwin/release/$binary"
            vtool -show-build "target/universal-apple-darwin/release/$binary" | grep -q 'minos 26.0'
          done
      - name: Package
        run: cargo run -p xtask --locked -- package ${{ matrix.target }}
      - name: Notarize the disk image
        if: runner.os == 'macOS' && inputs.version
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$API_KEY" > "$key"
          credentials=(--key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER")
          image=$(ls dist/universal-apple-darwin/*.dmg)
          result=$(xcrun notarytool submit "$image" "${credentials[@]}" --wait --timeout 1h --output-format json) || true
          echo "$result"
          if [ "$(jq -r '.status // empty' <<<"$result")" != Accepted ]; then
            id=$(jq -r '.id // empty' <<<"$result")
            if [ -n "$id" ]; then xcrun notarytool log "$id" "${credentials[@]}"; fi
            echo "::error::Notarization of $image was not accepted"
            exit 1
          fi
          xcrun stapler staple "$image"
          spctl --assess --type open --context context:primary-signature --verbose "$image"
      # The hand-off to the caller's publish job, not a distribution channel.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/*.dmg
            dist/${{ matrix.target }}/*-setup.exe
            dist/${{ matrix.target }}/*.AppImage
          if-no-files-found: error
          retention-days: 3
