name: Nightly

# A beta of `main` every night: the next patch version with a `-beta.<run>` suffix, stamped into
# the build only (nothing is committed), tagged on the built commit and published as a GitHub
# prerelease with a notarized macOS image. A night without a pull request merged since the last
# release or beta is skipped, and only the newest betas are kept. See docs/release.md.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# One release at a time, manual releases included: they all create tags.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Betas are cut from main, not $GITHUB_REF"
          exit 1
      # The full history and its tags, to find the last release or beta.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # A beta needs a pull request merged since the last release or beta, by anyone but the
      # github-actions bot. The release bump is a direct push, so it never counts. A run queued
      # behind a release keeps the commit it was queued with, which the release then superseded:
      # skip it too.
      - id: fresh
        name: Skip a night without merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "Skipped: main moved to $head since this run was queued" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if last=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null); then
            merged=$(git rev-list "$last..HEAD" | while read -r sha; do
              gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
                --jq '.[] | select(.merged_at != null and .user.login != "github-actions[bot]") | "#\(.number)"' || exit 1
            done | sort -u | xargs)
            if [ -z "$merged" ]; then
              echo "Skipped: no pull request merged since $last" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Merged since $last: $merged" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
      - name: Require signing secrets
        if: steps.fresh.outputs.fresh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
        run: |
          missing=""
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ "${!name}" = true ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing; see docs/release.md"
            exit 1
          fi
      - name: Install pinned Rust toolchain
        if: steps.fresh.outputs.fresh
        run: rustup toolchain install 1.100.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        if: steps.fresh.outputs.fresh
        with:
          key: release-version
      - id: next
        name: Compute and stamp the version
        if: steps.fresh.outputs.fresh
        run: |
          version="$(cargo run -q -p xtask --locked -- version next patch)-beta.$GITHUB_RUN_NUMBER"
          cargo run -q -p xtask --locked -- version set "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.fresh.outputs.fresh
        with:
          name: stamp
          path: |
            Cargo.toml
            Cargo.lock
          retention-days: 3

  build:
    needs: version
    if: needs.version.outputs.version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job: gh resolves the repository from here instead of from git.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # The release API creates the tag on the built commit.
      - name: Publish the prerelease
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release create "v$VERSION" --target "$GITHUB_SHA" --prerelease \
            --title "SkillBinder v$VERSION" \
            --generate-notes \
            dist/*
      # Keep the five newest betas; stable releases are never touched.
      - name: Prune old betas
        run: |
          gh release list --limit 200 --exclude-drafts --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)] | .[5:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done
