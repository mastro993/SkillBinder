name: Nightly

# A beta of `main` every night: the next patch version with a `-beta.<run>` suffix, stamped into
# the build only (nothing is committed), tagged on the built commit and published as a GitHub
# prerelease with a notarized macOS image. A night with nothing new since the last release or beta
# is skipped, and only the newest betas are kept. See docs/release.md.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# One release at a time, manual releases included: they all create tags.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Betas are cut from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # A tag on this commit means a release or beta already ships it. A run queued behind a
      # release keeps the commit it was queued with, which the release then superseded: skip it
      # too.
      - id: fresh
        name: Skip a night with nothing new
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "Skipped: main moved to $head since this run was queued" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tagged=$(git ls-remote --tags origin 'v*' | awk -v head="$GITHUB_SHA" '$1 == head { print $2 }')
          if [ -n "$tagged" ]; then
            echo "Skipped: $GITHUB_SHA is already tagged ($tagged)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
      - name: Require signing secrets
        if: steps.fresh.outputs.fresh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
        run: |
          missing=""
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ "${!name}" = true ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing; see docs/release.md"
            exit 1
          fi
      - name: Install pinned Rust toolchain
        if: steps.fresh.outputs.fresh
        run: rustup toolchain install 1.100.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        if: steps.fresh.outputs.fresh
        with:
          key: release-version
      - id: next
        name: Compute and stamp the version
        if: steps.fresh.outputs.fresh
        run: |
          version="$(cargo run -q -p xtask --locked -- version next patch)-beta.$GITHUB_RUN_NUMBER"
          cargo run -q -p xtask --locked -- version set "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.fresh.outputs.fresh
        with:
          name: stamp
          path: |
            Cargo.toml
            Cargo.lock
          retention-days: 3

  build:
    needs: version
    if: needs.version.outputs.version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job: gh resolves the repository from here instead of from git.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # The release API creates the tag on the built commit.
      - name: Publish the prerelease
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release create "v$VERSION" --target "$GITHUB_SHA" --prerelease \
            --title "SkillBinder v$VERSION" \
            --generate-notes \
            dist/*
      # Keep the five newest betas; stable releases are never touched.
      - name: Prune old betas
        run: |
          gh release list --limit 200 --exclude-drafts --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)] | .[5:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done
