name: Verify desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libssl-dev libfontconfig1-dev libfreetype-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev mesa-vulkan-drivers xvfb xdotool imagemagick
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Architecture, registry, formatting, lints and tests
        run: node scripts/verify.mjs
      - name: Build native application
        run: cargo build --locked -p skillbinder
      - name: Filesystem feature probes
        run: |
          cargo run --locked -p skillbinder-app --example j01_probe
          cargo run --locked -p skillbinder-app --example j02_probe
          cargo run --locked -p skillbinder-app --example j03_probe
      - name: Build Linux UI fixture
        if: runner.os == 'Linux'
        run: cargo build --locked -p skillbinder --example fixture
      - name: Native Linux smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash scripts/test-native-linux.sh
      - name: Upload native evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-linux
          path: target/native-evidence
          if-no-files-found: ignore
