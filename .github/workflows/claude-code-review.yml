name: Claude Code Review

# The owner's PRs are reviewed when opened or marked ready. A PR from anyone
# else is reviewed only when the owner adds the `claude-review` label. Pushes
# do not trigger a review. Re-adding the label or marking a PR ready again can:
# comments come from github-actions[bot], which the plugin's "Claude already
# commented" check may not recognize.
on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_target:
    types: [labeled]

jobs:
  claude-review:
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_target' &&
        github.event.label.name == 'claude-review' &&
        github.actor == github.repository_owner &&
        github.event.pull_request.author_association != 'OWNER')

    runs-on: ubuntu-latest
    # Claude comments with this job's GITHUB_TOKEN. The Claude GitHub App token
    # exchange rejects pull_request_target OIDC tokens
    # (anthropics/claude-code-action#713), so both paths use the job token.
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      # Under pull_request_target this checks out the base branch. Never check
      # out the PR head here: the job runs with the repository's secrets.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
