name: Claude Code Review

# pull_request_target runs the base branch's workflow with secrets, so fork PRs
# can be reviewed. It never checks out the PR head; Claude reads the diff via gh.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # PRs from anyone but the repository owner wait here until the owner approves
  # the external-pr-review environment (required reviewer) for each run.
  approve-external:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    environment: external-pr-review
    steps:
      - run: echo "Review approved"

  claude-review:
    needs: approve-external
    # Runs after approval, or directly when the approval job was skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The job token is required for the non-write bypass below; the
          # environment approval is the gate for external authors.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: ${{ github.event.pull_request.user.login != github.repository_owner && github.event.pull_request.user.login || '' }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
