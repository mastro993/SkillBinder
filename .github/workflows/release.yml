name: Release

# Cut a release by hand from the Actions tab: bump the version, build every platform, then push
# the bump commit and its tag to `main`, publish the GitHub release, and point the Homebrew cask
# at it. Nothing is pushed unless every platform built and the macOS image was notarized. The push
# bypasses the `main` ruleset with the RELEASE_DEPLOY_KEY deploy key. See docs/release.md.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead (X.Y.Z, newer than the current one)
        type: string
        required: false

# One release at a time, nightlies included: they all create tags.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main, not $GITHUB_REF"
          exit 1
      # Without them the run would fail only after the whole build.
      - name: Require release secrets
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
          UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD != '' }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
        run: |
          missing=""
          for name in RELEASE_DEPLOY_KEY MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER UPDATE_SIGNING_KEY UPDATE_SIGNING_KEY_PASSWORD HOMEBREW_TAP_DEPLOY_KEY; do
            [ "${!name}" = true ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing; see docs/release.md"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-version
      - id: next
        name: Compute and stamp the version
        run: |
          version=$(cargo run -q -p xtask --locked -- version next "${VERSION:-$BUMP}")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          cargo run -q -p xtask --locked -- version set "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: stamp
          path: |
            Cargo.toml
            Cargo.lock
          retention-days: 3

  # Every check `main` runs, again on the shipped commit, beside the build.
  checks:
    needs: version
    uses: ./.github/workflows/checks.yml

  native:
    needs: version
    uses: ./.github/workflows/native.yml

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}

  publish:
    needs: [version, checks, native, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # To dispatch the Catalog workflow, which mirrors the update manifest to Pages.
      actions: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The deploy key is what may push to `main`; the job token only creates the release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: stamp
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-version
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Before the push, so a key that does not open publishes nothing.
      - name: Write and sign the update manifest
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          cargo run -q -p xtask --locked -- update-manifest --version "$VERSION" --dist dist
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
      # The commit holds exactly the tree the build stamped. A push that is not a fast-forward
      # (main moved during the build) fails and publishes nothing; dispatch again.
      - name: Push the release commit and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet --all --message "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
      # Every asset in one call: an immutable release refuses assets added after it is published.
      - name: Publish the GitHub release
        run: |
          gh release create "v$VERSION" --verify-tag --latest \
            --title "SkillBinder v$VERSION" \
            --notes-file packaging/release-notes.md \
            --generate-notes \
            dist/*
      - name: Mirror the update manifest to Pages
        run: gh workflow run catalog.yml --ref main

  # A job of its own, so "Re-run failed jobs" retries only the cask once the release is out.
  homebrew:
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The tap deploy key can write only to mastro993/homebrew-tap.
      - uses: actions/checkout@v4
        with:
          repository: mastro993/homebrew-tap
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Point the Homebrew cask at the release
        run: |
          sha256=$(gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output - \
            | awk -v dmg="skillbinder-$VERSION-universal-apple-darwin.dmg" '$2 == dmg { print $1 }')
          test -n "$sha256"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sha256/" packaging/homebrew/skillbinder.rb \
            > homebrew-tap/Casks/skillbinder.rb
          cd homebrew-tap
          git add Casks/skillbinder.rb
          # A re-run after the push landed has nothing to commit.
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet --message "skillbinder $VERSION"
          git push origin HEAD:main
