name: Catalog

# Builds the Explore catalog (catalog/README.md) and publishes it to GitHub Pages with the app
# update manifests (ADR 0018). It never commits: the history it needs travels with the published
# site (ADR 0014). The Release and Nightly workflows dispatch it after they publish.

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "xtask/src/catalog.rs"
      - "xtask/src/catalog/**"
      - "xtask/src/update_manifest.rs"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

# One build at a time, so two runs never extend the same history.
concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    name: build the catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      counts: ${{ steps.build.outputs.counts }}
      updates: ${{ steps.updates.outputs.updates }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: catalog
          cache-on-failure: true
      - name: Build the site
        id: build
        # Exit 2: skills.sh failed, and the site carries the last counts. Deploy it, then fail.
        run: |
          status=0
          cargo run -p xtask --locked -- catalog --out site || status=$?
          if [ "$status" = 0 ]; then
            echo "counts=fresh" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 2 ]; then
            echo "counts=stale" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      # A deploy replaces the whole site, so every run mirrors the manifests again. Exit 2: the
      # releases could not be read, and the site carries the published manifests. Deploy it,
      # then fail.
      - name: Mirror the update manifests
        id: updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          cargo run -p xtask --locked -- catalog updates --out site || status=$?
          if [ "$status" = 0 ]; then
            echo "updates=fresh" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 2 ]; then
            echo "updates=stale" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      - name: Check catalog format v1
        run: cargo run -p xtask --locked -- catalog check site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}v1/catalog.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Fail on stale counts
        if: needs.build.outputs.counts == 'stale'
        run: |
          echo "::error::skills.sh failed; the catalog was published with the last counts. See the build job's log."
          exit 1
      - name: Fail on stale update manifests
        if: needs.build.outputs.updates == 'stale'
        run: |
          echo "::error::The releases could not be read; the last update manifests were published. See the build job's log."
          exit 1
