[workspace]
resolver = "2"
members = [
  "apps/tauri",
  "crates/app",
  "crates/core",
  "crates/db",
  "crates/platform",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.96"

[workspace.lints.rust]
future_incompatible = "warn"
nonstandard_style = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
needless_collect = { level = "deny", priority = 9 }
large_enum_variant = { level = "deny", priority = 9 }

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = [
  "clock",
  "serde",
] }
diesel = { version = "2.3.13", features = ["sqlite"] }
diesel_migrations = { version = "2.3.0", features = ["sqlite"] }
fs2 = "0.4.3"
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
tauri = "2.11.6"
thiserror = "2.0.20"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
uuid = { version = "1.18.1", features = ["v4"] }
unicode-normalization = "=0.1.24"
yaml-rust2 = "=0.10.4"
