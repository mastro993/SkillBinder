[workspace]
members = ["apps/desktop", "apps/cli", "crates/proto", "crates/engine", "crates/client", "crates/ui", "crates/design", "xtask"]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
log = "0.4"
gpui-kit = "=0.10.0"
gpui-mcp = { git = "https://github.com/mastro993/gpui-mcp", rev = "5a7cc6e33969a29cee2e4c2e08addd8952de17bc", default-features = false, features = ["gpui-pre"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
sha1_smol = "1"
sha2 = "0.10"
# Builds an update review's patch in-process (ADR 0037); GPUI Kit already brings it in.
similar = "2.7"
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time", "macros"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
dunce = "1.0.5"
fs2 = "0.4"
regex = "1"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
yaml-rust2 = "0.11"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
chrono = "0.4"
url = "2.5.8"
# Blocking HTTPS with rustls and no OpenSSL (ADR 0014).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# Signs and verifies the app update manifests (ADR 0018).
minisign = { version = "0.10", default-features = false }
minisign-verify = "0.3"
rustix = { version = "1.1.5", features = ["fs", "process"] }
# Tells a Windows quit at logoff or shutdown, which must not start an app update (spec rule 12),
# and edits the user's PATH for the command line tool (ADR 0024).
winsafe = { version = "0.0.29", default-features = false, features = ["advapi", "user"] }
# The menu bar or system tray icon and its menu (ADR 0021): tray-icon draws it on macOS and
# Windows, ksni on Linux, where it also tells whether a StatusNotifier host can show it.
tray-icon = { version = "0.26", default-features = false }
# Decodes the tray artwork and carries its clicks to the app.
png = "0.18"
async-channel = "2.5"
# The command line tool and the app talk over a local socket or named pipe (ADR 0022).
interprocess = "2.4"
clap = "4.6"
# Ctrl-C stops the command waiting, not the work it asked for (spec rule 3).
ctrlc = "3.5"
# `skillbinder mcp` serves the command's actions as MCP tools over stdio (ADR 0025).
rmcp = { version = "~3.11", default-features = false, features = ["server", "macros", "transport-io", "elicitation"] }
schemars = "1"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
skillbinder-proto = { path = "crates/proto" }
skillbinder-engine = { path = "crates/engine" }
skillbinder-client = { path = "crates/client" }
skillbinder-design = { path = "crates/design" }
skillbinder-ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "warn"
# clippy.toml lists the I/O APIs; forbid stops a crate from allowing them back.
disallowed_methods = "forbid"
disallowed_types = "forbid"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
gpui-pre = { git = "https://github.com/mastro993/gpui-mcp", rev = "5a7cc6e33969a29cee2e4c2e08addd8952de17bc" }
