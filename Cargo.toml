[workspace]
members = ["apps/skillbinder", "crates/proto", "crates/engine", "crates/client", "crates/ui", "crates/theme", "xtask"]
default-members = ["apps/skillbinder"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1.0"
log = "0.4"
ely-gpui-component = { git = "https://github.com/ZacharyZhang-NY/Ely-GPUI-Components", rev = "2f8b2f687cd1e9b98a7cd29d4e882d09406fc547" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", default-features = false, features = ["stacker"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", features = ["font-kit", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time", "macros"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
fs2 = "0.4"
regex = "1"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
yaml-rust2 = "0.11"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
url = "2.5.8"
rustix = { version = "1.1.5", features = ["fs", "process"] }
skillbinder-proto = { path = "crates/proto" }
skillbinder-engine = { path = "crates/engine" }
skillbinder-client = { path = "crates/client" }
skillbinder-theme = { path = "crates/theme" }
skillbinder-ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
