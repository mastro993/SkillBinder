<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="How SkillBinder works"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0077B6"/></marker></defs><text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#5F646B">WHERE SKILLS COME FROM</text><text x="390" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#5F646B">ONE HOME</text><text x="760" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#5F646B">WHERE YOUR AGENTS LOOK</text><path d="M240,110 C315.0,110 315.0,145 390,145" fill="none" stroke="#0077B6" stroke-width="1.5" marker-end="url(#head)"/><rect x="285.2" y="116.5" width="59.599999999999994" height="22" rx="11" fill="#EFF3F8"/><text x="315.0" y="131.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#5F646B">import</text><path d="M240,240 C315.0,240 315.0,185 390,185" fill="none" stroke="#0077B6" stroke-width="1.5" marker-end="url(#head)"/><rect x="281.9" y="201.5" width="66.19999999999999" height="22" rx="11" fill="#EFF3F8"/><text x="315.0" y="216.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#5F646B">install</text><path d="M610,145 C685.0,145 685.0,110 760,110" fill="none" stroke="#0077B6" stroke-width="1.5" marker-end="url(#head)"/><rect x="632.1" y="116.5" width="105.8" height="22" rx="11" fill="#EFF3F8"/><text x="685.0" y="131.5" text-anchor="middle" font-fami