<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Disk image background</title>
<!-- The macOS disk image window's background, 640 x 360 points, for export-brand.sh to capture
     at 1x and 2x: pale slate stone with three rune chevrons leading from SkillBinder at (160, 200)
     to Applications at (480, 200) (packaging/macos/dmgbuild-settings.py). The stone stays pale,
     not the icon's dark slate, because Finder draws the icon labels in black over a background
     picture, even in Dark Mode. -->
<style>html, body { margin: 0; } svg { display: block; }</style>
</head>
<body>
<script>
  // DESIGN.md tokens, as in the icon's Frost scheme.
  const [inner, outer, grain, glow, core] = ['#F4F7FA', '#C5CDD6', 0.1, '#8FCCFB', '#0077B6'];
  const arrows = 'M278 184l16 16-16 16M308 184l16 16-16 16M338 184l16 16-16 16';
  document.body.innerHTML =
    `<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg"><defs>` +
    `<radialGradient id="g" cx=".5" cy=".45" r=".8"><stop offset="0" stop-color="${inner}"/><stop offset="1" stop-color="${outer}"/></radialGradient>` +
    `<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="7"/>` +
    `<feColorMatrix values="0 0 0 0 ${grain} 0 0 0 0 ${grain} 0 0 0 0 ${grain} 0 0 0 .3 -.12"/></filter>` +
    `<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter></defs>` +
    `<rect width="640" height="360" fill="url(#g)"/><rect width="640" height="360" filter="url(#n)"/>` +
    `<g fill="none" stroke-linecap="round" stroke-linejoin="round">` +
    `<path d="${arrows}" stroke="${glow}" stroke-width="7" filter="url(#b)"/>` +
    `<path d="${arrows}" stroke="${core}" stroke-width="3.5"/></g></svg>`;
</script>
</body>
</html>
