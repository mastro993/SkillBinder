  // What a second fetch finds when the source moved after the dialog opened.
  const MOVED_LINE = 'Run `python scripts/fill_form.py <file> <fields.json> --flatten`.';

  /** Line diff by longest common subsequence: fine for a skill's small files. */
  function diffLines(a, b) {
    const A = a ? a.split('\n') : [];
    const B = b ? b.split('\n') : [];
    const L = Array.from({ length: A.length + 1 }, () => new Int32Array(B.length + 1));
    for (let i = A.length - 1; i >= 0; i--)
      for (let j = B.length - 1; j >= 0; j--)
        L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const rows = [];
    let i = 0, j = 0;
    while (i < A.length || j < B.length) {
      if (i < A.length && j < B.length && A[i] === B[j]) { rows.push({ t: ' ', o: i + 1, n: j + 1, text: A[i] }); i++; j++; }
      else if (j < B.length && (i >= A.length || L[i][j + 1] >= L[i + 1][j])) { rows.push({ t: '+', o: null, n: j + 1, text: B[j] }); j++; }
      else { rows.push({ t: '-', o: i + 1, n: null, text: A[i] }); i++; }
    }
    // Deleted lines before added ones within each change, as Kit's unified mode shows them.
    for (let k = 0; k < rows.length;) {
      if (rows[k].t === ' ') { k++; continue; }
      let end = k;
      while (end < rows.length && rows[end].t !== ' ') end++;
      const run = rows.slice(k, end);
      rows.splice(k, run.length, ...run.filter((r) => r.t === '-'), ...run.filter((r) => r.t === '+'));
      k = end;
    }
    return rows;
  }

  function file(path, before, after) {
    const status = before == null ? 'A' : after == null ? 'D' : 'M';
    const rows = diffLines(before, after);
    return {
      path, status, rows,
      add: rows.filter((r) => r.t === '+').length,
      del: rows.filter((r) => r.t === '-').length,
    };
  }

  /** The changes for a dialog state: 'ready', 'drifted' (local edit shows as removed), 'moved'. */
  function files(state) {
    let oldSkill = SKILL_OLD;
    let newSkill = SKILL_NEW;
    if (state === 'drifted') oldSkill = SKILL_OLD.replace('read a PDF.\n', `read a PDF.\n${LOCAL_EDIT}\n`);
    if (state === 'moved') newSkill = SKILL_NEW.replace(/^Run `python scripts\/fill_form.*$/m, MOVED_LINE);
    return [
      file('SKILL.md', oldSkill, newSkill),
      file('scripts/extract.py', EXTRACT_OLD, EXTRACT_NEW),
      file('scripts/fill_form.py', null, FILL_NEW),
      { path: 'assets/form-sample.pdf', status: 'B', rows: [], add: 0, del: 0, binary: 'Binary file changed · 18 KB → 21 KB' },
      file('reference.md', REFERENCE_OLD, null),
    ];
  }

      + '<h2>Tables</h2><p>Tables come out as TSV, one file per table.</p>',
  };
