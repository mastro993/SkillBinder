    ],

  // Copies the user edited in place ("You changed this skill here") and unmanaged
  // same-slug copies ("different copy already there"). Keys: slug@target or slug@ws/dir.

    const raw = workspace(wsId)?.skills[slug];
    return raw === undefined ? null : raw;

    Object.keys(workspace(wsId)?.skills || {}).filter((slug) => workspaceHolds(wsId, slug).length).sort(bySlug);

      presets: map(state.presets, (p) => Object.keys(p.skills).length),

  }
  function removeWorkspaceDir(wsId, slug, dirId) {
    return setWorkspaceDirs(wsId, slug, workspaceHolds(wsId, slug).filter((d) => d !== dirId));
  }

  function problemFor(pair) {
    const key = placeKey(pair.slug, pair.target, pair.ws);
    if (pair.op === 'add' && FOREIGN.has(key)) return 'different';

  function finishPlan(plan) {
    plan.pairs.forEach((p) => { const problem = problemFor(p); if (problem) p.problem = problem; });
    plan.adds = [...new Set(plan.pairs.filter((p) => p.op === 'add').map((p) => p.slug))].sort(bySlug);

      const before = presetHolds(slug);
      const after = presetHolds(slug, presetId);
      before.filter((t) => !after.includes(t)).forEach((t) => pairs.push({ slug, target: t, op: 'remove' }));
      after.filter((t) => !before.includes(t)).forEach((t) => pairs.push({ slug, target: t, op: 'add' }));
    }
    return finishPlan({ kind: 'switch', from: state.activePreset, to: presetId,
      title: `Switching to ${to.name}`, toast: `Switched to ${to.name}`, pairs });
  }
  function switchPreset(presetId) {
    const plan = planSwitch(presetId);
    state.activePreset = presetId;
    emit({ type: 'preset', preset: presetId });
    return plan;
  }
  function deletePreset(presetId) {
    if (presetId === 'default') return null;
    const wasOn = state.activePreset === presetId;
    const plan = wasOn ? planSwitch('default') : null;
    if (plan) Object.assign(plan, { kind: 'delete', title: 'Switching to Default', toast: 'Switched to Default' });
    if (wasOn) state.activePreset = 'default';
    state.presets = state.presets.filter((p) => p.id !== presetId);
    emit({ type: 'preset-deleted', preset: presetId });
    return plan;
  }

  function addSkills({ slugs, targets: chosen, ws }) {
    const pairs = [];
    for (const slug of slugs) {
      const before = ws ? workspaceHolds(ws, slug) : presetHolds(slug);
      const raw = ws ? wsRaw(ws, slug) : presetRaw(slug);
      const next = chosen === 'all' || raw === 'all' ? 'all' : [...new Set([...(raw || []), ...chosen])];
      const holder = ws ? workspace(ws) : activePreset();
      if (ws && Array.isArray(next)) next.forEach((d) => holder.dirs.includes(d) || holder.dirs.push(d));
      writeRaw(holder, slug, next);
      const after = ws ? workspaceHolds(ws, slug) : presetHolds(slug);
      after.filter((t) => !before.includes(t)).forEach((t) => pairs.push({ slug, target: t, ws, op: 'add' }));
    }
    const n = slugs.length;
    const noun = n === 1 ? slugs[0] : `${n} skills`;
    emit({ type: 'add', slugs, ws });
    return finishPlan({ kind: 'add', title: `Adding ${noun}`, toast: `Added ${noun}`, pairs });
  }

  function reset() {
    state = clone(INITIAL);
    emit({ type: 'reset' });
  }
  function on(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  window.DATA = {
    targets, wsDirs, folders, skills, discoveryCount: 2,
    skill, target, wsDir, workspace, preset, activePreset,
    presets: () => state.presets, workspaces: () => state.workspaces,
    presetRaw, presetHolds, wsRaw, workspaceHolds, workspaceDirs,
    isActive, whereActive, agentSkills, workspaceSkills, targetsLabel, isEdited, placeName,
    filterSkills, counts, sidebarCounts,
    setAgents, removeAgent, setWorkspaceDirs, removeWorkspaceDir,
    planSwitch, switchPreset, deletePreset, addSkills, reset, on,
  };
})();

<script>/* ../../scoped-pages/source/kit/shell.js */
(function () {
  'use strict';
  const D = window.DATA;
  const settings = { speed: 'slow', problems: undefined };

  // ---- DOM ------------------------------------------------------------------
  const PROPS = new Set(['checked', 'indeterminate', 'value', 'disabled']);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs == null || typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs)) {
      kids.unshift(attrs);
      attrs = {};
    }
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (PROPS.has(k)) el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    kids.flat(Infinity).forEach((c) => { if (c != null && c !== false) el.append(c instanceof Node ? c : String(c)); });
    return el;
  }
  h.html = function (markup) {
    const t = document.createElement('template');
    t.innerHTML = String(markup).trim();
    return t.content.childNodes.length === 1 ? t.content.firstChild : t.content;
  };
  const ic = (name, size = 16, cls = '') => h.html(window.icon(name, size, cls));
  const winOf = (el) => (el && el.closest && el.closest('.sb-window')) || el;

  // ---- overlay stack: Esc and outside clicks go to the top layer --------------
  const layers = [];
  function pushLayer(layer) {
    layers.push(layer);
    return () => { const i = layers.indexOf(layer); if (i >= 0) layers.splice(i, 1); };
  }
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !layers.length) return;
    e.preventDefault();
    e.stopPropagation();
    const top = layers[layers.length - 1];
    if (top.onEsc) top.onEsc();
  }, true);
  document.addEventListener('mousedown', (e) => {
    const top = layers[layers.length - 1];
    if (top && top.outside && !top.el.contains(e.target) && !(top.anchor && top.anchor.contains(e.target))) top.outside();
  }, true);

  function place(el, anchor, host, { align = 'start', gap = 4 } = {}) {
    const hr = host.getBoundingClientRect();
    const ar = anchor.getBoundingClientRect();
    const ox = hr.left + host.clientLeft;
    const oy = hr.top + host.clientTop;
    const w = el.offsetWidth;
    const ht = el.offsetHeight;
    let left = align === 'end' ? ar.right - ox - w : align === 'center' ? ar.left - ox + ar.width / 2 - w / 2 : ar.left - ox;
    let top = ar.bottom - oy + gap;
    if (top + ht > host.clientHeight - 8 && ar.top - oy - gap - ht >= 8) top = ar.top - oy - gap - ht;
    left = Math.max(8, Math.min(left, host.clientWidth - w - 8));
    top = Math.max(8, Math.min(top, host.clientHeight - ht - 8));
    el.style.left = `${left}px`;
    el.style.top = `${top}px`;
  }

  // ---- tooltips ---------------------------------------------------------------
  let tipEl = null;
  let tipFor = null;
  let tipTimer = 0;
  let tipHiddenAt = 0;
  function hideTip() {
    clearTimeout(tipTimer);
    if (tipEl) { tipEl.remove(); tipEl = null; tipHiddenAt = Date.now(); }
    tipFor = null;
  }
  function showTip(t) {
    const text = t.getAttribute('data-tip');
    if (!text || !t.isConnected) return;
    const host = t.closest('.sb-window');
    tipEl = h('div', { class: 'sb-tooltip', role: 'tooltip' }, text);
    if (host) {
      host.append(tipEl);
      place(tipEl, t, host, { align: 'center', gap: 6 });
      return;
    }
    document.body.append(tipEl);
    const r = t.getBoundingClientRect();
    const max = document.documentElement.clientWidth - tipEl.offsetWidth - 4;
    tipEl.style.left = `${Math.max(4, Math.min(r.left + r.width / 2 - tipEl.offsetWidth / 2, max)) + window.scrollX}px`;
    tipEl.style.top = `${r.bottom + 6 + window.scrollY}px`;
  }
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (t === tipFor) return;
    hideTip();
    if (!t) return;
    tipFor = t;
    tipTimer = setTimeout(() => showTip(t), Date.now() - tipHiddenAt < 400 ? 0 : 350);
  });
  document.addEventListener('mouseout', (e) => { if (!e.relatedTarget) hideTip(); });
  document.addEventListener('mousedown', hideTip, true);
  document.addEventListener('focusout', hideTip);
  document.addEventListener('scroll', (e) => {
    hideTip();
    if (openPop && !openPop.el.contains(e.target)) openPop.close();
  }, true);

  // ---- toast ------------------------------------------------------------------
  function toast(win, html, { action, onAction, ms = 4000, icon } = {}) {
    win = winOf(win);
    win.querySelectorAll(':scope > .sb-toast').forEach((t) => t.remove());
    const el = h('div', { class: `sb-toast${action ? ' has-action' : ''}`, role: 'status' },
      icon ? ic(icon, 15) : null,
      h('span', { class: 'sb-toast-text', html }),
      action ? h('button', { class: 'sb-toast-action', onclick: () => { close(); if (onAction) onAction(); } }, action) : null);
    win.append(el);
    let timer = setTimeout(close, ms);
    el.addEventListener('mouseenter', () => clearTimeout(timer));
    el.addEventListener('mouseleave', () => { timer = setTimeout(close, 1500); });
    function close() {
      clearTimeout(timer);
      if (!el.isConnected || el.classList.contains('is-leaving')) return;
      el.classList.add('is-leaving');
      setTimeout(() => el.remove(), 180);
    }
    return { el, close };
  }

  // ---- dialogs ----------------------------------------------------------------
  function openDialog(win, { title = '', body, footer, size = '', dismissible = true, top = false, onClose } = {}) {
    win = winOf(win);
    let closed = false;
    const titleEl = h('div', { class: 'sb-dialog-title' });
    const closeBtn = h('button', { class: 'sb-btn sb-btn-icon sb-btn-sm', 'aria-label': 'Close', onclick: () => api.close() }, ic('close', 16));
    const bodyEl = h('div', { class: 'sb-dialog-body' });
    const footEl = h('div', { class: 'sb-dialog-footer' });
    const box = h('div', { class: `sb-dialog${size ? ` sb-dialog-${size}` : ''}`, role: 'dialog', 'aria-modal': 'true', tabindex: '-1' },
      h('div', { class: 'sb-dialog-header' }, titleEl, closeBtn), bodyEl, footEl);
    const scrim = h('div', { class: `sb-scrim${top || size === 'lg' ? ' is-top' : ''}` }, box);
    scrim.addEventListener('mousedown', (e) => { if (e.target === scrim && api.dismissible) api.close(); });
    const asNodes = (v) => [v].flat(Infinity).filter((n) => n != null && n !== false).map((n) => (typeof n === 'string' ? h('div', n) : n));
    const api = {
      el: box, scrim, body: bodyEl, footer: footEl, dismissible, onClose,
      setTitle(text, iconHtml) {
        titleEl.replaceChildren(...(iconHtml ? [h.html(iconHtml)] : []), h('span', text));
      },
      setBody(...nodes) { bodyEl.replaceChildren(...asNodes(nodes)); },
      setFooter(...nodes) { footEl.replaceChildren(...asNodes(nodes)); },
      setDismissible(v, { closeButton = v } = {}) { api.dismissible = v; closeBtn.hidden = !closeButton; },
      close(result) {
        if (closed) return;
        closed = true;
        popLayer();
        scrim.remove();
        if (api.onClose) api.onClose(result);
      },
    };
    const popLayer = pushLayer({ el: box, onEsc: () => api.dismissible && api.close() });
    api.setTitle(title);
    api.setBody(body ?? []);
    api.setFooter(footer ?? []);
    api.setDismissible(dismissible);
    win.append(scrim);
    (box.querySelector('[data-autofocus]') || box).focus({ preventScroll: true });
    return api;
  }

  function confirmDialog(win, { title, body, confirm = 'Remove', cancel = 'Cancel', danger = true } = {}) {
    return new Promise((resolve) => {
      let ok = false;
      const d = openDialog(win, {
        title, size: 'sm', body: body ? h('div', { class: 'sb-muted' }, body) : [],
        onClose: () => resolve(ok),
        footer: [
          h('button', { class: 'sb-btn sb-btn-outline', onclick: () => d.close() }, cancel),
          h('button', { class: `sb-btn ${danger ? 'sb-btn-danger' : 'sb-btn-primary'}`, 'data-autofocus': '',
            onclick: () => { ok = true; d.close(); } }, confirm),
        ],
      });
    });
  }

  const PROBLEMS = {
    different: { text: 'Different copy there', yes: 'Replace', no: 'Keep' },
    edited: { text: 'You changed it here', yes: 'Replace', no: 'Keep' },
    unwritable: { text: "Can't write the folder", yes: 'Retry', no: 'Skip' },
  };
  const KINDS = Object.keys(PROBLEMS);
  const stepText = (p) => (p.op === 'remove'
    ? `Removing ${p.slug} from ${D.placeName(p)}`
    : `Copying ${p.slug} → ${D.placeName(p)}`);
  const warnIcon = (size) => `<span style="color:var(--sb-warning);display:grid">${window.icon('alert-circle', size)}</span>`;

  function pickProblems(pairs, problems) {
    if (typeof problems !== 'number') return pairs.filter((p) => p.problem).map((p) => ({ ...p }));
    const n = Math.min(problems, pairs.length);
    return Array.from({ length: n }, (_, k) => ({ ...pairs[Math.floor(((k + 0.5) * pairs.length) / n)], problem: KINDS[k % KINDS.length] }));
  }

  function progressDialog(win, { title, plan, problems = settings.problems, speed = settings.speed, toast: toastText } = {}) {
    win = winOf(win);
    const pairs = (plan && plan.pairs) || [];
    const heading = title || (plan && plan.title) || 'Working';
    const doneToast = toastText === undefined ? plan && plan.toast : toastText;
    const issues = pickProblems(pairs, problems);
    return new Promise((resolve) => {
      if (!pairs.length) { resolve({ problems: [] }); return; }
      const total = pairs.length;
      const totalMs = speed === 'fast' ? 160 : speed === 'slow' ? Math.min(5200, Math.max(2400, total * 240)) : Number(speed) || 1500;
      // Input is blocked from the first moment; the dialog itself appears after 300 ms.
      const blocker = h('div', { style: 'position:absolute;inset:0;z-index:69' });
      const popBlock = pushLayer({ el: blocker });
      win.append(blocker);
      let done = 0;
      let shownAt = 0;
      let d = null;
      const bar = h('span');
      const pct = h('span', { class: 'sb-progress-pct' }, '0%');
      const step = h('div', { class: 'sb-progress-step' }, stepText(pairs[0]));
      const render = () => {
        const p = Math.round((done / total) * 100);
        bar.style.width = `${p}%`;
        pct.textContent = `${p}%`;
        if (done < total) step.textContent = stepText(pairs[done]);
      };
      const show = () => {
        if (d) return;
        shownAt = Date.now();
        d = openDialog(win, { title: heading, size: 'md', dismissible: false,
          body: [h('div', { class: 'sb-progress-row' }, h('div', { class: 'sb-progress' }, bar), pct), step] });
      };
      const showTimer = setTimeout(show, 300);
      const tick = () => {
        done += 1;
        render();
        if (done < total) setTimeout(tick, totalMs / total);
        else finish();
      };
      setTimeout(tick, totalMs / total);

      function finish() {
        clearTimeout(showTimer);
        const wait = d ? Math.max(0, 500 - (Date.now() - shownAt)) : 0;
        setTimeout(() => {
          popBlock();
          blocker.remove();
          if (issues.length) showDone();
          else {
            if (d) d.close();
            if (doneToast) toast(win, doneToast, { icon: 'check-circle' });
            resolve({ problems: [] });
          }
        }, wait);
      }
      function showDone() {
        show();
        const n = issues.length;
        d.setTitle(`Done · ${n} need${n === 1 ? 's' : ''} attention`, warnIcon(18));
        d.setDismissible(true, { closeButton: false });
        step.textContent = issues.map((p) => p.slug).filter((s, i, a) => a.indexOf(s) === i).join(', ');
        d.setFooter(
          h('button', { class: 'sb-btn sb-btn-primary', 'data-autofocus': '', onclick: () => { d.close(); reviewDialog(win, issues); } }, 'Review'),
          h('button', { class: 'sb-btn sb-btn-outline', onclick: () => d.close() }, 'Close'));
        d.el.querySelector('[data-autofocus]').focus({ preventScroll: true });
        d.onClose = () => resolve({ problems: issues });
      }
    });
  }

  function reviewDialog(win, items) {
    return new Promise((resolve) => {
      const rows = items.map((it) => {
        const base = PROBLEMS[it.problem] || PROBLEMS.different;
        // An edited copy met while removing the skill: the choice is Remove / Keep, not Replace.
        const kind = it.problem === 'edited' && it.op === 'remove' ? { ...base, yes: 'Remove' } : base;
        const done = { Retry: 'Done', Remove: 'Removed' }[kind.yes] || 'Replaced';
        const end = h('div', { class: 'sb-row-end' });
        const settle = (label) => end.replaceChildren(h('span', { class: 'sb-hstack sb-muted sb-small', style: 'gap:4px' }, ic('check', 14), label));
        end.append(
          h('button', { class: 'sb-btn sb-btn-primary sb-btn-sm', onclick: () => settle(done) }, kind.yes),
          h('button', { class: 'sb-btn sb-btn-outline sb-btn-sm', onclick: () => settle(kind.no === 'Skip' ? 'Skipped' : 'Kept') }, kind.no));
        return h('div', { class: 'sb-row' },
          h('div', { class: 'sb-row-main' },
            h('div', { class: 'sb-row-title' }, h('span', { class: 'sb-slug' }, it.slug), h('span', { class: 'sb-muted sb-ellipsis' }, `→ ${D.placeName(it)}`)),
            h('div', { class: 'sb-meta' }, h.html(warnIcon(13)), kind.text)),
          end);
      });
      const d = openDialog(win, {
        title: `${items.length} need${items.length === 1 ? 's' : ''} attention`, size: 'md', onClose: resolve,
        body: h('div', { class: 'sb-card' }, rows),
        footer: h('button', { class: 'sb-btn sb-btn-outline', onclick: () => d.close() }, 'Done'),
      });
    });
  }

  // ---- popover / menu ----------------------------------------------------------
  let openPop = null;
  function popover(win, anchor, content, { align = 'start', className = '', onClose } = {}) {
    win = winOf(win || anchor);
    if (openPop) {
      const same = openPop.anchor === anchor;
      openPop.close();
      if (same) return null;
    }
    const el = h('div', { class: `sb-menu ${className}` }, content);
    win.append(el);
    place(el, anchor, win, { align });
    anchor.setAttribute('aria-expanded', 'true');
    let closed = false;
    const api = {
      el, anchor,
      reposition: () => place(el, anchor, win, { align }),
      close() {
        if (closed) return;
        closed = true;
        popLayer();
        el.remove();
        anchor.setAttribute('aria-expanded', 'false');
        if (openPop === api) openPop = null;
        if (onClose) onClose();
      },
    };
    const popLayer = pushLayer({ el, anchor, onEsc: () => api.close(), outside: () => api.close() });
    openPop = api;
    return api;
  }

  function menu(win, anchor, items, opts = {}) {
    let api = null;
    const build = () => (typeof items === 'function' ? items() : items).map((it) => {
      if (it === '-' || it.sep) return h('div', { class: 'sb-menu-sep' });
      if (it.heading) return h('div', { class: 'sb-menu-heading' }, it.heading);
      return h('button', {
        class: `sb-menu-item${it.danger ? ' is-danger' : ''}`, disabled: !!it.disabled, 'data-tip': it.tip,
        onclick: () => {
          if (it.onSelect) it.onSelect(it);
          if (!it.keepOpen) api.close();
          else if (api) api.el.replaceChildren(...build());
        },
      },
      it.icon ? h('span', { class: 'sb-menu-ic', html: it.icon }) : null,
      h('span', { class: 'sb-ellipsis' }, it.label),
      h('span', { class: 'sb-menu-trail', html: it.checked ? window.icon('check', 15) : it.trail || '' }));
    });
    api = popover(win, anchor, build(), opts);
    return api;
  }

  // ---- widgets ------------------------------------------------------------------
  const LOGOS = new Set(['claude-code', 'cline', 'codex', 'cursor', 'fx', 'kimi-code-cli', 'pi', 'warp', 'windsurf', 'github-copilot']);
  const resolveItem = (item) => (typeof item === 'string' ? D.target(item) || D.wsDir(item) : item);
  const tipOf = (item) => [item.name, item.members ? item.members.join(', ') : item.tip].filter(Boolean).join('\n');

  function avatar(item, { size = 18, tip = true, stack = false } = {}) {
    item = resolveItem(item);
    if (stack && item.memberLogos) {
      return h('span', { class: 'sb-avatar-stack', 'data-tip': tip ? tipOf(item) : null },
        item.memberLogos.map((logo) => avatar({ name: logo, logo }, { size, tip: false })));
    }
    const kind = window.isColorLogo(item.logo) ? 'is-color' : LOGOS.has(item.logo) ? '' : 'is-glyph';
    return h('span', { class: `sb-avatar ${kind}`, style: `--sz:${size}px`, 'data-tip': tip ? tipOf(item) : null,
      html: window.icon(item.logo, size) });
  }
  function avatarStack(items, { size = 18, max = 4 } = {}) {
    const list = items.map(resolveItem);
    const shown = list.length > max ? list.slice(0, max - 1) : list;
    const rest = list.slice(shown.length);
    return h('span', { class: 'sb-avatar-stack' }, shown.map((it) => avatar(it, { size })),
      rest.length ? h('span', { class: 'sb-avatar sb-avatar-more', style: `--sz:${size}px`, 'data-tip': rest.map((r) => r.name).join('\n') }, `+${rest.length}`) : null);
  }
  function pill(item, on, { onClick, iconOnly = false, disabled = false, tip } = {}) {
    item = resolveItem(item);
    const autoTip = iconOnly || item.members || item.tip ? tipOf(item) : null;
    return h('button', {
      class: `sb-pill${on ? ' is-on' : ''}${iconOnly ? ' is-icon' : ''}`, 'aria-pressed': String(!!on),
      disabled, 'data-tip': tip === undefined ? autoTip : tip, onclick: onClick,
    }, h('span', { class: 'sb-pill-logo', html: window.icon(item.logo, 15) }), iconOnly ? null : item.name);
  }
  function wsChip(ws, { dirs, onClick } = {}) {
    ws = typeof ws === 'string' ? D.workspace(ws) : ws;
    const names = (dirs || []).map((d) => D.wsDir(d).name).join(', ');
    return h(onClick ? 'button' : 'span', { class: 'sb-chip', onclick: onClick, 'data-tip': names ? `${ws.name}\n${names}` : ws.name },
      ic('code-folder', 13), ws.name);
  }
  function presetChip({ tip } = {}) {
    const p = D.activePreset();
    return h('span', { class: 'sb-chip', 'data-tip': tip || `Saved to ${p.name}` }, h('span', { class: `sb-dot sb-tint-${p.color}` }), p.name);
  }
  function checkbox({ checked = false, indeterminate = false, disabled = false, onChange, label, tip } = {}) {
    const input = h('input', { type: 'checkbox', class: 'sb-checkbox', checked, indeterminate, disabled,
      'data-tip': label ? null : tip, onchange: (e) => onChange && onChange(e.target.checked, e) });
    return label ? h('label', { class: 'sb-check-label', 'data-tip': tip }, input, label) : input;
  }
  function seg(options, value, onChange) {
    const el = h('div', { class: 'sb-seg', role: 'tablist' });
    options.forEach((o) => el.append(h('button', {
      class: o.id === value ? 'is-active' : '', role: 'tab', 'data-id': o.id, 'data-tip': o.tip, 'aria-label': o.label || o.tip,
      onclick: () => {
        el.querySelectorAll('button').forEach((b) => b.classList.toggle('is-active', b.dataset.id === o.id));
        if (onChange) onChange(o.id);
      },
    }, o.icon ? h.html(o.icon) : null, o.label || null, o.count != null ? h('span', { class: 'sb-seg-count' }, o.count) : null)));
    return el;
  }
  function tabs(options, value, onChange, { onAdd } = {}) {
    const el = h('div', { class: 'sb-tabs' });
    options.forEach((o, i) => {
      el.append(h('button', { class: `sb-tab${o.id === value ? ' is-active' : ''}`, onclick: () => onChange && onChange(o.id) }, o.label));
      if (i === 0) el.append(h('span', { class: 'sb-tabs-sep' }));
    });
    if (onAdd) el.append(h('button', { class: 'sb-btn sb-btn-icon sb-btn-sm', 'data-tip': 'Add folder', onclick: onAdd }, ic('plus', 15)));

    const shown = new Set(local.map((s) => s.slug));
    const remote = wantsRemote ? new Promise((done) => setTimeout(() => done(
      matches([...index.values()].filter((s) => s.origin === 'skills.sh' && !shown.has(s.slug)), q)), settings.remoteMs)) : null;
    return { query: q, source: source || null, local, remote, offline };
  }

  // ---- install (I1-I6, R3) -------------------------------------------------------------
  const inLibrary = (slug) => !!lib[slug];
  function installState(slug) {
    const s = skill(slug);
    if (lib[slug]) return s && lib[slug].source === s.repo ? 'in-library' : 'collision';
    if (installing.has(slug)) return 'installing';
    if (!settings.git) return 'needs-git';
    return failed.has(slug) ? 'failed' : 'install';
  }
  const installError = (slug) => failed.get(slug) || null;
  const collisionTip = (slug) => `Your library has another skill named ${slug}`;
  function install(slug) {
    const st = installState(slug);
    if (st !== 'install' && st !== 'failed') return Promise.resolve({ ok: false, state: st });
    const s = skill(slug);
    failed.delete(slug);
    installing.add(slug);
    emit({ type: 'install', slug });
    return new Promise((done) => setTimeout(() => {
      installing.delete(slug);
      if (s.private && !settings.access) {
        const error = `Couldn't install. Check your access to ${s.repo}.`;
        failed.set(slug, error);
        emit({ type: 'failed', slug });
        done({ ok: false, error });
        return;
      }
      lib[slug] = { slug, desc: s.desc, source: s.repo, isNew: true };
      emit({ type: 'installed', slug });
      done({ ok: true });
    }, settings.installMs));
  }
  const installable = (repoId) => repoSkills(repoId).filter((s) => !lib[s.slug] && !installing.has(s.slug)).map((s) => s.slug);
  const installAll = (repoId) => Promise.all(installable(repoId).map(install));

  // ---- library and New (N1, N2) ---------------------------------------------------------
  const librarySkills = () => Object.values(lib).sort((a, b) => a.slug.localeCompare(b.slug));
  const isNew = (slug) => !!(lib[slug] && lib[slug].isNew && !seen.has(slug));
  function markSeen(slug) {
    if (!isNew(slug)) return;
    seen.add(slug);
    emit({ type: 'seen', slug });
  }

  // ---- repositories (R1-R4) -----------------------------------------------------------
  const repoId = (p) => `${p.owner}-${p.name}`.toLowerCase();
  function listRepository(url) {
    const p = repoFromUrl(url);
    return new Promise((done) => setTimeout(() => {
      if (!p) return done({ state: 'invalid' });
      const have = repos.find((r) => r.full.toLowerCase() === p.full.toLowerCase());
      if (have) return done({ state: 'already-added', repo: have });
      if (!settings.online || /gitlab\.internal|unreachable/.test(url)) return done({ state: 'unreachable' });
      const list = ADDABLE[p.full] || (/empty/.test(p.name) ? [] : [
        [`${p.name}-conventions`, `Follow the ${p.name} conventions.`], [`${p.name}-setup`, `Set up ${p.name} locally.`],
        [`${p.name}-release`, `Release ${p.name} step by step.`]]);
      if (!list.length) return done({ state: 'no-skills' });
      done({ state: 'found', repo: { id: repoId(p), name: p.name, owner: p.owner, full: p.full, url, private: url.startsWith('git@') },
        skills: list.map(([slug, desc]) => ({ slug, desc })) });
    }, 1100));
  }
  function addRepository(url) {
    return listRepository(url).then((res) => {
      if (res.state !== 'found') return res;
      const r = addRepo(res.repo.id, url, res.repo.private, res.skills.map((s) => [s.slug, s.desc]));
      emit({ type: 'repo', id: r.id });
      return Object.assign(res, { repo: r });
    });
  }
  function removeRepository(id) {
    const at = repos.findIndex((r) => r.id === id);
    if (at < 0) return () => {};
    const [r] = repos.splice(at, 1);
    const kept = r.slugs.map((s) => [s, index.get(s)]);
    r.slugs.forEach((s) => index.delete(s));
    emit({ type: 'repo', id });
    return () => {
      repos.splice(at, 0, r);
      kept.forEach(([s, v]) => index.set(s, v));
      emit({ type: 'repo', id });
    };
  }

  // ---- text ------------------------------------------------------------------------------
  function fmtInstalls(n) {
    if (n == null) return '';
    if (n >= 1e6) return `${+(n / 1e6).toFixed(1)}M`;
    return n >= 1000 ? `${+(n / 1000).toFixed(1)}k` : String(n);
  }
  const installsLabel = (s) => (s && s.installsWeek ? `+${fmtInstalls(s.installsWeek)} this week` : '');
  function skillMd(slug) {
    const s = skill(slug);
    const body = MD[slug] || `# ${slug}\n\n${s.desc}\n\n## When to use\nAsk for it by name, or describe the task.`;
    return new Promise((done) => setTimeout(() => done(`---\nname: ${slug}\ndescription: ${s.desc}\n---\n\n${body}`), 400));
  }

  function setSetting(key, value) {
    settings[key] = value;
    emit({ type: 'settings', key });
  }

  window.CATALOG = {
    settings, setSetting, skill, creator, repo, creators: rankedCreators, creatorSkills, repoSkills,
    repositories: () => repos.slice(), trending, sources, status, sourceLabel, search,
    installState, install, installError, collisionTip, installable, installAll,
    librarySkills, inLibrary, isNew, markSeen, listRepository, addRepository, removeRepository,
    skillMd, fmtInstalls, installsLabel, reset,
    on(fn) { listeners.add(fn); return () => listeners.delete(fn); },
  };
})();

<script>/* explore-kit.js */
(function () {
  'use strict';
  const C = window.CATALOG;
  const { h, ic, toast, seg, spinner, emptyState, renderSidebar } = window.SB;

  function live(el, draw) {
    const born = Date.now();
    const off = C.on(() => {
      if (el.isConnected) draw(el);
      else if (Date.now() - born > 1000) off();
    });
    draw(el);
    return el;
  }

  // ---- sidebar (G1) ---------------------------------------------------------------------
  function patchSidebar(el) {
    const row = el.querySelector('[data-nav="discovery"]');
    if (row) {
      row.dataset.nav = 'explore';
      row.querySelector('.sb-nav-label').textContent = 'Explore';
      const n = row.querySelector('.sb-nav-count');
      if (n) n.remove();
    }
    const lib = el.querySelector('[data-nav="library"] .sb-nav-count');
    if (lib) lib.textContent = C.librarySkills().length;
  }
  function exploreSidebar(el, opts = {}) {
    const active = opts.active === 'explore' || !opts.active ? 'discovery' : opts.active;
    renderSidebar(el, { onPreset: opts.onPreset, active, onNav: (k) => {
      const key = k === 'discovery' ? 'explore' : k;
      if (opts.onNav) opts.onNav(key);
      else exploreSidebar(el, Object.assign({}, opts, { active: key }));
    } });
    if (!el.__exObs) {
      el.__exObs = new MutationObserver(() => patchSidebar(el));
      el.__exObs.observe(el, { childList: true });
      C.on(() => patchSidebar(el));
    }
    patchSidebar(el);
  }

  // ---- marks ----------------------------------------------------------------------------
  function creatorAvatar(c, { size = 20 } = {}) {
    c = typeof c === 'string' ? C.creator(c) : c;
    return h('span', { class: 'ex-avatar', 'aria-hidden': 'true', style: `--tint:${c.color};--sz:${size}px` }, c.initials);
  }
  function creatorChip(c, { onClick, active = false } = {}) {
    return h('button', { class: `ex-creator${active ? ' is-active' : ''}`, onclick: onClick, 'aria-pressed': String(active) },
      creatorAvatar(c, { size: 28 }), h('span', { class: 'ex-creator-text' },
        h('span', { class: 'ex-creator-name' }, c.id), h('span', { class: 'ex-creator-count' }, `${c.skillCount} skills`)));
  }
  const newChip = () => h('span', { class: 'ex-new' }, 'New');
  function installsMeta(s) {
    const t = C.installsLabel(s);
    return t ? h('span', { class: 'ex-installs', 'data-tip': 'Installs over the last 7 days' }, ic('fire', 12), t) : null;
  }
  function sourceTag(s) {
    if (s.origin === 'catalog') return h('span', { class: 'ex-source', 'data-tip': s.repo }, creatorAvatar(s.creator, { size: 14 }), s.creator);
    if (s.origin === 'skills.sh') return h('span', { class: 'ex-source', 'data-tip': `${s.repo} · skills.sh` }, ic('globe', 13), 'skills.sh');
    return h('span', { class: 'ex-source', 'data-tip': s.repo }, ic(s.private ? 'lock' : 'github', 13), C.sourceLabel(s));
  }
  const sectionHeader = (title, { icon, action } = {}) => h('div', { class: 'ex-section' },
    icon ? ic(icon, 15) : null, h('span', { class: 'ex-section-title' }, title), action ? h('span', { class: 'ex-section-end' }, action) : null);

  // ---- install (I1-I6, R3) ----------------------------------------------------------------
  function installAction(slug, { win, size = 'sm', onShowLibrary } = {}) {
    const go = (e) => {
      e.stopPropagation();
      C.install(slug).then((r) => {
        if (r.ok && win) toast(win, `Installed ${slug}`, { icon: 'check-circle', action: 'Show in Library', onAction: onShowLibrary });
      });
    };
    const btn = (attrs, ...kids) => h('button', Object.assign({ class: `sb-btn sb-btn-outline sb-btn-${size}` }, attrs), ...kids);
    const wrap = h('span', { class: 'ex-install', onclick: (e) => e.stopPropagation() });
    return live(wrap, () => {
      const st = C.installState(slug);
      const blocked = (tip) => h('span', { 'data-tip': tip, tabindex: '0' }, btn({ disabled: true }, 'Install'));
      wrap.replaceChildren(
        st === 'in-library' ? h('span', { class: 'ex-inlib' }, ic('check', 13), 'In library')
          : st === 'installing' ? btn({ disabled: true, 'aria-label': `Installing ${slug}` }, spinner(13), 'Installing')
            : st === 'collision' ? blocked(C.collisionTip(slug))
              : st === 'needs-git' ? blocked('Installing needs Git')
                : btn({ onclick: go, 'aria-label': `Install ${slug}` }, 'Install'));
    });
  }
  const installErrorLine = (slug) => live(h('div', { class: 'ex-error', role: 'status' }), (el) => {
    const err = C.installError(slug);
    el.hidden = !err;
    el.replaceChildren(...(err ? [ic('alert-circle', 13), err] : []));
  });
  function installAllButton(repoId, { win } = {}) {
    const wrap = h('span', { class: 'ex-install', onclick: (e) => e.stopPropagation() });
    return live(wrap, () => {
      const left = C.installable(repoId);
      const busy = C.repoSkills(repoId).some((s) => C.installState(s.slug) === 'installing');
      const cls = 'sb-btn sb-btn-outline sb-btn-sm';
      wrap.replaceChildren(...(busy ? [h('button', { class: cls, disabled: true }, spinner(13), 'Installing')]
        : !left.length ? []
          : !C.settings.git ? [h('span', { 'data-tip': 'Installing needs Git', tabindex: '0' }, h('button', { class: cls, disabled: true }, `Install all (${left.length})`))]
            : [h('button', { class: cls, onclick: () => C.installAll(repoId).then((rs) => {
              const ok = rs.filter((r) => r.ok).length;
              if (ok && win) toast(win, `Installed ${ok} skills`, { icon: 'check-circle' });
            }) }, `Install all (${left.length})`)]));
    });
  }

  // ---- detail panel (P1) ----------------------------------------------------------------
  function skillDetail(slug, { win, onShowLibrary, onCreator } = {}) {
    const s = C.skill(slug);
    const md = h('div', { class: 'ex-md is-loading' }, spinner(14));
    C.skillMd(slug).then((t) => { md.classList.remove('is-loading'); md.replaceChildren(h('pre', t)); });
    const repoLink = h('button', { class: 'ex-link', 'data-tip': 'Open in browser', onclick: () => win && toast(win, `Opens ${s.url.replace(/^https:\/\//, '')}`) },
      ic(s.private ? 'lock' : 'github', 14), h('span', { class: 'sb-ellipsis' }, s.repo));
    const by = s.origin === 'catalog'
      ? h('button', { class: 'ex-link', onclick: () => onCreator && onCreator(s.creator) }, creatorAvatar(s.creator, { size: 16 }), s.creator)
      : sourceTag(s);
    return h('div', { class: 'ex-detail' },
      h('div', { class: 'ex-detail-head' }, h('div', { class: 'ex-detail-title' }, s.name),
        installAction(slug, { win, onShowLibrary })),
      h('div', { class: 'ex-detail-desc' }, s.desc),
      installErrorLine(slug),
      h('div', { class: 'ex-detail-meta' }, by, repoLink, installsMeta(s)),
      h('div', { class: 'ex-detail-label' }, 'Files', h('span', { class: 'sb-chip-count' }, s.files.length)),
      h('ul', { class: 'ex-files' }, s.files.map((f) => h('li', ic(f.includes('/') ? 'code' : 'book', 13), f))),
      h('div', { class: 'ex-detail-label' }, 'SKILL.md'), md);
  }
  function openSheet(win, content, { width = 340, onClose } = {}) {
    win = win.closest ? win.closest('.sb-window') || win : win;
    const close = () => {
      if (!scrim.isConnected) return;
      document.removeEventListener('keydown', esc, true);
      scrim.remove();
      if (onClose) onClose();
    };
    const esc = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
    const panel = h('aside', { class: 'ex-sheet', role: 'dialog', 'aria-modal': 'true', style: `--ex-sheet-w:${width}px` },
      h('button', { class: 'sb-btn sb-btn-icon sb-btn-sm ex-sheet-close', 'aria-label': 'Close', 'data-tip': 'Close', 'data-tip-pos': 'end', onclick: close }, ic('close', 15)),
      content);
    const scrim = h('div', { class: 'ex-scrim', onmousedown: (e) => { if (e.target === scrim) close(); } }, panel);
    win.append(scrim);
    document.addEventListener('keydown', esc, true);
    return { el: panel, close };
  }

  // ---- offline (C4) and demo controls ---------------------------------------------------
  const offlineLine = () => (C.status() === 'offline'
    ? h('div', { class: 'ex-offline' }, ic('cloud', 13), 'Offline · showing the saved catalog') : null);
  const unavailableState = (onRetry) => emptyState({ icon: 'cloud', title: "Couldn't load the catalog",
    action: h('button', { class: 'sb-btn sb-btn-outline sb-btn-sm', onclick: onRetry }, 'Retry') });
  function exploreControls() {
    const net = () => (C.settings.online ? 'on' : C.settings.cache ? 'off' : 'nocache');
    return h('div', { class: 'sb-hstack', style: 'gap:6px;flex-wrap:wrap' },
      seg([{ id: 'git', label: 'Git' }, { id: 'nogit', label: 'No Git' }], C.settings.git ? 'git' : 'nogit', (v) => C.setSetting('git', v === 'git')),
      seg([{ id: 'on', label: 'Online' }, { id: 'off', label: 'Offline' }, { id: 'nocache', label: 'First use offline' }], net(), (v) => {
        C.settings.cache = v !== 'nocache';
        C.setSetting('online', v === 'on');
      }),
      seg([{ id: 'yes', label: 'Access' }, { id: 'no', label: 'No access', tip: 'Installing from the private repository fails' }],
        C.settings.access ? 'yes' : 'no', (v) => C.setSetting('access', v === 'yes')));
  }

  window.EX = { live, exploreSidebar, creatorAvatar, creatorChip, newChip, installsMeta, sourceTag, sectionHeader,
    installAction, installErrorLine, installAllButton, skillDetail, openSheet, offlineLine, unavailableState, exploreControls };
  Object.assign(window, window.EX);
})();

<script>/* skill-detail.js */
(function () {
  'use strict';
  const C = window.CATALOG;
  const { h, ic, toast, spinner } = window.SB;
  const { live, installAction, installErrorLine, creatorAvatar, installsMeta, sourceTag } = window.EX;

  // ---- SKILL.md as text: headings, paragraphs, lists, code ------------------------------
  const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  function markdown(src) {
    const lines = src.replace(/^---\n[\s\S]*?\n---\n+/, '').split('\n');
    const out = [];
    let para = [];
    let list = null;
    const flush = () => {
      if (para.length) out.push(`<p>${inline(para.join(' '))}</p>`);
      if (list) out.push(`<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join('')}</${list.tag}>`);
      para = [];
      list = null;
    };
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (l.startsWith('```')) {
        flush();
        const code = [];
        while (++i < lines.length && !lines[i].startsWith('```')) code.push(lines[i]);
        out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
        continue;
      }
      const hd = l.match(/^(#{1,3})\s+(.*)/);
      const li = l.match(/^\s*(?:[-*]|(\d+)\.)\s+(.*)/);
      if (hd) {
        flush();
        out.push(`<h${hd[1].length}>${inline(hd[2])}</h${hd[1].length}>`);
      } else if (li) {
        const tag = li[1] ? 'ol' : 'ul';
        if (para.length || (list && list.tag !== tag)) flush();
        if (!list) list = { tag, items: [] };
        list.items.push(li[2]);
      } else if (!l.trim()) {
        flush();
      } else {
        if (list) flush();
        para.push(l.trim());
      }
    }
    flush();
    return h('div', { class: 'sd-md', html: out.join('') });
  }

  // ---- files: folders collapse, folders first ---------------------------------------------
  function fileTree(paths) {
    const root = { dirs: new Map(), files: [] };
    paths.forEach((p) => {
      const segs = p.split('/');
      let n = root;
      segs.slice(0, -1).forEach((d) => {
        if (!n.dirs.has(d)) n.dirs.set(d, { dirs: new Map(), files: [] });
        n = n.dirs.get(d);
      });
      n.files.push(segs[segs.length - 1]);
    });
    const count = (n) => n.files.length + [...n.dirs.values()].reduce((t, d) => t + count(d), 0);
    const glyph = (f) => (/\.(md|txt)$/i.test(f) ? 'book' : 'code');
    const rows = (n, d) => [
      ...[...n.dirs].map(([name, dir]) => {
        const kids = h('div', { hidden: true }, rows(dir, d + 1));
        const row = h('button', { class: 'sd-tree-row', style: `--d:${d}`, 'aria-expanded': 'false', onclick: () => {
          kids.hidden = !kids.hidden;
          row.setAttribute('aria-expanded', String(!kids.hidden));
        } }, ic('chevron-right', 12, 'sd-chev'), ic('folder', 13), h('span', { class: 'sd-tree-name' }, name),
        h('span', { class: 'sb-chip-count' }, count(dir)));
        return [row, kids];
      }),
      ...n.files.map((f) => h('div', { class: 'sd-tree-row', style: `--d:${d}` },
        h('span', { class: 'sd-chev-sp' }), ic(glyph(f), 13), h('span', { class: 'sd-tree-name' }, f))),
    ];
    return h('div', { class: 'sd-tree' }, rows(root, 0));
  }

  // ---- SKILL.md: skeleton while fetched, one line + Retry when it fails ------------------
  function mdBlock(slug, fetchMd) {
    const el = h('div', { class: 'sd-mdbox' });
    let attempt = 0;
    const skeleton = () => h('div', { class: 'sd-skel', role: 'status', 'aria-label': 'Loading SKILL.md' },
      [46, 92, 84, 64, 0, 38, 88, 72].map((w) => (w ? h('i', { style: `width:${w}%` }) : h('b'))));
    function load() {
      el.replaceChildren(skeleton());
      fetchMd(slug, attempt++).then((t) => el.replaceChildren(markdown(t)), () => el.replaceChildren(
        h('div', { class: 'ex-error sd-md-error', role: 'status' }, ic('alert-circle', 13), "Couldn't load SKILL.md",
          h('button', { class: 'sb-btn sb-btn-outline sb-btn-xs', onclick: load }, 'Retry'))));
    }
    load();
    return el;
  }

  // ---- I5: without Git, the app's Install Git action sits under the disabled Install ------
  // One Git install for the page: it survives the panel being redrawn; a fixture reset drops it.
  let gitRun = 0;
  let gitBusy = false;
  C.on((e) => { if (e.type === 'reset') { gitRun++; gitBusy = false; } });
  function gitLine(slug, win) {
    const draw = (el) => {
      const show = C.installState(slug) === 'needs-git';
      el.hidden = !show;
      if (!show) { el.replaceChildren(); return; }
      const btn = gitBusy ? h('button', { class: 'sb-btn sb-btn-outline sb-btn-xs', disabled: true }, spinner(12), 'Installing Git')
        : h('button', { class: 'sb-btn sb-btn-outline sb-btn-xs', onclick: () => {
          const run = gitRun;
          gitBusy = true;
          draw(el);
          setTimeout(() => {
            if (run !== gitRun) return;
            gitBusy = false;
            C.setSetting('git', true);
            if (win) toast(win, 'Git installed', { icon: 'check-circle' });
          }, 1500);
        } }, 'Install Git');
      el.replaceChildren(ic('git-branch', 13), h('span', 'Installing needs Git'), btn);
    };
    return live(h('div', { class: 'sd-git' }), draw);
  }

  function repoLink(s, win) {
    return h('button', { class: 'ex-link', 'data-tip': 'Open in browser · new icon',
      onclick: () => win && toast(win, `Opens ${s.url.replace(/^https?:\/\//, '')}`) },
    ic(s.private ? 'lock' : 'github', 14), h('span', { class: 'sb-ellipsis' }, s.repo), h.html(window.newIcon('link', 12)));
  }
  const label = (text, n) => h('div', { class: 'ex-detail-label' }, text, n == null ? null : h('span', { class: 'sb-chip-count' }, n));

  function parts(slug, { win, onShowLibrary, onCreator, fetchMd = C.skillMd } = {}) {
    const s = C.skill(slug);
    // A repository's own link already names it; a creator or skills.sh is worth its own mark.
    const by = s.origin === 'catalog'
      ? h('button', { class: 'ex-link', onclick: () => onCreator && onCreator(s.creator) }, creatorAvatar(s.creator, { size: 16 }), s.creator)
      : s.origin === 'skills.sh' ? sourceTag(s) : null;
    return {
      s,
      title: h('div', { class: 'sd-title' }, s.name),
      install: installAction(slug, { win, onShowLibrary }),
      desc: h('div', { class: 'sd-desc' }, s.desc),
      error: installErrorLine(slug),
      git: gitLine(slug, win),
      meta: h('div', { class: 'sd-meta' }, by, repoLink(s, win), installsMeta(s)),
      filesLabel: label('Files', s.files.length),
      files: fileTree(s.files),
      mdLabel: label('SKILL.md'),
      md: mdBlock(slug, fetchMd),
    };
  }
  const stack = (p, end) => h('div', { class: 'sd-panel' },
    h('div', { class: 'sd-head' }, p.title, p.install, end || null),
    h('div', { class: 'sd-body' }, p.desc, p.error, p.git, p.meta, p.filesLabel, p.files, p.mdLabel, p.md));

  window.SD = { parts, stack, fileTree, markdown };
})();

</script>
<script>
(function () {
  'use strict';
  const win = document.getElementById('win');
  const side = document.getElementById('side');
  const hdr = document.getElementById('hdr');
  const page = document.getElementById('page');
  const soon = () => toast(win, 'Not in this prototype');
  // P.open: the sheet or dialog is showing (B's pane always is). overlay: {close} of the open one.
  const P = { variant: 'e', state: 'loaded', slug: 'react-best-practices', open: true, md: 'ok', q: '' };
  let overlay = null;

  // A skill with folders, so the file tree has something to collapse.
  Object.assign(CATALOG.skill('react-best-practices'), { files: ['SKILL.md', 'AGENTS.md', 'metadata.json',
    'rules/async-parallel.md', 'rules/bundle-barrel-imports.md', 'rules/rerender-memo.md', 'rules/server-cache-react.md',
    'scripts/build-agents.ts'] });
  const RBP_MD = '# React best practices\n\nPerformance rules for React and Next.js, ordered by impact. Read a rule when its trigger applies.\n\n'
    + '## Critical\n- **Eliminate waterfalls**: start independent requests together with `Promise.all`.\n'
    + '- **Bundle size**: skip barrel files; reach for the module itself.\n\n## Medium\n'
    + '1. Memoize expensive children with `memo`.\n2. Cache server reads per request with `cache()`.\n\n'
    + '```\nconst [user, posts] = await Promise.all([getUser(id), getPosts(id)]);\n```\n\nSee `rules/` for one file per rule, with a bad and a good example.';
  // Every optional front matter field (agentskills.io/specification) and a long description, near the 1024-character cap.
  const WDG = CATALOG.skill('web-design-guidelines');
  Object.assign(WDG, {
    desc: 'Reviews UI code against the Web Interface Guidelines: layout and spacing, typography, color and contrast, focus order, keyboard access, '
      + 'touch targets, forms and validation, loading and empty states, motion, and copy. Use when the user asks for a UI review, an accessibility '
      + 'or design audit, or a check before shipping a page, component, or pull request. It reads the changed files, groups each finding by '
      + 'guideline with its file and line, ranks them by severity, and proposes the smallest fix for each. It does not restyle code that already '
      + 'follows the guidelines, and it skips generated files, vendored code, and snapshots.',
    files: ['SKILL.md', 'LICENSE.txt', 'guidelines/accessibility.md', 'guidelines/forms.md', 'guidelines/layout.md', 'guidelines/motion.md',
      'guidelines/typography.md', 'scripts/collect-diff.sh', 'scripts/report.ts', 'assets/report-template.md'],
    fm: { license: 'MIT. LICENSE.txt has complete terms', compatibility: 'Designed for Claude Code and Cursor. Requires git and network access to fetch the guidelines.',
      tools: ['Bash(git:*)', 'Read', 'Grep', 'WebFetch'], metadata: { author: 'vercel-labs', version: '2.3.0', homepage: 'vercel.com/design/guidelines' } },
  });
  const WDG_MD = '---\nname: web-design-guidelines\ndescription: ' + WDG.desc + '\nlicense: ' + WDG.fm.license + '\ncompatibility: ' + WDG.fm.compatibility
    + '\nmetadata:\n  author: vercel-labs\n  version: "2.3.0"\n  homepage: vercel.com/design/guidelines\nallowed-tools: ' + WDG.fm.tools.join(' ') + '\n---\n'
    + '# Web design guidelines\n\nReview the diff against each guideline in `guidelines/`, then write one report.\n\n## Steps\n'
    + '1. Run `scripts/collect-diff.sh` to list the changed UI files.\n2. Read each guideline that applies.\n3. Fill `assets/report-template.md`.\n\n'
    + '## Severity\n- **Blocker**: fails WCAG AA or breaks keyboard use.\n- **Major**: inconsistent with the system.\n- **Minor**: polish.';
  // The state's skill fails or hangs on its first fetch; Retry and every other skill load normally.
  function fetchMd(slug, attempt) {
    if (slug === P.mdSlug && attempt === 0 && P.md === 'loading') return new Promise(() => {});
    if (slug === P.mdSlug && attempt === 0 && P.md === 'error') return new Promise((ok, no) => setTimeout(no, 500));
    if (slug === 'web-design-guidelines') return new Promise((ok) => setTimeout(() => ok(WDG_MD), 400));
    if (slug === 'react-best-practices') return new Promise((ok) => setTimeout(() => ok(RBP_MD), 400));
    return CATALOG.skillMd(slug);
  }
  // T2: a creator narrows the page to their skills (by search, which matches creators; C2).
  function byCreator(id) {
    Object.assign(P, { q: id, open: P.variant === 'b' });
    draw();
  }
  const detailOpts = { win, onShowLibrary: soon, onCreator: byCreator, fetchMd };

  const STATES = [
    { id: 'loaded', label: 'Loaded', slug: 'react-best-practices' },
    { id: 'loading', label: 'Loading SKILL.md', slug: 'react-best-practices', md: 'loading' },
    { id: 'mderror', label: 'SKILL.md error', slug: 'react-best-practices', md: 'error' },
    { id: 'full', label: 'Full front matter', slug: 'web-design-guidelines' },
    { id: 'inlib', label: 'In library', slug: 'frontend-design' },
    { id: 'collision', label: 'Collision', slug: 'pdf' },
    { id: 'nogit', label: 'Without Git', slug: 'react-best-practices', git: false },
    { id: 'failed', label: 'Install failed', slug: 'acme-oncall', access: false, tip: 'Private repository, no access' },
  ];
  function setState(id) {
    const st = STATES.find((x) => x.id === id) || STATES[0];
    closeOverlay();
    win.querySelectorAll(':scope > .sb-toast').forEach((t) => t.remove());
    CATALOG.reset();
    CATALOG.settings.git = st.git !== false;
    CATALOG.settings.access = st.access !== false;
    Object.assign(P, { state: st.id, slug: st.slug, mdSlug: st.slug, md: st.md || 'ok', open: true, q: '' });
    if (st.id === 'failed') {
      const ms = CATALOG.settings.installMs;
      CATALOG.settings.installMs = 0;
      CATALOG.install(st.slug);
      CATALOG.settings.installMs = ms;
    }
    draw();
  }

  function closeOverlay() {
    const o = overlay;
    overlay = null;
    if (o) o.close();
  }
  const userClosed = (o) => { if (overlay === o) { overlay = null; P.open = false; drawItems(); } };
  function items() {
    if (P.q.trim()) return CATALOG.search(P.q).local.slice(0, 24);
    return CATALOG.trending(11).concat(CATALOG.skill('acme-oncall'));
  }
  function select(slug) {
    Object.assign(P, { slug, open: true });
    if (P.variant === 'b') { drawItems(); drawPane(); } else { drawItems(); openDetail(); }
  }
  const listHeader = () => (P.q.trim() ? sectionHeader('Results', { icon: 'search' }) : sectionHeader('Trending', { icon: 'fire' }));
  const search = () => searchInput({ value: P.q, onInput: (q) => {
    const was = !!P.q.trim();
    P.q = q;
    if (was !== !!q.trim()) { const old = page.querySelector('.ex-section'); if (old) old.replaceWith(listHeader()); }
    drawItems();
  } });

  function draw() {
    closeOverlay();
    hdr.replaceChildren(h('div', { class: 'sb-title' }, 'Explore'));
    if (P.variant === 'b') {
      page.className = 'sb-page sd-split';
      page.replaceChildren(h('div', { class: 'sd-left' }, h('div', { class: 'sd-left-top' }, search(), listHeader()),
        h('div', { class: 'sd-list', id: 'items' })), h('div', { class: 'sd-pane', id: 'pane' }));
      drawItems();
      drawPane();
      return;
    }
    page.className = 'sb-page';
    page.replaceChildren(h('div', { class: 'sb-toolbar' }, search()), listHeader(),
      h('div', { class: 'ex-grid', id: 'items' }));
    drawItems();
    if (P.open) openDetail();
  }

  // ---- the list behind the panel: cards (A, C) or rows (B) ----------------------------
  function drawItems() {
    const el = document.getElementById('items');
    if (!el) return;
    const list = items();
    const sel = (s) => (P.open || P.variant === 'b') && s.slug === P.slug;
    if (!list.length) { el.replaceChildren(emptyState({ icon: 'search', title: 'No skills match' })); return; }
    el.replaceChildren(...list.map((s) => (P.variant === 'b' ? row(s, sel(s)) : card(s, sel(s)))));
  }
  const keys = (slug) => (e) => { if (e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(slug); } };
  const name = (s, cls) => [h('span', { class: cls }, s.name), CATALOG.isNew(s.slug) ? newChip() : null];
  const card = (s, on) => h('div', { class: `ex-card${on ? ' is-selected' : ''}`, role: 'button', tabindex: '0', onclick: () => select(s.slug), onkeydown: keys(s.slug) },
    h('div', { class: 'ex-card-title' }, name(s)),
    h('div', { class: 'ex-card-desc' }, s.desc),
    h('div', { class: 'ex-card-foot' }, installsMeta(s) || sourceTag(s), installAction(s.slug, { win, onShowLibrary: soon })),
    installErrorLine(s.slug));
  const row = (s, on) => h('div', { class: `sd-row${on ? ' is-selected' : ''}`, role: 'button', tabindex: '0', 'aria-current': on ? 'true' : null,
    onclick: () => select(s.slug), onkeydown: keys(s.slug) },
  h('div', { class: 'sd-row-top' }, name(s, 'sd-row-name'), installAction(s.slug, { win, size: 'xs', onShowLibrary: soon })),
  installsMeta(s) || sourceTag(s));

  // ---- B: the pane beside the list --------------------------------------------------------
  function drawPane() {
    const el = document.getElementById('pane');
    if (el) el.replaceChildren(SD.stack(SD.parts(P.slug, detailOpts)));
  }

  // ---- A: sheet; C: dialog ------------------------------------------------------------------
  function openDetail() {
    closeOverlay();
    const p = SD.parts(P.slug, detailOpts);
    if (['c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l'].includes(P.variant)) {
      overlay = wideDialog(p, P.variant);
      return;
    }
    overlay = sheet(p);
  }
  // C, D, E: one large Kit dialog at the Import skills dialog's size, Install beside Close in its header.
  function wideDialog(p, variant) {
    const d = openDialog(win, { title: p.s.name, size: 'lg', onClose: () => userClosed(d) });
    d.el.classList.add('sd-dialog', `sd-dialog-${variant}`);
    const head = d.el.querySelector('.sb-dialog-header');
    head.insertBefore(p.install, head.lastChild);
    head.lastChild.setAttribute('data-tip', 'Close');
    const noGit = !CATALOG.settings.git;
    const needsGit = () => h('div', { class: 'sd-git sd-preview-git' }, ic('git-branch', 13), h('span', 'Preview needs Git'));
    if (variant === 'c') {
      // Facts and files on the left, SKILL.md on the right, each scrolling on its own.
      d.setBody(h('div', { class: 'sd-wide' },
        h('div', { class: 'sd-wide-l' }, p.desc, p.error, p.git, p.meta, noGit ? needsGit() : [p.filesLabel, p.files]),
        noGit ? null : h('div', { class: 'sd-wide-r' }, p.mdLabel, p.md)));
    } else if (variant === 'd') {
      // Facts in one band under the header, then SKILL.md and Files as two tabs over the full width.
      const pane = h('div', { class: 'sd-tab-pane' }, p.md);
      const bar = seg([{ id: 'md', label: 'SKILL.md' }, { id: 'files', label: 'Files', count: p.s.files.length }], 'md',
        (id) => pane.replaceChildren(id === 'md' ? p.md : p.files));
      d.setBody(h('div', { class: 'sd-tabbed' },
        h('div', { class: 'sd-band' }, p.desc, p.meta, p.error, p.git),
        noGit ? needsGit() : [bar, pane]));
    } else {
      // E-G: SKILL.md reads as the page; the facts and files sit in a sidebar, as a repository's About.
      // They differ only in how the sidebar parts from the page (G puts each section in a card).
      // H-J keep G's Files card and change only About.
      const fm = fmPairs(p.s);
      const fmStack = fm.length ? h('div', { class: 'sd-fm' }, fm.map(([k, v]) => h('div', { class: 'sd-fm-item' }, h('span', { class: 'sd-fact-k' }, k), v))) : null;
      const about = [h('div', { class: 'ex-detail-label' }, 'About'), p.desc, p.error, p.git, p.meta, fmStack];
      const files = noGit ? null : [p.filesLabel, p.files];
      const filesCard = files && h('section', { class: 'sd-card' }, files);
      const main = noGit ? h('div', { class: 'sd-doc-main' }, needsGit()) : h('div', { class: 'sd-doc-main' }, p.md);
      let sideKids = [about, files];
      if (variant === 'g') sideKids = [h('section', { class: 'sd-card' }, about), filesCard];
      if (variant === 'h') sideKids = [h('section', { class: 'sd-about-open' }, about), filesCard];
      if (variant === 'i') sideKids = [h('section', { class: 'sd-about-open' }, p.desc, p.error, p.git, facts(p)), filesCard];
      // K, L: two columns from the top, one scroll; the left reads description then SKILL.md.
      if (variant === 'k' || variant === 'l') {
        const aboutCard = variant === 'k'
          ? h('section', { class: 'sd-card' }, h('div', { class: 'ex-detail-label' }, 'About'), p.meta)
          : fm.length ? h('section', { class: 'sd-card' }, h('div', { class: 'ex-detail-label' }, 'About'), facts(p, true)) : null;
        const left = h('div', { class: 'sd-doc-main' }, h('div', { class: 'sd-lead' }, p.desc, p.error, p.git, variant === 'l' ? p.meta : null),
          noGit ? needsGit() : p.md);
        // K: the rest of the front matter, once SKILL.md has loaded, in its own card under Files.
        const details = variant === 'k' && fm.length
          ? h('section', { class: 'sd-card' }, h('div', { class: 'ex-detail-label' }, 'Details'), fmStack) : null;
        d.setBody(h('div', { class: 'sd-doc' }, left, h('aside', { class: 'sd-doc-side' }, aboutCard, filesCard, details)));
        return d;
      }
      if (variant === 'j') {
        d.setBody(h('div', { class: 'sd-doc-col' },
          h('div', { class: 'sd-band-top' }, p.desc, p.error, p.git, p.meta),
          h('div', { class: 'sd-doc' }, main, h('aside', { class: 'sd-doc-side' },
            fm.length ? h('section', { class: 'sd-card' }, h('div', { class: 'ex-detail-label' }, 'Details'), facts(p, true)) : null, filesCard))));
        return d;
      }
      d.setBody(h('div', { class: 'sd-doc' }, main, h('aside', { class: 'sd-doc-side' }, sideKids)));
    }
    return d;
  }
  // I: the facts as labelled rows (Creator, Repository, Installs), taken out of the meta line.
  // J's Details card passes onlyFm: the front matter rows alone, its meta line being in the band.
  function facts(p, onlyFm) {
    const kids = [...p.meta.children];
    const by = ['catalog', 'skills.sh'].includes(p.s.origin) ? kids.shift() : null;
    const [repo, installs] = kids;
    const fact = (k, v) => v && h('div', { class: 'sd-fact' }, h('span', { class: 'sd-fact-k' }, k), h('span', { class: 'sd-fact-v' }, v));
    const top = onlyFm ? [] : [fact('Creator', by), fact('Repository', repo), fact('Installs', installs)];
    return h('div', { class: 'sd-facts' }, top, fmPairs(p.s).map(([k, v]) => fact(k, v)));
  }
  // SKILL.md's optional front matter fields (license, compatibility, allowed-tools, metadata), each a label and its value.
  function fmPairs(s) {
    const f = s.fm;
    if (!f) return [];
    const cap = (k) => k.charAt(0).toUpperCase() + k.slice(1);
    return [
      ['License', h('span', f.license)],
      ['Compatibility', h('span', f.compatibility)],
      ['Allowed tools', h('span', { class: 'sd-tools' }, f.tools.map((t) => h('code', t)))],
      ...Object.entries(f.metadata).map(([k, v]) => [cap(k), h('span', v)]),
    ];
  }
  function sheet(p) {
    const api = {
      close() {
        if (!scrim.isConnected) return;
        document.removeEventListener('keydown', esc, true);
        scrim.remove();
        userClosed(api);
      },
    };
    const esc = (e) => { if (e.key === 'Escape') { e.stopPropagation(); api.close(); } };
    const close = h('button', { class: 'sb-btn sb-btn-icon sb-btn-sm', 'aria-label': 'Close', 'data-tip': 'Close', 'data-tip-pos': 'end',
      onclick: () => api.close() }, ic('close', 15));
    const scrim = h('div', { class: 'ex-scrim', onmousedown: (e) => { if (e.target === scrim) api.close(); } },
      h('aside', { class: 'ex-sheet sd-sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': p.s.name, style: '--ex-sheet-w:380px' },
        SD.stack(p, close)));
    win.append(scrim);
    document.addEventListener('keydown', esc, true);
    return api;
  }

  exploreSidebar(side, { active: 'explore', onNav: (k) => { if (k !== 'explore') soon(); }, onPreset: soon });
  const bar = variantBar(document.getElementById('proto'), [
    { id: 'a', label: 'Side sheet', desc: "Right sheet over the trending grid, behind a scrim; Install in its sticky header. v0 Extensions' detail pane, as an overlay." },
    { id: 'b', label: 'Split pane', desc: 'Skill list on the left, the detail fills the rest and stays; selecting a row swaps it. v0 Extensions list + detail, Vercel integrations.' },
    { id: 'c', label: 'Large dialog', desc: "Kit dialog at the Import skills dialog's size over Explore: facts and files in a left column, SKILL.md on the right, each scrolling; Install beside Close." },
    { id: 'd', label: 'Dialog · tabs', desc: 'Same dialog: description and meta in one band, then SKILL.md and Files as two tabs across the full width.' },
    { id: 'e', label: 'Dialog · document', desc: "Same dialog: SKILL.md reads as the page, with About (description, creator, repository, installs) and Files in a right sidebar, like a repository's page. Rules: one under the header, one full height before the sidebar." },
    { id: 'f', label: 'Doc · tinted side', desc: "Document dialog with no rules: the sidebar is a tinted pane (the app sidebar's tone) running edge to edge under the header to the dialog's bottom. The file tree sits on the tint without a box." },
    { id: 'g', label: 'Doc · cards', desc: 'Document dialog with no rules: About and Files each sit in a flat card in the sidebar; whitespace parts them from the page.' },
    { id: 'h', label: 'About · open', desc: "G with About out of its card: a plain section (label, description, creator, repository, installs) over the Files card, like a repository's About." },
    { id: 'i', label: 'About · rows', desc: 'G with About out of its card and its facts as labelled rows (Creator, Repository, Installs) under the description, over the Files card.' },
    { id: 'j', label: 'About · top', desc: 'One scroll under the fixed header. About leaves the sidebar: the description and the creator, repository, and installs line run in a band under the header, across the dialog; the sidebar holds only the Files card.' },
    { id: 'k', label: 'Columns · facts', desc: 'Picked. Two columns from the top, one scroll under the fixed header. Left: the description, then SKILL.md. Right: an About card (creator, repository, installs), the Files card, and a Details card with the rest of the front matter when SKILL.md has any (pick Full front matter).' },
    { id: 'l', label: 'Columns · front matter', desc: "Two columns from the top, one scroll. Left: the description, the creator · repository · installs line, then SKILL.md. Right: an About card with SKILL.md's optional front matter (license, compatibility, allowed tools, metadata; pick the Full front matter state, hidden when a skill has none) over the Files card." },
  ], (id) => { P.variant = id; P.open = true; draw(); });
  const first = STATES.some((x) => x.id === document.body.dataset.firstState) ? document.body.dataset.firstState : 'loaded';
  bar.extra.append(seg(STATES.map(({ id, label, tip }) => ({ id, label, tip })), first, setState));
  setState(first);
  bar.set(document.body.dataset.firstVariant || 'a');
})();
</script>
</body>
</html>
