<html lang="en">

<title>Placement popover</title>
<!-- Prototype: the Library placement popover, crowded and not. Variants: Now (before), A grid, B labeled
     pills (chosen 2026-11-26), C summary rows. Build: python3 -I ../../scoped-pages/source/kit/inline.py
     popover.html ../prototypes/popover.html -->
<style>
:root {
  --p-bg: #181A1D; --p-fg: #E9EBEE; --p-muted: #25282C; --p-muted-fg: #A0A5AB;
  --p-border: #2A2D31; --p-hairline: #212427; --p-popover: #1D1F23; --p-primary: #0077B6;
  --p-accent-soft: #133146; --p-accent-soft-fg: #8FCCFB; --p-hl: rgba(233,235,238,.08);
  --p-switch: #3A3E44; --p-shadow: 0 12px 32px rgba(0,0,0,.45), 0 0 0 1px #2A2D31;
}
:root[data-theme="light"] {
  --p-bg: #FFFFFF; --p-fg: #1B1E23; --p-muted: #EFF3F8; --p-muted-fg: #5F646B;
  --p-border: #E2E7EC; --p-hairline: #EBEFF4; --p-popover: #FFFFFF; --p-primary: #0077B6;
  --p-accent-soft: #E4F2FE; --p-accent-soft-fg: #046094; --p-hl: rgba(27,30,35,.06);
  --p-switch: #D3D8DE; --p-shadow: 0 12px 32px rgba(15,20,30,.14), 0 0 0 1px #E2E7EC;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--p-fg);
  font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
button { font: inherit; color: inherit; }
.bar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 12px 16px;
  border-bottom: 1px solid var(--p-border); position: sticky; top: 0; background: var(--p-bg); z-index: 9; }
.seg { display: inline-flex; background: var(--p-muted); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; color: var(--p-muted-fg); }
.seg button.on { background: var(--p-bg); color: var(--p-fg); box-shadow: 0 0 0 1px var(--p-border); }
.bar label { color: var(--p-muted-fg); font-size: 12px; margin-right: 6px; }
.note { color: var(--p-muted-fg); font-size: 12px; padding: 10px 16px 0; max-width: 820px; }
.stage { background: var(--p-bg); border-radius: 10px; display: flex; justify-content: flex-end; padding: 16px 24px 48px; min-height: 760px; }
.col { width: 100%; max-width: 820px; position: relative; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--p-border);
  border-radius: 10px; background: var(--p-hl); }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-size: 14px; }
.row .t span { color: var(--p-muted-fg); }
.trigger { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; background: var(--p-hl); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px solid var(--p-border);
  border-radius: 999px; font-size: 12px; }
.pop { position: absolute; right: 0; top: 64px; background: var(--p-popover); border-radius: 10px;
  box-shadow: var(--p-shadow); padding: 12px; }
.logo { width: 16px; height: 16px; display: inline-flex; flex: none; }
.logo svg { width: 100%; height: 100%; }
.fold { width: 16px; height: 16px; flex: none; color: var(--p-muted-fg); }
.sh { display: flex; align-items: center; justify-content: space-between; min-height: 24px;
  color: var(--p-muted-fg); font-size: 12px; font-weight: 500; }
.preset { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px;
  background: var(--p-muted); color: var(--p-fg); font-size: 12px; font-weight: 500; }
.preset i { width: 7px; height: 7px; border-radius: 50%; background: #A3A3A3; }
.hr { border-top: 1px solid var(--p-hairline); margin: 10px -12px; }
.muted { color: var(--p-muted-fg); }
.small { font-size: 11.5px; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.switch { width: 30px; height: 18px; border-radius: 999px; background: var(--p-switch); position: relative;
  border: 0; padding: 0; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
  border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch.on { background: var(--p-primary); }
.switch.on::after { left: 14px; }
.missing { opacity: .45; }

/* Now */
.pill { width: 26px; height: 24px; border-radius: 999px; display: inline-flex; align-items: center;
  justify-content: center; border: 1px dashed var(--p-border); cursor: pointer; background: none; padding: 0; }
.pill .logo { opacity: .45; filter: grayscale(1); }
.pill.on { border: 1px solid var(--p-fg); }
.pill.on .logo { opacity: 1; filter: none; }
.line { display: flex; align-items: center; gap: 12px; min-height: 28px; margin: 6px 0; }
.line .lead { flex: 1 0 auto; display: flex; align-items: center; gap: 8px; }
.pills { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; min-width: 0; }

/* A grid */
.grid { display: grid; align-items: center; }
.grid .hd { position: sticky; top: 0; background: var(--p-popover); z-index: 2; height: 30px;
  display: flex; align-items: center; justify-content: center; }
.grid .nm { display: flex; align-items: center; gap: 8px; min-width: 0; height: 32px; padding-right: 8px; }
.cell { height: 32px; display: flex; align-items: center; justify-content: center; }
.cell.hot, .hd.hot { background: var(--p-hl); }
.gridrow:hover > * { background: var(--p-hl); }
.box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--p-muted-fg); background: none;
  padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.box.on { background: var(--p-primary); border-color: var(--p-primary); }
.box.on::after { content: ""; width: 8px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0;
  transform: translateY(-1px) rotate(-45deg); }
.na { width: 4px; height: 4px; border-radius: 50%; background: var(--p-border); }
.scroll { overflow: auto; max-height: 352px; margin: 0 -12px; padding: 0 12px; }
.status { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--p-hairline); color: var(--p-muted-fg);
  font-size: 12px; min-height: 18px; }

/* B labeled */
.blk { padding: 8px 0; }
.blk + .blk { border-top: 1px solid var(--p-hairline); }
.blk .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px 0 6px; border-radius: 999px;
  border: 1px dashed var(--p-border); background: none; cursor: pointer; color: var(--p-muted-fg); font-size: 12px; }
.tag .logo { width: 14px; height: 14px; opacity: .55; filter: grayscale(1); }
.tag.on { border: 1px solid transparent; background: var(--p-accent-soft); color: var(--p-accent-soft-fg); }
.tag.on .logo { opacity: 1; filter: none; }

/* C expand */
.acc { border-radius: 8px; }
.acc + .acc { margin-top: 2px; }
.acc.open { background: var(--p-hl); }
.head { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px; cursor: pointer; border-radius: 8px; }
.head:hover { background: var(--p-hl); }
.sum { display: flex; align-items: center; gap: 6px; flex: none; color: var(--p-muted-fg); font-size: 12px; }
.stack { display: flex; }
.stack .logo { width: 18px; height: 18px; border-radius: 50%; background: var(--p-popover); padding: 2px;
  box-shadow: 0 0 0 1.5px var(--p-popover); }
.stack .logo + .logo { margin-left: -5px; }
.chev { width: 14px; height: 14px; color: var(--p-muted-fg); transition: transform .15s; flex: none; }
.open .chev { transform: rotate(180deg); }
.items { padding: 2px 8px 8px 32px; }
.item { display: flex; align-items: center; gap: 8px; height: 30px; cursor: pointer; }
.item .nm { flex: 1; min-width: 0; }
.item .path { color: var(--p-muted-fg); font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
.off { color: var(--p-muted-fg); }
</style>
</head>

  }
}
const logo = (k) => `<span class="logo" title="${DIRS[k].name}">${LOGO[k]}</span>`;
const folder = `<span class="fold">${FOLDER}</span>`;
const yoursDirs = () => M.yours;
function wsDirs(w) { return w.dirs.length ? w.dirs : M.yours; }
function wsOn(w, k) { return w.on.includes(k); }
function toggleWs(i, k) { const w = M.ws[i]; if (w.missing) return;
  w.on = wsOn(w, k) ? w.on.filter(x => x !== k) : [...w.on, k];
  if (!w.dirs.length && w.on.length) w.dirs = [...w.on];
  draw(); }
function toggleYours(k) { M.on.has(k) ? M.on.delete(k) : M.on.add(k); draw(); }
function allSwitch() {
  return `<span style="display:flex;align-items:center;gap:8px" title="Includes agents added later">All agents
    <button class="switch ${M.all ? "on" : ""}" onclick="M.all=!M.all;draw()"></button></span>`;
}
function header() {
  return `<div class="sh">Your agents <span class="preset"><i></i>Default</span></div>`;
}
function trigger() {
  const stack = [...M.on].map(k => `<span class="logo" style="width:18px;height:18px">${LOGO[k]}</span>`).join("");
  const n = M.ws.filter(w => w.on.length).length;
  return `<div class="row"><div class="t"><b>release-notes</b><span>Drafts user-facing release notes for the Lumen Notes app from merged pull requests.</span></div>
    <div class="trigger">${stack}<span class="chip">${folder}${n === 1 ? M.ws.find(w => w.on.length).name : n + " workspaces"}</span>
    <span class="chev">${CHEV}</span></div></div>`;
}

function now() {
  const pill = (on, k, click) => `<button class="pill ${on ? "on" : ""}" title="${DIRS[k].name}" onclick="${click}">${logo(k)}</button>`;
  let h = header();
  h += `<div class="line"><span class="lead">${allSwitch()}</span><span class="pills">${
    yoursDirs().map(k => pill(M.on.has(k), k, `toggleYours('${k}')`)).join("")}</span></div>`;
  h += `<div class="hr"></div><div class="sh">Workspaces</div>`;
  M.ws.forEach((w, i) => {
    h += `<div class="line ${w.missing ? "missing" : ""}"><span class="lead">${folder}<span><div>${w.name}</div>${
      w.dirs.length ? "" : `<div class="muted small">No agents yet</div>`}</span></span><span class="pills">${
      wsDirs(w).map(k => pill(wsOn(w, k), k, `toggleWs(${i},'${k}')`)).join("")}</span></div>`;
  });
  return `<div class="pop" style="width:300px">${h}</div>`;
}

function gridA() {
  const cols = [...new Set([...M.yours, ...M.ws.flatMap(w => w.dirs)])];
  const tmpl = `minmax(0,1fr) repeat(${cols.length}, 30px)`;
  const width = 190 + cols.length * 30 + 24;
  const hot = S.hot;
  const hd = cols.map(k => `<div class="hd ${hot && hot.k === k ? "hot" : ""}" title="${DIRS[k].name}">${logo(k)}</div>`).join("");
  const cell = (r, k, state, click) => {
    const isHot = hot && (hot.k === k || hot.r === r);
    const enter = `onmouseenter="S.hot={r:'${r}',k:'${k}'};drawPop()"`;
    if (state === null) return `<div class="cell ${isHot ? "hot" : ""}" ${enter}><span class="na"></span></div>`;
    return `<div class="cell ${isHot ? "hot" : ""}" ${enter}><button class="box ${state ? "on" : ""}" onclick="${click}"></button></div>`;
  };
  const name = (r, inner) => `<div class="nm ${hot && hot.r === r ? "hot" : ""}" style="${hot && hot.r === r ? "background:var(--p-hl)" : ""}">${inner}</div>`;
  let h = `<div class="sh" style="margin-bottom:6px">${allSwitch()}<span class="preset"><i></i>Default</span></div>`;
  h += `<div class="scroll" onmouseleave="S.hot=null;drawPop()"><div class="grid" style="grid-template-columns:${tmpl}">`;
  h += `<div class="hd" style="justify-content:flex-start"></div>${hd}`;
  h += name("yours", `<span class="fold" style="color:var(--p-fg)">${LOGO.universal.replace("<svg", "<svg style='opacity:0'")}</span><b>Your agents</b>`);
  h += cols.map(k => cell("yours", k, M.yours.includes(k) ? M.on.has(k) : null, `toggleYours('${k}')`)).join("");
  h += `<div style="grid-column:1/-1;border-top:1px solid var(--p-hairline);margin:4px 0"></div>`;
  h += `<div style="grid-column:1/-1" class="sh">Workspaces</div>`;
  M.ws.forEach((w, i) => {
    const r = "w" + i;
    h += `<div class="nm ${w.missing ? "missing" : ""}" style="${hot && hot.r === r ? "background:var(--p-hl)" : ""}" title="${w.name}${w.missing ? " — folder missing" : ""}">${folder}<span class="trunc">${w.name}</span></div>`;
    h += cols.map(k => {
      const offered = wsDirs(w).includes(k);
      const c = cell(r, k, offered ? wsOn(w, k) : null, `toggleWs(${i},'${k}')`);
      return w.missing ? c.replace('class="cell', 'class="cell missing') : c;
    }).join("");
  });
  h += `</div></div>`;
  let status = "Point at a box to see the agent and the place";
  if (hot) {
    const place = hot.r === "yours" ? "your agents" : M.ws[+hot.r.slice(1)].name;
    const w = hot.r === "yours" ? null : M.ws[+hot.r.slice(1)];
    const offered = w ? wsDirs(w).includes(hot.k) : M.yours.includes(hot.k);
    const on = w ? wsOn(w, hot.k) : M.on.has(hot.k);
    status = !offered ? `${place} doesn't use ${DIRS[hot.k].name}`
      : w && w.missing ? `${place}: folder missing`
      : `<b style="color:var(--p-fg)">${DIRS[hot.k].name}</b> in <b style="color:var(--p-fg)">${place}</b> · ${on ? "on" : "off"}`;
  }
  h += `<div class="status">${status}</div>`;
  return `<div class="pop" style="width:${width}px">${h}</div>`;
}

function labeledB() {
  const tag = (on, k, click) => `<button class="tag ${on ? "on" : ""}" onclick="${click}">${logo(k)}${DIRS[k].name}</button>`;
  let h = `<div class="blk"><div class="top"><b style="flex:1">Your agents</b><span class="preset"><i></i>Default</span></div>
    <div class="tags">${yoursDirs().map(k => tag(M.on.has(k), k, `toggleYours('${k}')`)).join("")}</div>
    <div style="margin-top:8px" class="muted">${allSwitch()}</div></div>`;
  h += `<div class="hr" style="margin-top:4px;margin-bottom:4px"></div><div class="sh">Workspaces</div><div class="scroll" style="max-height:360px">`;
  M.ws.forEach((w, i) => {
    const n = w.on.length;
    h += `<div class="blk ${w.missing ? "missing" : ""}"><div class="top">${folder}<span class="trunc" style="flex:1">${w.name}</span>
      <span class="muted small">${w.missing ? "Folder missing" : !w.dirs.length ? "No agents yet" : n ? `${n} of ${w.dirs.length} on` : "Off"}</span></div>
      <div class="tags">${wsDirs(w).map(k => tag(wsOn(w, k), k, `toggleWs(${i},'${k}')`)).join("")}</div></div>`;
  });
  h += `</div>`;
  return `<div class="pop" style="width:360px">${h}</div>`;
}

function expandC() {
  const box = (on, click) => `<button class="box ${on ? "on" : ""}" onclick="event.stopPropagation();${click}"></button>`;
  const sum = (on, of, missing) => {
    if (missing) return `<span class="sum">Folder missing</span>`;
    if (!on.length) return `<span class="sum">Off</span>`;
    return `<span class="sum"><span class="stack">${on.map(k => logo(k)).join("")}</span>${on.length} of ${of}</span>`;
  };
  const acc = (id, lead, summary, body, missing) => {
    const open = S.open === id;
    return `<div class="acc ${open ? "open" : ""} ${missing ? "missing" : ""}">
      <div class="head" onclick="S.open=S.open==='${id}'?null:'${id}';drawPop()">${lead}${summary}<span class="chev">${CHEV}</span></div>
      ${open ? `<div class="items">${body}</div>` : ""}</div>`;
  };
  const item = (k, on, click, missing) => `<div class="item" onclick="${missing ? "" : click}">${logo(k)}
    <span class="nm"><span class="${on ? "" : "off"}">${DIRS[k].name}</span> <span class="path">${DIRS[k].path}</span></span>${box(on, missing ? "" : click)}</div>`;
  const yOn = M.yours.filter(k => M.on.has(k));
  let h = "";
  h += acc("yours", `<b>Your agents</b><span class="preset"><i></i>Default</span><span style="flex:1"></span>`, sum(yOn, M.yours.length),
    `<div class="item" style="justify-content:space-between" onclick="M.all=!M.all;draw()"><span>All agents <span class="muted small">· includes agents added later</span></span><button class="switch ${M.all ? "on" : ""}" onclick="event.stopPropagation();M.all=!M.all;draw()"></button></div>` +
    M.yours.map(k => item(k, M.on.has(k), `toggleYours('${k}')`)).join(""));
  h += `<div class="hr" style="margin:8px -12px"></div><div class="sh" style="padding:0 8px 4px">Workspaces</div><div class="scroll" style="max-height:340px;padding:0 4px;margin:0 -4px">`;
  M.ws.forEach((w, i) => {
    const on = wsDirs(w).filter(k => wsOn(w, k));
    const lead = `${folder}<span class="trunc" style="flex:1">${w.name}</span>`;
    const body = (!w.dirs.length ? `<div class="muted small" style="padding:4px 0">No agents yet · turning one on adds its folder</div>` : "") +
      wsDirs(w).map(k => item(k, wsOn(w, k), `toggleWs(${i},'${k}')`, w.missing)).join("");
    h += acc("w" + i, lead, sum(on, wsDirs(w).length, w.missing), body, w.missing);
  });
  h += `</div>`;
  return `<div class="pop" style="width:340px">${h}</div>`;
}

const RENDER = { now, A: gridA, B: labeledB, C: expandC };
function drawPop() {
  const app = document.getElementById("app");
  app.innerHTML = trigger() + RENDER[S.v]();
}
function draw() {
  document.documentElement.dataset.theme = S.theme;
  seg("v", Object.entries(VARIANTS).map(([k, [l]]) => [k, l]), "v");
  seg("d", [["few", "Few"], ["crowded", "Crowded"]], "d", () => { M = DATA[S.d](); });
  seg("th", [["dark", "Dark"], ["light", "Light"]], "theme");
  document.getElementById("note").textContent = VARIANTS[S.v][1];
  drawPop();
}
draw();
</script>
</body>
</html>
