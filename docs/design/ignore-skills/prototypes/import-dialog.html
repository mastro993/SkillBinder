<style>
.sb-nav-row[data-nav="discovery"] { display: none; }
.im-ctx { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 12.5px/1.4 var(--sb-font); color: var(--sb-muted-fg); }
.im-busy > .sb-vbar { pointer-events: none; opacity: .5; }
.im-scan .im-count { font-size: 12px; color: var(--sb-muted-fg); font-variant-numeric: tabular-nums; }
.im-scan { width: auto; padding: 0 8px; gap: 5px; }

.sb-scrim.im-scrim { align-items: center; padding: 10px; }
.sb-dialog.im-dialog { width: 92%; height: 90%; max-width: none; max-height: none; }
.im-dialog .sb-dialog-header { padding-bottom: 6px; }
.im-dialog .sb-dialog-body { display: flex; flex-direction: column; gap: 8px; overflow: hidden; padding-bottom: 12px; }
.im-dialog .sb-dialog-footer { justify-content: flex-end; padding-top: 10px; padding-bottom: 12px; border-top: 1px solid var(--sb-border); }
.im-center { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; text-align: center; color: var(--sb-muted-fg); }

.im-tools { display: flex; align-items: center; gap: 8px; }
.im-tools .sb-search { flex: 1 1 auto; width: auto; max-width: 260px; }
.im-status { margin-left: auto; font-size: 12px; color: var(--sb-muted-fg); white-space: nowrap; }

.im-list { position: relative; flex: 1; min-height: 0; overflow: auto; }
.im-head {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px;
  border-bottom: 1px solid var(--sb-border); border-radius: 9px 9px 0 0; background: var(--sb-card);
}
.im-head .sb-check-label { font-size: 12.5px; font-weight: 500; }
.im-list .sb-row { align-items: flex-start; min-height: 0; padding: 9px 12px; gap: 10px; }
.im-list .sb-row > .sb-checkbox { margin-top: 2px; }
.im-head + .sb-row::before, .im-ghead + .sb-row::before { display: none; }
.im-list .sb-slug { font-size: 13.5px; }
.im-list .sb-desc { font-size: 12px; }
.im-list .sb-row.is-changed, .im-ghead.is-changed { animation: im-flash 1.8s ease-out; }
@keyframes im-flash { from { background: color-mix(in srgb, var(--sb-info) 18%, var(--sb-card)); } }
.im-list .sb-empty { padding: 28px 16px; }
.im-lines { display: flex; flex-direction: column; gap: 2px; margin-top: 3px; font-size: 11.5px; color: var(--sb-muted-fg); }
.im-line { display: flex; align-items: center; flex-wrap: wrap; column-gap: 12px; min-width: 0; }
.im-warn { display: flex; align-items: center; gap: 5px; color: color-mix(in srgb, var(--sb-warning) 60%, var(--sb-fg)); }
.im-vtoggle { align-self: flex-start; margin: 3px 0 0 -6px; color: var(--sb-muted-fg); }
.im-vtoggle > .sb-ic { transition: transform .12s; }
.im-vtoggle[aria-expanded="true"] > .sb-ic { transform: rotate(90deg); }

.im-ghead {
  position: sticky; top: 34px; z-index: 1; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px;
  border-bottom: 1px solid var(--sb-border); background: color-mix(in srgb, var(--sb-fg) 4%, var(--sb-card));
}
.im-ghead .sb-check-label { gap: 8px; font-size: 12px; font-weight: 600; }
.im-ghead .sb-chip-count { font-size: 11.5px; }
.sb-row + .im-ghead { border-top: 1px solid var(--sb-border); }
.im-ghead-end { margin-left: auto; }

/* The Ignore control at a row's trailing edge */
.im-end { flex: none; align-self: center; display: flex; align-items: center; }
.im-end .sb-btn { color: var(--sb-muted-fg); }
.im-end .sb-btn:hover { color: var(--sb-fg); }

/* Ignored: a collapsed group at the bottom, or a separate view behind a toolbar toggle */
.im-ignored-head { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--sb-muted-fg); }
.im-ignored-head .sb-ic { transition: transform .12s; }
.im-ignored-head[aria-expanded="true"] .sb-ic.im-chev { transform: rotate(90deg); }
.im-ignored-head .im-hint { font-weight: 400; margin-left: 6px; }
.im-list .sb-row.is-ignored .sb-slug, .im-list .sb-row.is-ignored .sb-desc { opacity: .6; }
.im-list .sb-row.is-ignored .im-end .sb-btn { color: var(--sb-fg); }
.im-gap { flex: none; width: 16px; }
.im-banner { padding: 8px 12px; font-size: 12px; color: var(--sb-muted-fg); border-bottom: 1px solid var(--sb-border); }
.im-toggle.is-on { background: var(--sb-sel); }
.im-nothing { padding: 22px 12px; text-align: center; color: var(--sb-muted-fg); font-size: 13px; }
</style>

  function presetRaw(slug, presetId = state.activePreset) {
    const raw = preset(presetId)?.skills[slug];
    return raw === undefined ? null : raw;
  }
  function presetHolds(slug, presetId) {
    const raw = presetRaw(slug, presetId);
    if (raw === 'all') return targets.map((t) => t.id);
    return raw ? targets.map((t) => t.id).filter((id) => raw.includes(id)) : [];
  }
  function wsRaw(wsId, slug) {
    const raw = workspace(wsId)?.skills[slug];
    return raw === undefined ? null : raw;
  }
  // A workspace's folders in the app's order (wsDirs), whatever order they were added in.
  const inDirOrder = (ids) => wsDirs.map((d) => d.id).filter((id) => ids.includes(id));
  function workspaceHolds(wsId, slug) {
    const ws = workspace(wsId);
    const raw = wsRaw(wsId, slug);
    if (!ws || !raw) return [];
    return inDirOrder(raw === 'all' ? ws.dirs : ws.dirs.filter((d) => raw.includes(d)));
  }
  const workspaceDirs = (wsId) => inDirOrder(workspace(wsId)?.dirs || []).map(wsDir);

  function whereActive(slug) {
    return {
      agents: presetHolds(slug),
      workspaces: state.workspaces
        .map((ws) => ({ id: ws.id, dirs: workspaceHolds(ws.id, slug) }))
        .filter((w) => w.dirs.length),
    };
  }
  function isActive(slug) {
    const where = whereActive(slug);
    return where.agents.length > 0 || where.workspaces.length > 0;
  }
  const agentSkills = (targetId) =>
    skills.map((s) => s.slug).filter((slug) => presetHolds(slug).includes(targetId));
  const workspaceSkills = (wsId) =>
    Object.keys(workspace(wsId)?.skills || {}).filter((slug) => workspaceHolds(wsId, slug).length).sort(bySlug);

  function targetsLabel(raw, kind = 'agents', wsId) {
    if (raw === 'all') return 'All agents';
    if (!raw || !raw.length) return '';
    if (raw.length > 1) return `${raw.length} agents`;
    return (kind === 'ws' ? wsDir(raw[0]) : target(raw[0]))?.name || raw[0];
  }
  const isEdited = (slug, place, wsId) => EDITED.has(placeKey(slug, place, wsId));
  function placeName({ target: place, ws }) {
    return ws ? `${ws} · ${wsDir(place)?.name || place}` : target(place)?.name || place;
  }

  function matches(s, { folder, status = 'all', updates, query }) {
    if (folder && s.folder !== folder) return false;
    if (updates && !s.hasUpdate) return false;
    if (status === 'active' && !isActive(s.slug)) return false;
    if (status === 'inactive' && isActive(s.slug)) return false;
    const q = (query || '').trim().toLowerCase();
    return !q || s.slug.includes(q) || s.desc.toLowerCase().includes(q);
  }
  const filterSkills = (opts = {}) => skills.filter((s) => matches(s, opts));
  function counts({ folder, query } = {}) {
    const base = { folder, query };
    return {
      all: filterSkills(base).length,
      active: filterSkills({ ...base, status: 'active' }).length,
      inactive: filterSkills({ ...base, status: 'inactive' }).length,
      updates: filterSkills({ ...base, updates: true }).length,
    };
  }
  function sidebarCounts() {
    const map = (list, fn) => Object.fromEntries(list.map((x) => [x.id, fn(x)]));
    return {
      discovery: 2,
      library: skills.length,
      presets: map(state.presets, (p) => Object.keys(p.skills).length),
      workspaces: map(state.workspaces, (w) => workspaceSkills(w.id).length),
      agents: map(targets, (t) => agentSkills(t.id).length),
    };
  }

  // ---- mutators -------------------------------------------------------------
  function writeRaw(holder, slug, value) {
    if (value === 'all') holder.skills[slug] = 'all';
    else if (value && value.length) holder.skills[slug] = [...value];
    else delete holder.skills[slug];
  }

  function setAgents(slug, value) {
    const p = activePreset();
    const prev = clone(p.skills[slug] ?? null);
    writeRaw(p, slug, value);
    emit({ type: 'agents', slug, preset: p.id });
    return () => { writeRaw(p, slug, prev); emit({ type: 'undo', slug }); };
  }
  function removeAgent(slug, targetId) {
    return setAgents(slug, presetHolds(slug).filter((id) => id !== targetId));
  }

  function setWorkspaceDirs(wsId, slug, value) {
    const ws = workspace(wsId);
    const prev = clone(ws.skills[slug] ?? null);
    const prevDirs = [...ws.dirs];
    if (Array.isArray(value)) value.forEach((d) => ws.dirs.includes(d) || ws.dirs.push(d));
    writeRaw(ws, slug, value);
    emit({ type: 'workspace', slug, ws: wsId });
    return () => { writeRaw(ws, slug, prev); ws.dirs = prevDirs; emit({ type: 'undo', slug, ws: wsId }); };
  }
  function removeWorkspaceDir(wsId, slug, dirId) {
    return setWorkspaceDirs(wsId, slug, workspaceHolds(wsId, slug).filter((d) => d !== dirId));
  }

  function problemFor(pair) {
    const key = placeKey(pair.slug, pair.target, pair.ws);
    if (pair.op === 'add' && FOREIGN.has(key)) return 'different';
    if (pair.op === 'remove' && EDITED.has(key)) return 'edited';
    return undefined;
  }
  function finishPlan(plan) {
    plan.pairs.forEach((p) => { const problem = problemFor(p); if (problem) p.problem = problem; });
    plan.adds = [...new Set(plan.pairs.filter((p) => p.op === 'add').map((p) => p.slug))].sort(bySlug);
    plan.removes = [...new Set(plan.pairs.filter((p) => p.op === 'remove').map((p) => p.slug))].sort(bySlug);
    return plan;
  }

  function planSwitch(presetId) {
    const to = preset(presetId);
    const pairs = [];
    for (const slug of skills.map((s) => s.slug)) {
      const before = presetHolds(slug);
      const after = presetHolds(slug, presetId);
      before.filter((t) => !after.includes(t)).forEach((t) => pairs.push({ slug, target: t, op: 'remove' }));
      after.filter((t) => !before.includes(t)).forEach((t) => pairs.push({ slug, target: t, op: 'add' }));
    }
    return finishPlan({ kind: 'switch', from: state.activePreset, to: presetId,
      title: `Switching to ${to.name}`, toast: `Switched to ${to.name}`, pairs });
  }
  function switchPreset(presetId) {
    const plan = planSwitch(presetId);
    state.activePreset = presetId;
    emit({ type: 'preset', preset: presetId });
    return plan;
  }
  function deletePreset(presetId) {
    if (presetId === 'default') return null;
    const wasOn = state.activePreset === presetId;
    const plan = wasOn ? planSwitch('default') : null;
    if (plan) Object.assign(plan, { kind: 'delete', title: 'Switching to Default', toast: 'Switched to Default' });
    if (wasOn) state.activePreset = 'default';
    state.presets = state.presets.filter((p) => p.id !== presetId);
    emit({ type: 'preset-deleted', preset: presetId });
    return plan;
  }

  function addSkills({ slugs, targets: chosen, ws }) {
    const pairs = [];
    for (const slug of slugs) {
      const before = ws ? workspaceHolds(ws, slug) : presetHolds(slug);
      const raw = ws ? wsRaw(ws, slug) : presetRaw(slug);
      const next = chosen === 'all' || raw === 'all' ? 'all' : [...new Set([...(raw || []), ...chosen])];
      const holder = ws ? workspace(ws) : activePreset();
      if (ws && Array.isArray(next)) next.forEach((d) => holder.dirs.includes(d) || holder.dirs.push(d));
      writeRaw(holder, slug, next);
      const after = ws ? workspaceHolds(ws, slug) : presetHolds(slug);
      after.filter((t) => !before.includes(t)).forEach((t) => pairs.push({ slug, target: t, ws, op: 'add' }));
    }
    const n = slugs.length;
    const noun = n === 1 ? slugs[0] : `${n} skills`;
    emit({ type: 'add', slugs, ws });
    return finishPlan({ kind: 'add', title: `Adding ${noun}`, toast: `Added ${noun}`, pairs });
  }

  function reset() {
    state = clone(INITIAL);
    emit({ type: 'reset' });
  }
  function on(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  window.DATA = {
    targets, wsDirs, folders, skills, discoveryCount: 2,
    skill, target, wsDir, workspace, preset, activePreset,
    presets: () => state.presets, workspaces: () => state.workspaces,
    presetRaw, presetHolds, wsRaw, workspaceHolds, workspaceDirs,
    isActive, whereActive, agentSkills, workspaceSkills, targetsLabel, isEdited, placeName,
    filterSkills, counts, sidebarCounts,
    setAgents, removeAgent, setWorkspaceDirs, removeWorkspaceDir,
    planSwitch, switchPreset, deletePreset, addSkills, reset, on,
  };
})();

</script>
<script>/* ../../scoped-pages/source/kit/shell.js */
(function () {
  'use strict';
  const D = window.DATA;
  const settings = { speed: 'slow', problems: undefined };

  // ---- DOM ------------------------------------------------------------------
  const PROPS = new Set(['checked', 'indeterminate', 'value', 'disabled']);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs == null || typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs)) {
      kids.unshift(attrs);
      attrs = {};
    }
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (PROPS.has(k)) el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    kids.flat(Infinity).forEach((c) => { if (c != null && c !== false) el.append(c instanceof Node ? c : String(c)); });
    return el;
  }
  h.html = function (markup) {
    const t = document.createElement('template');
    t.innerHTML = String(markup).trim();
    return t.content.childNodes.length === 1 ? t.content.firstChild : t.content;
  };
  const ic = (name, size = 16, cls = '') => h.html(window.icon(name, size, cls));
  const winOf = (el) => (el && el.closest && el.closest('.sb-window')) || el;

  // ---- overlay stack: Esc and outside clicks go to the top layer --------------
  const layers = [];
  function pushLayer(layer) {
    layers.push(layer);
    return () => { const i = layers.indexOf(layer); if (i >= 0) layers.splice(i, 1); };
  }
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !layers.length) return;
    e.preventDefault();
    e.stopPropagation();
    const top = layers[layers.length - 1];
    if (top.onEsc) top.onEsc();
  }, true);
  document.addEventListener('mousedown', (e) => {
    const top = layers[layers.length - 1];
    if (top && top.outside && !top.el.contains(e.target) && !(top.anchor && top.anchor.contains(e.target))) top.outside();
  }, true);

  function place(el, anchor, host, { align = 'start', gap = 4 } = {}) {
    const hr = host.getBoundingClientRect();
    const ar = anchor.getBoundingClientRect();
    const ox = hr.left + host.clientLeft;
    const oy = hr.top + host.clientTop;
    const w = el.offsetWidth;
    const ht = el.offsetHeight;
    let left = align === 'end' ? ar.right - ox - w : align === 'center' ? ar.left - ox + ar.width / 2 - w / 2 : ar.left - ox;
    let top = ar.bottom - oy + gap;
    if (top + ht > host.clientHeight - 8 && ar.top - oy - gap - ht >= 8) top = ar.top - oy - gap - ht;
    left = Math.max(8, Math.min(left, host.clientWidth - w - 8));
    top = Math.max(8, Math.min(top, host.clientHeight - ht - 8));
    el.style.left = `${left}px`;
    el.style.top = `${top}px`;
  }

  // ---- tooltips ---------------------------------------------------------------
  let tipEl = null;
  let tipFor = null;
  let tipTimer = 0;
  let tipHiddenAt = 0;
  function hideTip() {
    clearTimeout(tipTimer);
    if (tipEl) { tipEl.remove(); tipEl = null; tipHiddenAt = Date.now(); }
    tipFor = null;
  }
  function showTip(t) {
    const text = t.getAttribute('data-tip');
    if (!text || !t.isConnected) return;
    const host = t.closest('.sb-window');
    tipEl = h('div', { class: 'sb-tooltip', role: 'tooltip' }, text);
    if (host) {
      host.append(tipEl);
      place(tipEl, t, host, { align: 'center', gap: 6 });
      return;
    }
    document.body.append(tipEl);
    const r = t.getBoundingClientRect();
    const max = document.documentElement.clientWidth - tipEl.offsetWidth - 4;
    tipEl.style.left = `${Math.max(4, Math.min(r.left + r.width / 2 - tipEl.offsetWidth / 2, max)) + window.scrollX}px`;
    tipEl.style.top = `${r.bottom + 6 + window.scrollY}px`;
  }
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (t === tipFor) return;
    hideTip();
    if (!t) return;
    tipFor = t;
    tipTimer = setTimeout(() => showTip(t), Date.now() - tipHiddenAt < 400 ? 0 : 350);
  });
  document.addEventListener('mouseout', (e) => { if (!e.relatedTarget) hideTip(); });
  document.addEventListener('mousedown', hideTip, true);
  document.addEventListener('focusout', hideTip);
  document.addEventListener('scroll', (e) => {
    hideTip();
    if (openPop && !openPop.el.contains(e.target)) openPop.close();
  }, true);

  // ---- toast ------------------------------------------------------------------
  function toast(win, html, { action, onAction, ms = 4000, icon } = {}) {
    win = winOf(win);
    win.querySelectorAll(':scope > .sb-toast').forEach((t) => t.remove());
    const el = h('div', { class: `sb-toast${action ? ' has-action' : ''}`, role: 'status' },
      icon ? ic(icon, 15) : null,
      h('span', { class: 'sb-toast-text', html }),
      action ? h('button', { class: 'sb-toast-action', onclick: () => { close(); if (onAction) onAction(); } }, action) : null);
    win.append(el);
    let timer = setTimeout(close, ms);
    el.addEventListener('mouseenter', () => clearTimeout(timer));
    el.addEventListener('mouseleave', () => { timer = setTimeout(close, 1500); });
    function close() {
      clearTimeout(timer);
      if (!el.isConnected || el.classList.contains('is-leaving')) return;
      el.classList.add('is-leaving');
      setTimeout(() => el.remove(), 180);
    }
    return { el, close };
  }

  // ---- dialogs ----------------------------------------------------------------
  function openDialog(win, { title = '', body, footer, size = '', dismissible = true, top = false, onClose } = {}) {
    win = winOf(win);
    let closed = false;
    const titleEl = h('div', { class: 'sb-dialog-title' });
    const closeBtn = h('button', { class: 'sb-btn sb-btn-icon sb-btn-sm', 'aria-label': 'Close', onclick: () => api.close() }, ic('close', 16));
    const bodyEl = h('div', { class: 'sb-dialog-body' });
    const footEl = h('div', { class: 'sb-dialog-footer' });
    const box = h('div', { class: `sb-dialog${size ? ` sb-dialog-${size}` : ''}`, role: 'dialog', 'aria-modal': 'true', tabindex: '-1' },
      h('div', { class: 'sb-dialog-header' }, titleEl, closeBtn), bodyEl, footEl);
    const scrim = h('div', { class: `sb-scrim${top || size === 'lg' ? ' is-top' : ''}` }, box);
    scrim.addEventListener('mousedown', (e) => { if (e.target === scrim && api.dismissible) api.close(); });
    const asNodes = (v) => [v].flat(Infinity).filter((n) => n != null && n !== false).map((n) => (typeof n === 'string' ? h('div', n) : n));
    const api = {
      el: box, scrim, body: bodyEl, footer: footEl, dismissible, onClose,
      setTitle(text, iconHtml) {
        titleEl.replaceChildren(...(iconHtml ? [h.html(iconHtml)] : []), h('span', text));
      },
      setBody(...nodes) { bodyEl.replaceChildren(...asNodes(nodes)); },
      setFooter(...nodes) { footEl.replaceChildren(...asNodes(nodes)); },
      setDismissible(v, { closeButton = v } = {}) { api.dismissible = v; closeBtn.hidden = !closeButton; },
      close(result) {
        if (closed) return;
        closed = true;
        popLayer();
        scrim.remove();
        if (api.onClose) api.onClose(result);
      },
    };
    const popLayer = pushLayer({ el: box, onEsc: () => api.dismissible && api.close() });
    api.setTitle(title);
    api.setBody(body ?? []);
    api.setFooter(footer ?? []);
    api.setDismissible(dismissible);
    win.append(scrim);
    (box.querySelector('[data-autofocus]') || box).focus({ preventScroll: true });
    return api;
  }

  function confirmDialog(win, { title, body, confirm = 'Remove', cancel = 'Cancel', danger = true } = {}) {
    return new Promise((resolve) => {
      let ok = false;
      const d = openDialog(win, {
        title, size: 'sm', body: body ? h('div', { class: 'sb-muted' }, body) : [],
        onClose: () => resolve(ok),
        footer: [
          h('button', { class: 'sb-btn sb-btn-outline', onclick: () => d.close() }, cancel),
          h('button', { class: `sb-btn ${danger ? 'sb-btn-danger' : 'sb-btn-primary'}`, 'data-autofocus': '',
            onclick: () => { ok = true; d.close(); } }, confirm),
        ],
      });
    });
  }

  const PROBLEMS = {
    different: { text: 'Different copy there', yes: 'Replace', no: 'Keep' },
    edited: { text: 'You changed it here', yes: 'Replace', no: 'Keep' },
    unwritable: { text: "Can't write the folder", yes: 'Retry', no: 'Skip' },
  };
  const KINDS = Object.keys(PROBLEMS);
  const stepText = (p) => (p.op === 'remove'
    ? `Removing ${p.slug} from ${D.placeName(p)}`
    : `Copying ${p.slug} → ${D.placeName(p)}`);
  const warnIcon = (size) => `<span style="color:var(--sb-warning);display:grid">${window.icon('alert-circle', size)}</span>`;

  function pickProblems(pairs, problems) {
    if (typeof problems !== 'number') return pairs.filter((p) => p.problem).map((p) => ({ ...p }));
    const n = Math.min(problems, pairs.length);
    return Array.from({ length: n }, (_, k) => ({ ...pairs[Math.floor(((k + 0.5) * pairs.length) / n)], problem: KINDS[k % KINDS.length] }));
  }

  function progressDialog(win, { title, plan, problems = settings.problems, speed = settings.speed, toast: toastText } = {}) {
    win = winOf(win);
    const pairs = (plan && plan.pairs) || [];
    const heading = title || (plan && plan.title) || 'Working';
    const doneToast = toastText === undefined ? plan && plan.toast : toastText;
    const issues = pickProblems(pairs, problems);
    return new Promise((resolve) => {
      if (!pairs.length) { resolve({ problems: [] }); return; }
      const total = pairs.length;
      const totalMs = speed === 'fast' ? 160 : speed === 'slow' ? Math.min(5200, Math.max(2400, total * 240)) : Number(speed) || 1500;
      // Input is blocked from the first moment; the dialog itself appears after 300 ms.
      const blocker = h('div', { style: 'position:absolute;inset:0;z-index:69' });
      const popBlock = pushLayer({ el: blocker });
      win.append(blocker);
      let done = 0;
      let shownAt = 0;
      let d = null;
      const bar = h('span');
      const pct = h('span', { class: 'sb-progress-pct' }, '0%');
      const step = h('div', { class: 'sb-progress-step' }, stepText(pairs[0]));
      const render = () => {
        const p = Math.round((done / total) * 100);
        bar.style.width = `${p}%`;
        pct.textContent = `${p}%`;
        if (done < total) step.textContent = stepText(pairs[done]);
      };
      const show = () => {
        if (d) return;
        shownAt = Date.now();
        d = openDialog(win, { title: heading, size: 'md', dismissible: false,
          body: [h('div', { class: 'sb-progress-row' }, h('div', { class: 'sb-progress' }, bar), pct), step] });
      };
      const showTimer = setTimeout(show, 300);
      const tick = () => {
        done += 1;
        render();
        if (done < total) setTimeout(tick, totalMs / total);
        else finish();
      };
      setTimeout(tick, totalMs / total);

      function finish() {
        clearTimeout(showTimer);
        const wait = d ? Math.max(0, 500 - (Date.now() - shownAt)) : 0;
        setTimeout(() => {
          popBlock();
          blocker.remove();
          if (issues.length) showDone();
          else {
            if (d) d.close();
            if (doneToast) toast(win, doneToast, { icon: 'check-circle' });
            resolve({ problems: [] });
          }
        }, wait);
      }
      function showDone() {
        show();
        const n = issues.length;
        d.setTitle(`Done · ${n} need${n === 1 ? 's' : ''} attention`, warnIcon(18));
        d.setDismissible(true, { closeButton: false });
        step.textContent = issues.map((p) => p.slug).filter((s, i, a) => a.indexOf(s) === i).join(', ');
        d.setFooter(
          h('button', { class: 'sb-btn sb-btn-primary', 'data-autofocus': '', onclick: () => { d.close(); reviewDialog(win, issues); } }, 'Review'),
          h('button', { class: 'sb-btn sb-btn-outline', onclick: () => d.close() }, 'Close'));
        d.el.querySelector('[data-autofocus]').focus({ preventScroll: true });
        d.onClose = () => resolve({ problems: issues });
      }
    });
  }

  function reviewDialog(win, items) {
    return new Promise((resolve) => {
      const rows = items.map((it) => {
        const base = PROBLEMS[it.problem] || PROBLEMS.different;
        // An edited copy met while removing the skill: the choice is Remove / Keep, not Replace.
        const kind = it.problem === 'edited' && it.op === 'remove' ? { ...base, yes: 'Remove' } : base;
        const done = { Retry: 'Done', Remove: 'Removed' }[kind.yes] || 'Replaced';
        const end = h('div', { class: 'sb-row-end' });
        const settle = (label) => end.replaceChildren(h('span', { class: 'sb-hstack sb-muted sb-small', style: 'gap:4px' }, ic('check', 14), label));
        end.append(
          h('button', { class: 'sb-btn sb-btn-primary sb-btn-sm', onclick: () => settle(done) }, kind.yes),
          h('button', { class: 'sb-btn sb-btn-outline sb-btn-sm', onclick: () => settle(kind.no === 'Skip' ? 'Skipped' : 'Kept') }, kind.no));
        return h('div', { class: 'sb-row' },
          h('div', { class: 'sb-row-main' },
            h('div', { class: 'sb-row-title' }, h('span', { class: 'sb-slug' }, it.slug), h('span', { class: 'sb-muted sb-ellipsis' }, `→ ${D.placeName(it)}`)),
            h('div', { class: 'sb-meta' }, h.html(warnIcon(13)), kind.text)),
          end);
      });
      const d = openDialog(win, {
        title: `${items.length} need${items.length === 1 ? 's' : ''} attention`, size: 'md', onClose: resolve,
        body: h('div', { class: 'sb-card' }, rows),
        footer: h('button', { class: 'sb-btn sb-btn-outline', onclick: () => d.close() }, 'Done'),
      });
    });
  }

  // ---- popover / menu ----------------------------------------------------------
  let openPop = null;
  function popover(win, anchor, content, { align = 'start', className = '', onClose } = {}) {
    win = winOf(win || anchor);
    if (openPop) {
      const same = openPop.anchor === anchor;
      openPop.close();
      if (same) return null;
    }
    const el = h('div', { class: `sb-menu ${className}` }, content);
    win.append(el);
    place(el, anchor, win, { align });
    anchor.setAttribute('aria-expanded', 'true');
    let closed = false;
    const api = {
      el, anchor,

        if (closed) return;

    openPop = api;
    return api;
  }

  function menu(win, anchor, items, opts = {}) {
    let api = null;
    const build = () => (typeof items === 'function' ? items() : items).map((it) => {
      if (it === '-' || it.sep) return h('div', { class: 'sb-menu-sep' });

  const resolveItem = (item) => (typeof item === 'string' ? D.target(item) || D.wsDir(item) : item);

  function wsChip(ws, { dirs, onClick } = {}) {

  function seg(options, value, onChange) {

  function renderSidebar(el, opts = {}) {

        onclick: () => { if (p.id !== on.id) switchTo(p.id); },
      })),
      section('Workspaces', 'Add workspace'),
      D.workspaces().map((w) => row(`ws:${w.id}`, window.icon('code-folder', 15), w.name, c.workspaces[w.id])),
      section('Agents'),

      h('div', { class: 'sb-nav-foot' }, row('settings', window.icon('settings', 15), 'Settings', null)),
    ].flat());
  }

  // ---- variant bar + demo controls ----------------------------------------------------
  function variantBar(root, variants, onChange) {
    let current = variants[0].id;
    const segEl = h('div', { class: 'sb-vbar-seg', role: 'tablist' });
    const desc = h('div', { class: 'sb-vbar-desc' });
    const extra = h('div', { class: 'sb-vbar-extra' });
    const el = h('div', { class: 'sb-vbar' }, h('div', { class: 'sb-vbar-top' }, segEl, extra), desc);
    variants.forEach((v, i) => segEl.append(h('button', { class: 'sb-vbar-opt', role: 'tab', 'data-id': v.id, onclick: () => set(v.id) },
      h('b', String.fromCharCode(65 + i)), v.label)));
    if (root.classList.contains('sb-window')) root.before(el);
    else root.prepend(el);
    function set(id) {
      const v = variants.find((x) => x.id === id) || variants[0];

      segEl.querySelectorAll('.sb-vbar-opt').forEach((b) => {
        b.classList.toggle('is-active', b.dataset.id === v.id);

  }
  function demoControls() {
    return h('div', { class: 'sb-hstack', style: 'gap:6px' },
      seg([{ id: 'fast', label: 'Fast', tip: 'Work ends before the dialog shows' }, { id: 'slow', label: 'Slow' }], settings.speed, (v) => { settings.speed = v; }),
      seg([{ id: 'plan', label: 'Problems', tip: "Use the plan's own problems" }, { id: 'none', label: 'Clean' }], settings.problems === 0 ? 'none' : 'plan',
        (v) => { settings.problems = v === 'none' ? 0 : undefined; }));
  }

  // Standalone (no host theme): let the page itself follow the OS appearance.
  const markStandalone = () => {
    if (!getComputedStyle(document.documentElement).getPropertyValue('--background').trim()) {
      document.documentElement.classList.add('sb-standalone');
    }
  };
  markStandalone();
  document.addEventListener('DOMContentLoaded', markStandalone);

  window.SB = {
    settings, h, ic, toast, openDialog, confirmDialog, progressDialog, reviewDialog, popover, menu,
    avatar, avatarStack, pill, wsChip, presetChip, checkbox, seg, tabs, searchInput, emptyState, spinner,
    renderSidebar, variantBar, demoControls,
  };
  Object.assign(window, window.SB);
})();

<script>/* ../../scan-import/source/found.js */
(function () {
  'use strict';
  const L = (path, readers) => ({ path, readers });
  const CLAUDE = L('~/.claude/skills', 'Claude Code');
  const UNIV = L('~/.agents/skills', 'Universal');
  const CURSOR = L('~/.cursor/skills', 'Cursor');
  const WINDSURF = L('~/.codeium/windsurf/skills', 'Windsurf');
  const ACME = L('~/code/acme-web/.claude/skills', 'acme-web (Claude Code)');
  const API = L('~/code/api-server/.claude/skills', 'api-server (Claude Code)');
  let n = 0;
  const v = (o) => Object.assign({ id: `v${++n}`, modified: 12, files: 3, bytes: 8200, validation: 'valid',
    matchesSource: false, messages: [], locations: [CLAUDE], replaces: [] }, o);
  const s = (slug, desc, versions) => ({ slug, desc, versions: versions.map(v) });

  const skills = [
    s('code-review', 'Reviews a diff for bugs, risky changes, and missing tests.', [{ modified: 3, files: 4, bytes: 14100, locations: [CLAUDE, UNIV], matchesSource: true }]),
    s('gh-stack', 'Manages stacked branches and pull requests with gh-stack.', [
      { modified: 2, files: 6, bytes: 21800, locations: [UNIV], matchesSource: true, replaces: ['Cursor'] },
      { modified: 41, files: 5, bytes: 19300, locations: [CURSOR] }]),
    s('caveman', 'Ultra-compressed replies that keep every technical detail.', [
      { modified: 5, files: 2, bytes: 6100, locations: [CLAUDE] },
      { modified: 90, files: 1, bytes: 2400, locations: [WINDSURF], validation: 'warnings', messages: ['SKILL.md has no description.'] }]),
    s('tdd', 'Test-driven development: red, green, refactor.', [{ modified: 8, locations: [CLAUDE, CURSOR] }]),
    s('pr-babysit', 'Watches a pull request through CI and review until it can merge.', [{ modified: 1, files: 5, bytes: 17600, locations: [CLAUDE], replaces: ['Universal'] }]),
    s('writing-for-agents', 'Writes skills, AGENTS.md, and CLAUDE.md files that agents follow.', [{ modified: 20, locations: [UNIV] }]),
    s('diagnosing-bugs', 'A diagnosis loop for hard bugs and performance regressions.', [{ modified: 14, locations: [CLAUDE] }]),
    s('rust-best-practices', 'Idiomatic, robust Rust: errors, traits, async, unsafe, and tests.', [{ modified: 6, files: 9, bytes: 48200, locations: [CLAUDE, UNIV] }]),
    s('api-docs', 'Generates reference docs from OpenAPI files.', [{ modified: 4, locations: [API], replaces: ['acme-web (Claude Code)'] }]),
    s('sql-helper', 'Explains and tunes slow SQL queries.', [{ modified: 30, locations: [API] }]),
    s('storybook', 'Writes Storybook stories for React components.', [{ modified: 10, locations: [ACME] }]),
    s('legacy-deploy', 'Deploys with the old Capistrano scripts.', [{ modified: 400, files: 2, bytes: 3100, locations: [WINDSURF], validation: 'invalid', messages: ['SKILL.md frontmatter is not valid YAML.'] }]),
    s('shell-tools', 'Runs helper binaries bundled with the skill.', [{ modified: 60, files: 4, bytes: 912000, locations: [CURSOR], validation: 'blocked', messages: ['Links outside the skill folder: bin/run → /usr/local/bin/run.'] }]),
    s('draft-notes', '', [{ modified: 2, files: 0, bytes: 0, locations: [CLAUDE], validation: 'empty', messages: ['The folder has no files.'] }]),
    s('internationalization-and-localization-string-extraction-helper', 'Finds hard-coded strings and moves them into translation catalogs for every locale the project ships.', [{ modified: 22, locations: [ACME] }]),
    s('docker-compose', 'Writes and debugs docker-compose files.', [{ modified: 9, locations: [API, ACME] }]),
    s('commit-message', 'Writes Conventional Commits messages from the staged diff.', [{ modified: 11, locations: [UNIV, CLAUDE] }]),
    s('release-notes', 'Drafts release notes from merged pull requests.', [{ modified: 17, locations: [CLAUDE] }]),
    s('tailwind-helper', 'Suggests Tailwind classes and spots conflicting ones.', [{ modified: 13, locations: [ACME] }]),
    s('security-review', 'Reviews pending changes for injection, secrets, and auth gaps.', [{ modified: 7, locations: [CLAUDE] }]),
    s('e2e-playwright', 'Writes Playwright end-to-end tests.', [{ modified: 25, locations: [ACME] }]),
    s('mermaid-diagrams', 'Draws flowcharts and sequence diagrams in Mermaid.', [{ modified: 33, locations: [UNIV] }]),
  ];

  const isAgents = (loc) => loc.path.startsWith('~/.');
  function agentsOnly(list) {
    return list.map((k) => ({ ...k, versions: k.versions.map((x) => ({ ...x, locations: x.locations.filter(isAgents),
      replaces: x.replaces.filter((p) => !p.includes('(')) })).filter((x) => x.locations.length) }))
      .filter((k) => k.versions.length);
  }
  function many(count) {
    const out = [];
    for (let i = 1; i <= count; i++) out.push(s(`skill-${String(i).padStart(3, '0')}`, `Generated skill ${i}.`, [{ modified: i % 60, locations: [i % 2 ? CLAUDE : UNIV] }]));
    return out;
  }
  const importable = (x) => x.validation !== 'blocked' && x.validation !== 'empty';
  const valid = (x) => x.validation === 'valid' || x.validation === 'warnings';
  function preferred(k) {
    const ok = k.versions.filter(importable);
    if (!ok.length) return k.versions[0].id;
    return (ok.find((x) => x.matchesSource) || [...ok].sort((a, b) => a.modified - b.modified)[0]).id;
  }
  function initialTicks(list, choice = {}) {
    const ticks = new Set();
    for (const k of list) {
      const x = k.versions.find((y) => y.id === (choice[k.slug] || preferred(k)));
      if (ticks.size < FOUND.MAX && importable(x) && valid(x)) ticks.add(k.slug);
    }
    return ticks;
  }
  const status = (list) => `${list.length} found · ${FOUND.inLibrary} already in library`;
  const size = (x) => `${x.files} ${x.files === 1 ? 'file' : 'files'} · ${x.bytes} bytes`;

  const modified = (x) => `Modified ${ago(x.modified)}`;

  const FOUND = { skills, inLibrary: 3, MAX: 500, agentsOnly, many, preferred, importable, valid, initialTicks, status, size, modified };
  window.FOUND = FOUND;
})();

<script>
(function () {
  'use strict';
  const win = document.getElementById('win');
  const side = document.getElementById('side');
  const hdr = document.getElementById('hdr');
  const page = document.getElementById('page');
  const ACME = (k) => k.versions.every((v) => v.locations.every((l) => l.readers.startsWith('acme-web')));
  const STATES = [
    { id: 'list', label: 'Nothing ignored' }, { id: 'some', label: 'Some ignored' },
    { id: 'all', label: 'All ignored', tip: 'Every found skill is ignored' }, { id: 'scanning', label: 'Scanning' },
  ];
  // ignored: slugs, kept across opens (machine-local, per slug). ticks: slugs to import.
  const S = {
    variant: 'a', mode: 'group', state: 'list', ignored: new Set(), imported: new Set(),
    skills: [], ticks: new Set(), choice: {}, expanded: new Set(), query: '',
    ignoredOpen: false, showIgnored: false, changed: null,
  };
  let dlg = null;
  let els = {};
  let scanTimer = 0;
  let ready = false;
  SB.settings.problems = 0;

  const skillsN = (n) => `${n} skill${n === 1 ? '' : 's'}`;
  const sourceOf = (state) => (state === 'all' ? FOUND.skills.filter(ACME) : FOUND.skills);
  const found = () => sourceOf(S.state).filter((k) => !S.imported.has(k.slug));
  const offered = () => S.skills.filter((k) => !S.ignored.has(k.slug));
  const ignoredList = () => S.skills.filter((k) => S.ignored.has(k.slug));
  const badgeCount = () => found().filter((k) => !S.ignored.has(k.slug)).length;
  const chosen = (k) => k.versions.find((v) => v.id === S.choice[k.slug]);
  const canTick = (k) => FOUND.importable(chosen(k));
  const cap = () => Math.min(offered().filter(canTick).length, FOUND.MAX);
  function matches(k) {
    const q = S.query.trim().toLowerCase();
    return !q || k.slug.includes(q) || k.desc.toLowerCase().includes(q);
  }
  function seedIgnored(state) {
    if (state === 'list') S.ignored = new Set();
    if (state === 'some') S.ignored = new Set(['storybook', 'tailwind-helper', 'e2e-playwright', 'legacy-deploy']);
    if (state === 'all') S.ignored = new Set(FOUND.skills.filter(ACME).map((k) => k.slug));
  }

  // ---- Library behind the dialog: Scan for skills counts only skills not ignored --------------
  renderSidebar(side, { active: 'library', onNav: () => toast(win, 'Not in this prototype') });
  function drawHeader() {
    const n = badgeCount();
    hdr.replaceChildren(h('span', { class: 'sb-title' }, 'Library'), h('div', { class: 'sb-header-actions' },
      h('button', { class: 'sb-btn sb-btn-icon', 'data-tip': 'Check for updates', 'aria-label': 'Check for updates',
        onclick: () => toast(win, 'Not in this prototype') }, ic('refresh-04', 16)),
      h('button', { class: 'sb-btn sb-btn-icon im-scan', 'data-tip': 'Scan for skills',
        'aria-label': n ? `Scan for skills, ${n} not in library` : 'Scan for skills',
        onclick: () => { openImport(true); scan(); } },
      ic('folder-search', 16), n ? h('span', { class: 'im-count' }, n.toLocaleString()) : null)));
  }
  function drawLibrary() {
    const rows = [...DATA.skills, ...[...S.imported].map((slug) => FOUND.skills.find((k) => k.slug === slug))]
      .sort((a, b) => a.slug.localeCompare(b.slug));
    page.replaceChildren(h('div', { class: 'sb-card' }, rows.map((s) => h('div', { class: 'sb-row' },
      h('div', { class: 'sb-row-main' }, h('span', { class: 'sb-slug' }, s.slug), h('div', { class: 'sb-desc' }, s.desc))))));
  }
  drawHeader();
  drawLibrary();

  // ---- variant bar, states ------------------------------------------------------------------
  const bar = variantBar(document.getElementById('proto'), [
    { id: 'a', label: 'Ignore on hover', desc: 'A quiet "Ignore" button appears at the row\'s trailing edge on hover or keyboard focus, like Remove on Library rows. One skill at a time.' },
    { id: 'b', label: 'Ignore always shown', desc: 'Every row shows its "Ignore" button, muted until hovered. Easier to find, busier list.' },
    { id: 'c', label: 'Plus Ignore all per place', desc: 'As A, and each place\'s header gets "Ignore all", for a workspace whose skills are all vendored. It ignores those slugs everywhere.' },
  ], (id) => { S.variant = id; if (ready) redraw(); });
  const stateRow = h('div', { class: 'im-ctx' });
  bar.el.append(stateRow);
  function drawStates() {
    stateRow.replaceChildren(h('span', 'Start'), seg(STATES, S.state, (id) => {
      S.state = id;
      if (id !== 'scanning') seedIgnored(id);
      drawHeader();
      openImport(false);
      if (id === 'scanning') showScanning(); else showList();
    }), h('span', { style: 'margin-left:10px' }, 'Ignored as'), seg([
      { id: 'group', label: 'Group at bottom', tip: 'A collapsed "Ignored" group closes the list' },
      { id: 'toggle', label: 'Toolbar toggle', tip: 'An "Ignored (N)" toggle beside the search switches the list to ignored skills' },
    ], S.mode, (id) => { S.mode = id; S.showIgnored = false; redraw(); }));
  }
  drawStates();

  const proto = document.getElementById('proto');
  const blocking = (el) => !el.matches('aside, main, .sb-toast, .sb-tooltip, .sb-menu') && !(dlg && el === dlg.scrim);
  new MutationObserver(() => proto.classList.toggle('im-busy', [...win.children].some(blocking)))
    .observe(win, { childList: true });
  // ---- dialog -----------------------------------------------------------------------------------
  function openImport(animate) {
    if (dlg) dlg.close();
    dlg = openDialog(win, { title: 'Import skills', onClose: () => { clearTimeout(scanTimer); dlg = null; els = {}; } });
    const d = dlg;
    d.scrim.classList.add('im-scrim');
    d.el.classList.add('im-dialog');
    if (!animate) [d.scrim, d.el].forEach((el) => { el.style.animation = 'none'; });
    d.el.querySelector('.sb-dialog-header > .sb-btn').setAttribute('data-tip', 'Close');
    d.scrim.addEventListener('mousedown', (e) => { if (e.target === d.scrim) e.stopImmediatePropagation(); }, true);
  }
  function redraw() { if (dlg && els.list) update(); }
  function scan() {
    showScanning();
    clearTimeout(scanTimer);
    scanTimer = setTimeout(() => { if (dlg) showList(); }, 900);
  }
  const cancelBtn = (label = 'Cancel', cls = 'sb-btn-outline') =>
    h('button', { class: `sb-btn ${cls}`, onclick: () => dlg.close() }, label);
  function showScanning() {
    els = {};
    dlg.setBody(h('div', { class: 'im-center' }, spinner(16), 'Scanning…'));
    dlg.setFooter(cancelBtn(), h('button', { class: 'sb-btn sb-btn-primary', disabled: true }, 'Import skills'));
  }
  // Every found skill, ignored ones included; ticks cover only the offered ones.
  function showList() {
    if (S.state === 'scanning') { S.state = 'list'; drawStates(); }
    S.skills = found().map((k) => ({ ...k }));
    S.choice = {};
    S.skills.forEach((k) => { S.choice[k.slug] = FOUND.preferred(k); });
    Object.assign(S, { ticks: FOUND.initialTicks(offered(), S.choice), expanded: new Set(), query: '',
      ignoredOpen: false, showIgnored: false, changed: null });
    if (!S.skills.length) {
      els = {};
      dlg.setBody(h('div', { class: 'im-center' }, 'No new skills found.'));
      dlg.setFooter(cancelBtn('Close', 'sb-btn-primary'));
      return;
    }
    const search = searchInput({ placeholder: 'Search found skills', value: '', onInput: (q) => { S.query = q; update(); } });
    els = { status: h('span', { class: 'im-status' }), toggle: h('span'), list: h('div', { class: 'sb-card im-list' }) };
    dlg.setBody([h('div', { class: 'im-tools' }, search, els.toggle, els.status), els.list]);
    update();
  }

  // ---- ignoring --------------------------------------------------------------------------------
  // Ignoring is saved at once, Cancel or not, and takes the skill out of the ticks and the count.
  function ignore(list) {
    list.forEach((k) => { S.ignored.add(k.slug); S.ticks.delete(k.slug); });
    S.changed = 'ignored';
    drawHeader();
    update();
    setTimeout(() => { S.changed = null; }, 1800);
  }
  // Stop ignoring brings the skill back to its place, ticked by the usual rules.
  function unignore(k) {
    S.ignored.delete(k.slug);
    if (S.ticks.size < FOUND.MAX && FOUND.initialTicks([k], S.choice).size) S.ticks.add(k.slug);
    S.changed = k.slug;
    if (!ignoredList().length) S.showIgnored = false;
    drawHeader();
    update();
    setTimeout(() => { S.changed = null; }, 1800);
  }
  const ignoreBtn = (k) => h('div', { class: `im-end${S.variant === 'b' ? '' : ' sb-row-hover'}` },
    h('button', { class: 'sb-btn sb-btn-ghost sb-btn-xs', 'data-tip': "Don't offer this skill again",
      'aria-label': `Ignore ${k.slug}`, onclick: () => ignore([k]) }, 'Ignore'));
  const unignoreBtn = (k) => h('div', { class: 'im-end' },
    h('button', { class: 'sb-btn sb-btn-outline sb-btn-xs', 'aria-label': `Stop ignoring ${k.slug}`, onclick: () => unignore(k) }, 'Stop ignoring'));

  // ---- list ---------------------------------------------------------------------------------------
  function update() {
    if (!dlg || !els.list) return;
    const ign = ignoredList();
    els.status.textContent = [`${offered().length} found`, `${FOUND.inLibrary + S.imported.size} already in library`,
      ign.length ? `${ign.length} ignored` : null].filter(Boolean).join(' · ');
    els.toggle.replaceChildren(S.mode === 'toggle' && ign.length ? h('button', {
      class: `sb-btn sb-btn-ghost sb-btn-sm im-toggle${S.showIgnored ? ' is-on' : ''}`, 'aria-pressed': String(S.showIgnored),
      onclick: () => { S.showIgnored = !S.showIgnored; update(); } }, `Ignored (${ign.length})`) : '');
    const top = els.list.scrollTop;
    const off = offered().filter(matches);
    const ignShown = ign.filter(matches);
    let rows;
    if (S.mode === 'toggle' && S.showIgnored) {
      rows = [h('div', { class: 'im-banner' }, "Ignored skills aren't offered or counted. Stop ignoring brings one back to the list."),
        ...ignShown.map(ignoredRow)];
    } else {
      rows = [offered().length ? head(off) : h('div', { class: 'im-nothing' }, 'No new skills found.'), ...grouped(off)];
      if (S.mode === 'group' && ign.length) rows.push(...ignoredGroup(ign, ignShown));
      if (S.query.trim() && !off.length && !(S.mode === 'group' && ignShown.length)) {
        rows.push(emptyState({ icon: 'search', title: `No skills match '${S.query.trim()}'` }));
      }
    }
    els.list.replaceChildren(...rows);
    els.list.scrollTop = top;
    renderFoot();
  }
  function head() {
    const n = S.ticks.size;
    const full = n > 0 && n >= cap();
    return h('div', { class: 'im-head' },
      checkbox({ checked: full, indeterminate: n > 0 && !full, label: 'Select all', onChange: (on) => tickAll(offered(), on) }));
  }
  function tickAll(list, on) {
    if (on) list.filter(canTick).forEach((k) => { if (S.ticks.size < FOUND.MAX) S.ticks.add(k.slug); });
    else list.forEach((k) => S.ticks.delete(k.slug));
    update();
  }
  const warn = (text) => h('div', { class: 'im-warn' }, ic('alert-circle', 12), text);
  function details(v) {
    return h('div', { class: 'im-lines' },
      h('div', { class: 'im-line' }, v.locations.map((l) => h('span', `${l.path} · ${l.readers}`)), h('span', FOUND.size(v))),
      v.messages.map(warn), v.replaces.map((p) => warn(`Replaces the copy in ${p}.`)));
  }
  function tag(v) {
    if (v.validation === 'invalid') return h('span', { class: 'sb-tag sb-tag-warning' }, 'Invalid');
    if (v.validation === 'blocked') return h('span', { class: 'sb-tag' }, 'Blocked');
    return null;
  }
  function row(k) {
    const v = chosen(k);
    const ok = canTick(k);
    const cb = checkbox({ checked: S.ticks.has(k.slug), disabled: !ok, onChange: (on) => {
      if (on) S.ticks.add(k.slug); else S.ticks.delete(k.slug);
      update();
    } });
    cb.setAttribute('aria-label', k.slug);
    return h('div', {
      class: `sb-row${ok ? '' : ' is-dim'}${S.changed === k.slug ? ' is-changed' : ''}`, 'data-slug': k.slug,
      onclick: (e) => {
        if (ok && !e.target.closest('input, button, label')) { if (!S.ticks.delete(k.slug)) S.ticks.add(k.slug); update(); }
      },
    }, cb,
    h('div', { class: 'sb-row-main' },
      h('div', { class: 'sb-row-title' }, h('span', { class: 'sb-slug' }, k.slug), tag(v)),
      k.desc ? h('div', { class: 'sb-desc' }, k.desc) : null,
      details(v)),
    ignoreBtn(k));
  }
  // An ignored row: no checkbox, where it was found, and Stop ignoring.
  function ignoredRow(k) {
    const places = [...new Set(k.versions.flatMap((v) => v.locations.map((l) => l.readers)))].join(', ');
    return h('div', { class: 'sb-row is-ignored', 'data-slug': k.slug }, h('span', { class: 'im-gap' }),
      h('div', { class: 'sb-row-main' }, h('span', { class: 'sb-slug' }, k.slug),
        k.desc ? h('div', { class: 'sb-desc' }, k.desc) : null,
        h('div', { class: 'im-lines' }, `Found in ${places}`)),
      unignoreBtn(k));
  }
  function ignoredGroup(all, shown) {
    const open = S.ignoredOpen || (S.query.trim() && shown.length > 0);
    const headEl = h('div', {
      class: `im-ghead im-ignored-head${S.changed === 'ignored' ? ' is-changed' : ''}`, role: 'button', tabindex: '0',
      'aria-expanded': String(!!open), onclick: () => { S.ignoredOpen = !S.ignoredOpen; update(); },
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); S.ignoredOpen = !S.ignoredOpen; update(); } },
    }, ic('chevron-right', 13, 'im-chev'), 'Ignored', h('span', { class: 'sb-chip-count' }, all.length),
    h('span', { class: 'im-hint' }, 'Not offered or counted'));
    return open ? [headEl, ...shown.map(ignoredRow)] : [headEl];
  }
  // Groups by the skill's first location: Your agents first, then each workspace by name.
  function placeOf(k) {
    const loc = k.versions.find((v) => v.id === FOUND.preferred(k)).locations[0];
    return loc.path.startsWith('~/.') ? '' : loc.readers.replace(/ \(.*\)$/, '');
  }
  function grouped(shown) {
    const groups = new Map();
    offered().forEach((k) => { const p = placeOf(k); groups.set(p, [...(groups.get(p) || []), k]); });
    return [...groups.keys()].sort().flatMap((p) => {
      const all = groups.get(p);
      const rows = all.filter((k) => shown.includes(k));
      if (!rows.length) return [];
      const able = all.filter(canTick);
      const n = able.filter((k) => S.ticks.has(k.slug)).length;
      return [h('div', { class: 'im-ghead' }, checkbox({
        checked: n > 0 && n === able.length, indeterminate: n > 0 && n < able.length, disabled: !able.length,
        label: [ic(p ? 'code-folder' : 'robot', 14), p || 'Your agents', h('span', { class: 'sb-chip-count' }, all.length)],
        onChange: (on) => tickAll(all, on),
      }), S.variant === 'c' ? h('span', { class: 'im-ghead-end' }, h('button', {
        class: 'sb-btn sb-btn-ghost sb-btn-xs', 'data-tip': `Don't offer these ${all.length} skills again`,
        onclick: () => ignore(all) }, 'Ignore all')) : null), ...rows.map(row)];
    });
  }

  // ---- footer and import ----------------------------------------------------------------------
  function renderFoot() {
    const n = S.ticks.size;
    dlg.setFooter(cancelBtn(), h('button', { class: 'sb-btn sb-btn-primary', disabled: !n || n > FOUND.MAX, onclick: doImport },
      n ? `Import ${skillsN(n)}` : 'Import skills'));
  }
  function doImport() {
    const picked = S.skills.filter((k) => S.ticks.has(k.slug));
    const n = picked.length;
    dlg.close();
    progressDialog(win, { title: `Importing ${skillsN(n)}`,
      plan: { pairs: picked.map((k) => ({ slug: k.slug, op: 'add', target: 'claude' })), toast: `Imported ${skillsN(n)}` } })
      .then(() => { picked.forEach((k) => S.imported.add(k.slug)); drawHeader(); drawLibrary(); });
  }

  ready = true;
  bar.set(document.body.dataset.firstVariant || 'a');
  // First view: the dialog open with a few skills already ignored.
  S.state = 'some';
  seedIgnored('some');
  drawStates();
  drawHeader();
  openImport(false);
  showList();
  // Opens on the Ignored group, so the first view shows both halves of the decision.
  S.ignoredOpen = true;
  update();
  els.list.scrollTop = els.list.scrollHeight;
})();
</script>
</body>
</html>
