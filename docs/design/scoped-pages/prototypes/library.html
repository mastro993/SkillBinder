<style>
/* ---- page frame: fixed toolbar, scrolling list (+ inspector) ---- */
.sb-page.lib-page { overflow: hidden; padding-bottom: 0; }
.lib-toolbar { flex-wrap: nowrap; }
.lib-toolbar .sb-search { flex: 1 1 120px; width: auto; min-width: 100px; }
.lib-filters { display: flex; align-items: center; gap: 6px; min-width: 0; }
.lib-fchips { display: flex; align-items: center; gap: 6px; min-width: 0; }
.lib-tall { height: 28px; }
.lib-fchip .sb-ic:last-child { margin-right: -3px; color: var(--sb-muted-fg); }
.lib-fbtn.is-on { background: var(--sb-muted); color: var(--sb-fg); }
.lib-body { flex: 1; min-height: 0; display: flex; gap: 12px; }
.lib-scroll { flex: 1; min-width: 0; overflow: auto; padding-bottom: 16px; scrollbar-width: thin; }

/* ---- rows and tiles ---- */
.lib-row.is-clickable, .lib-tile.is-clickable { cursor: pointer; }
.lib-row.is-selected, .lib-row.is-selected:hover { background: var(--sb-sel); --sb-ring-bg: var(--sb-sel); }
.lib-upd { display: grid; flex: none; color: var(--sb-info); }
.lib-go { display: grid; color: var(--sb-muted-fg); opacity: .6; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.lib-tile {
  position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 116px; padding: 12px;
  border: 1px solid var(--sb-border); border-radius: 10px; background: var(--sb-card); --sb-ring-bg: var(--sb-card);
}
.lib-tile:hover { background: var(--sb-hover); --sb-ring-bg: var(--sb-hover); }
.lib-tile.is-selected { box-shadow: 0 0 0 1px var(--sb-fg); }
.lib-tile-desc { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.lib-tile-foot { margin-top: auto; padding-top: 6px; display: flex; align-items: center; min-height: 32px; }
.lib-tile.is-dim .sb-slug, .lib-tile.is-dim .sb-desc, .is-dim .lib-foldertag { opacity: .5; }
.lib-scroll { container-type: inline-size; }
@container (max-width: 440px) { .lib-row .lib-foldertag { display: none; } }

/* ---- placement: where the skill is on ---- */
.lib-place {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0; min-height: 26px; padding: 0 2px;
  border: 0; border-radius: 6px; background: transparent; color: var(--sb-muted-fg);
}
.lib-place.is-btn { padding: 0 4px 0 6px; cursor: pointer; }
.lib-place.is-btn:hover, .lib-place.is-btn[aria-expanded="true"] { background: var(--sb-muted); color: var(--sb-fg); --sb-ring-bg: var(--sb-muted); }
.lib-place.is-btn.is-empty {
  width: 26px; padding: 0; justify-content: center; opacity: 0;
  border: 1px dashed color-mix(in srgb, var(--sb-fg) 24%, transparent); border-radius: 999px;
}
.sb-row:hover .lib-place.is-empty, .lib-tile:hover .lib-place.is-empty,
.lib-place.is-empty:focus-visible, .lib-place.is-empty[aria-expanded="true"] { opacity: 1; }
.lib-place-sep { width: 1px; height: 14px; flex: none; background: var(--sb-border); }
.lib-wschip { height: 20px; gap: 4px; padding: 0 7px 0 5px; }
.lib-wschip .sb-ic { color: var(--sb-muted-fg); }

/* ---- the "where it's on" editor (popover, inspector, skill page) ---- */
.lib-where { display: flex; flex-direction: column; gap: 10px; }
.lib-where > .lib-sec + .lib-sec { padding-top: 10px; border-top: 1px solid var(--sb-line); }
.lib-where.is-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 28px; }
.lib-where.is-columns > .lib-sec + .lib-sec { padding-top: 0; border-top: 0; }
.lib-sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lib-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
.lib-sec-label { font-size: 11.5px; font-weight: 500; color: var(--sb-muted-fg); }
.lib-allrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
.lib-allrow.is-compact { flex: 1; min-width: 0; justify-content: flex-start; }
.lib-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.lib-wsline { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.lib-wsname { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lib-wsname-top { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; }
.lib-wsname-top .sb-ic { color: var(--sb-muted-fg); }
.lib-none { padding-left: 20px; font-size: 11.5px; color: var(--sb-muted-fg); }
.lib-wspills { display: flex; flex: none; gap: 4px; }
.lib-switch {
  position: relative; width: 30px; height: 18px; flex: none; padding: 0; border: 0; border-radius: 999px;
  background: var(--sb-input); cursor: pointer; transition: background .15s;
}
.lib-switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--sb-bg); box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s;
}
.lib-switch[aria-checked="true"] { background: var(--sb-primary); }
.lib-switch[aria-checked="true"]::after { transform: translateX(12px); }

/* ---- overlays ---- */
.sb-menu.lib-pop { width: 300px; padding: 12px; }
.sb-menu.lib-pop-sm { min-width: 0; width: 220px; padding: 8px; }
.lib-folderpop { display: flex; gap: 6px; margin: 0; }
.lib-fmenu .sb-menu-trail { gap: 4px; font-size: 12px; font-variant-numeric: tabular-nums; }
.lib-radio, .lib-fcheck {
  width: 14px; height: 14px; display: grid; place-items: center; border: 1px solid var(--sb-input); background: var(--sb-bg);
}
.lib-radio { border-radius: 50%; }
.lib-radio.is-on { border-color: var(--sb-primary); }
.lib-radio.is-on::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--sb-primary); }
.lib-fcheck { border-radius: 4px; color: var(--sb-primary-fg); }
.lib-fcheck.is-on { background: var(--sb-primary); border-color: var(--sb-primary); }

/* ---- B: inspector ---- */
.lib-insp {
  width: 240px; flex: none; align-self: flex-start; max-height: calc(100% - 16px); overflow: auto; padding: 10px 12px 12px;
  border: 1px solid var(--sb-border); border-radius: 10px; background: var(--sb-card); animation: lib-in .16s ease-out;
}
.lib-insp-head { display: flex; align-items: center; gap: 4px; min-width: 0; margin-right: -4px; }
.lib-insp-head .sb-slug { flex: 1; min-width: 0; }
.lib-insp-desc { margin: 2px 0 12px; white-space: normal; }
@keyframes lib-in { from { opacity: 0; transform: translateX(8px); } }

/* ---- C: skill page ---- */
.lib-back .sb-ic { transform: rotate(180deg); }
.lib-crumb { padding: 0; border: 0; background: none; cursor: pointer; }
.lib-crumb:hover { color: var(--sb-fg); }
.lib-skill-title { font-size: 18px; font-weight: 600; }
.lib-skill-head { display: flex; flex-direction: column; gap: 4px; }
.lib-block { padding: 12px 14px; border: 1px solid var(--sb-border); border-radius: 10px; background: var(--sb-card); }
.lib-block-label { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 12px; font-weight: 600; }
.lib-md { margin: 0; color: var(--sb-fg); font: 12px/1.55 var(--sb-mono); white-space: pre-wrap; }
.lib-md-dim { color: var(--sb-muted-fg); }
</style>
<script>/* kit/reference.js */
(function () {
  'use strict';
  const q = new URLSearchParams(location.search);
  if (q.get('ref') !== '1') return;

  const html = document.documentElement;
  const config = {
    page: (location.pathname.split('/').pop() || '').replace(/(\.out)?\.html?$/, ''),
    variant: q.get('variant') || '', theme: q.get('theme') === 'dark' ? 'dark' : 'light',
    filters: q.get('filters') || '', scenario: q.get('scenario') || '', spec: q.get('spec') || '',
  };
  const errors = [];
  const scenarios = {};
  const HOVER = '__ref-hover';

  // ---- failures, painted so a broken render cannot pass as a reference
  let banner = null;
  function paint() {
    if (!document.body || !errors.length) return;
    if (!banner) {
      banner = document.createElement('pre');
      banner.id = '__ref_banner';
      document.body.append(banner);
    }
    banner.textContent = `reference mode: ${errors.join('\n')}`;
  }
  function fail(msg) {
    errors.push(String(msg));
    paint();
  }
  addEventListener('error', (e) => fail(`error: ${e.message}`));
  addEventListener('unhandledrejection', (e) => fail(`rejection: ${e.reason && e.reason.message || e.reason}`));
  const consoleError = console.error;
  console.error = (...a) => { fail(`console: ${a.join(' ')}`); consoleError.apply(console, a); };

  // ---- manual clock
  const BASE = Date.UTC(2026, 10, 9, 12);
  let now = 0;
  let seq = 0;
  const timers = new Map();
  const addTimer = (fn, ms, args, every) => {
    const id = (seq += 1);
    timers.set(id, { id, at: now + Math.max(0, Number(ms) || 0), fn, args, every });
    return id;
  };
  window.setTimeout = (fn, ms, ...args) => addTimer(fn, ms, args, 0);
  window.setInterval = (fn, ms, ...args) => addTimer(fn, ms, args, Math.max(1, Number(ms) || 0));
  window.clearTimeout = (id) => { timers.delete(id); };
  window.clearInterval = window.clearTimeout;
  Date.now = () => BASE + now;
  const yieldTask = () => new Promise((r) => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });
  function nextDue(end) {
    let next = null;
    timers.forEach((t) => { if (t.at <= end && (!next || t.at < next.at || (t.at === next.at && t.id < next.id))) next = t; });
    return next;
  }
  async function tick(ms = 0) {
    const end = now + Math.max(0, Number(ms) || 0);
    for (let t = nextDue(end); t; t = nextDue(end)) {
      now = t.at;
      if (t.every) t.at += t.every;
      else timers.delete(t.id);
      try { if (typeof t.fn === 'function') t.fn(...t.args); } catch (e) { fail(`timer: ${e.message}`); }
      await yieldTask(); // promise continuations run between timers, as in a browser
    }
    now = end;
    applyHover();
  }

  // ---- app tokens on the kit's roles (crates/theme + GPUI Component Default Light/Dark)
  // popover = the app's menu surface (menus, popovers, the progress pill); ref-* feed the
  // component overrides below (tooltip = popover token, scrim = overlay, switch track, TabBar).
  const TOKENS = {
    light: {
      bg: '#ffffff', fg: '#0a0a0a', card: '#ffffff', popover: '#ffffff', 'popover-fg': '#0a0a0a', 'muted-fg': '#737373',
      danger: '#ef4444', warning: '#eab308', success: '#22c55e', info: '#06b6d4', muted: '#f5f5f5', border: '#e5e5e5',
      input: '#e5e5e5', sidebar: '#fafafa', sel: '#ebebeb', hover: '#f5f5f5', secondary: '#e5e5e5', line: '#0a0a0a1a',
      highlight: '#0a0a0a14', primary: '#171717', 'primary-fg': '#fafafa', ring: '#a3a3a3',
      'ref-tooltip': '#ffffff', 'ref-overlay': '#0000000d', 'ref-switch': '#d4d4d4', 'ref-segmented': '#f5f5f5',
    },
    dark: {
      bg: '#0a0a0a', fg: '#fafafa', card: '#0f0f0f', popover: '#262626', 'popover-fg': '#fafafa', 'muted-fg': '#a3a3a3',
      danger: '#f87171', warning: '#facc15', success: '#4ade80', info: '#22d3ee', muted: '#262626', border: '#262626',
      input: '#2f2f2f', sidebar: '#161616', sel: '#2f2f2f', hover: '#262626', secondary: '#262626', line: '#fafafa1a',
      highlight: '#fafafa14', primary: '#fafafa', 'primary-fg': '#171717', ring: '#737373',
      'ref-tooltip': '#0a0a0a', 'ref-overlay': '#00000033', 'ref-switch': '#404040', 'ref-segmented': '#171717',
    },
  };
  const tk = TOKENS[config.theme];
  const vars = Object.entries(tk).map(([k, v]) => `--${k.startsWith('ref-') ? k : `sb-${k}`}:${v}`).join(';');
  const R = 'html.sb-ref';
  const style = document.createElement('style');
  style.id = '__ref_style';
  style.textContent = `
${R},${R} body{color-scheme:${config.theme};--background:${tk.bg};--foreground:${tk.fg};${vars};
--sb-shadow-lg:0 20px 25px -5px rgb(0 0 0 / .1),0 8px 10px -6px rgb(0 0 0 / .1)}
${R},${R} body{margin:0!important;padding:0!important;overflow:hidden!important;background:var(--sb-bg)!important}
${R} #proto{margin:0!important;padding:0!important}
${R} .sb-vbar,${R} #proto>:not(.sb-window){display:none!important}
${R} .sb-window{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important}
${R} .sb-sidebar{width:232px!important;border-right-width:.5px!important}
${R} .sb-header{border-bottom-width:.5px!important}
${R} .sb-tooltip{background:var(--ref-tooltip)}
${R} .sb-scrim{background:var(--ref-overlay)}
${R} .sb-seg{background:var(--ref-segmented)}
${R} .lib-switch:not([aria-checked="true"]){background:var(--ref-switch)}
${R} *,${R} *::before,${R} *::after{animation:none!important;transition:none!important;caret-color:transparent!important}
${R} #__ref_banner{position:fixed;left:0;right:0;bottom:0;z-index:2147483647;margin:0;padding:8px 12px;background:#dc2626;color:#fff;font:12px/1.4 Menlo,monospace;white-space:pre-wrap}`;
  html.classList.add('sb-ref');
  html.dataset.refTheme = config.theme;
  (document.head || html).append(style);

  // ---- variant and filter style
  function pickVariant(variants) {
    const want = config.variant.toLowerCase();
    const letter = (k) => String.fromCharCode(97 + k);
    const v = !want ? variants[0]
      : variants.find((x) => x.id.toLowerCase() === want)
        || variants.find((x) => (x.label || '').toLowerCase() === want)
        || variants.find((x, k) => letter(k) === want);
    if (!v) {
      fail(`unknown variant "${config.variant}" (have ${variants.map((x, k) => `${letter(k).toUpperCase()}=${x.id}`).join(', ')})`);
      return null;
    }
    config.variantId = v.id;
    return v.id;
  }
  function applyFilters() {
    if (!config.filters) return;
    const id = { segmented: 'seg', seg: 'seg', menu: 'menu' }[config.filters.toLowerCase()];
    const seg = [...document.querySelectorAll('.sb-vbar .sb-seg')]
      .find((s) => s.querySelector('[data-id="seg"]') && s.querySelector('[data-id="menu"]'));
    if (!id || !seg) { fail(`filters=${config.filters}: only segmented|menu, on the Library page`); return; }
    const btn = seg.querySelector(`[data-id="${id}"]`);
    if (!btn.classList.contains('is-active')) btn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    config.filtersId = id;
  }

  // ---- virtual pointer: :hover rules cloned onto .__ref-hover
  function cloneHoverRules() {
    const walk = (list) => {
      for (let i = list.cssRules.length - 1; i >= 0; i -= 1) {
        const r = list.cssRules[i];
        if (window.CSSGroupingRule && r instanceof CSSGroupingRule) walk(r);
        else if (r instanceof CSSStyleRule && r.selectorText.includes(':hover')) {
          list.insertRule(`${r.selectorText.replace(/:hover\b/g, `.${HOVER}`)}{${r.style.cssText}}`, i + 1);
        }
      }
    };
    [...document.styleSheets].forEach((sheet) => {
      try { walk(sheet); } catch (e) { fail(`cannot read a linked stylesheet (${e.name}); render the built .out.html`); }
    });
  }
  let pointer = null;
  let chain = [];
  function applyHover() {
    const top = pointer ? document.elementFromPoint(pointer.x, pointer.y) : null;
    const next = [];
    for (let n = top; n; n = n.parentElement) next.push(n);
    const prev = chain[0] || null;
    const at = pointer ? { clientX: pointer.x, clientY: pointer.y } : {};
    const fire = (el, type, bubbles, relatedTarget) => {
      if (el.isConnected) el.dispatchEvent(new MouseEvent(type, { bubbles, relatedTarget, view: window, ...at }));
    };
    if (prev !== top && prev) fire(prev, 'mouseout', true, top);
    chain.filter((n) => !next.includes(n)).forEach((n) => { n.classList.remove(HOVER); fire(n, 'mouseleave', false, top); });

    next.forEach((n) => n.classList.add(HOVER)); // a redraw may have replaced the class list

    entered.forEach((n) => fire(n, 'mouseenter', false, prev));

    if (target instanceof Element) return target;
    let list = [...document.querySelectorAll(target)];
    if (text != null) {
      const exact = list.filter((e) => e.textContent.trim() === text);
      list = exact.length ? exact : list.filter((e) => e.textContent.includes(text));
    }
    if (!list[index]) throw new Error(`no element for "${target}" ${JSON.stringify({ text, index })}`);
