<script>/* kit/data.js */
(function () {
  'use strict';

  const targets = [
    { id: 'claude', name: 'Claude Code', path: '~/.claude/skills', logo: 'claude-code' },
    { id: 'cursor', name: 'Cursor', path: '~/.cursor/skills', logo: 'cursor' },
    {
      id: 'universal', name: 'Universal', path: '~/.agents/skills', logo: 'layers',
      members: ['Codex', 'Amp', 'OpenCode', 'Gemini CLI', 'GitHub Copilot'],
      memberLogos: ['codex', 'amp', 'gemini-cli'],
    },
    { id: 'windsurf', name: 'Windsurf', path: '~/.codeium/windsurf/skills', logo: 'windsurf' },
  ];

  const wsDirs = [
    { id: 'claude', path: '.claude/skills', name: 'Claude Code', logo: 'claude-code', tip: 'Cursor reads it too' },
    { id: 'agents', path: '.agents/skills', name: 'Universal', logo: 'layers', tip: 'Codex, Amp, OpenCode, Gemini CLI, GitHub Copilot' },
    { id: 'windsurf', path: '.windsurf/skills', name: 'Windsurf', logo: 'windsurf', tip: '' },
  ];

  const folders = ['Web', 'Backend', 'Writing'];

  const skills = [
    ['a11y-audit', 'Audit pages for WCAG accessibility issues.', 'Web'],
    ['api-docs', 'Generate OpenAPI reference docs from route handlers.', 'Backend'],
    ['changelog', 'Keep CHANGELOG.md in Keep a Changelog format.', 'Writing'],
    ['code-review', 'Review a diff for correctness bugs and style issues.', null],
    ['copy-editor', 'Edit product copy for clarity and tone.', 'Writing'],
    ['data-viz', 'Pick the right chart and build it accessibly.', 'Web'],
    ['docker-compose', 'Author and debug docker-compose files.', 'Backend'],
    ['e2e-playwright', 'Author and debug Playwright end-to-end tests.', 'Web'],
    ['frontend-design', 'Distinctive, intentional visual design for web UIs.', 'Web'],
    ['git-commit', 'Write concise Conventional Commits messages.', null],
    ['k8s-debug', 'Diagnose failing Kubernetes pods and services.', 'Backend', true],
    ['pdf-tools', 'Extract text, merge files, and fill PDF forms.', null, true],
    ['prompt-tuning', 'Tighten prompts and test them against examples.', null],
    ['release-notes', 'Draft release notes from merged pull requests.', 'Writing'],
    ['sql-helper', 'Write and explain SQL for Postgres and SQLite.', 'Backend'],
    ['storybook', 'Write Storybook stories for React components.', 'Web', true],
    ['tailwind-helper', 'Compose Tailwind classes and theme tokens.', 'Web'],
    ['test-writer', 'Write focused unit tests for the code you changed.', null],
  ].map(([slug, desc, folder, hasUpdate]) => ({ slug, desc, folder, hasUpdate: !!hasUpdate }));

  // Active only for your agents: changelog, git-commit, pdf-tools, release-notes, test-writer.
  // Only in workspaces: api-docs, docker-compose, e2e-playwright, sql-helper, storybook, tailwind-helper.
  // Both: code-review ('all' agents), frontend-design.
  // Inactive: a11y-audit, data-viz (Frontend only), k8s-debug (Backend only), copy-editor, prompt-tuning.
  const INITIAL = {
    activePreset: 'default',
    presets: [
      {
        id: 'default', name: 'Default', color: 'neutral',
        skills: {
          'code-review': 'all', 'git-commit': ['claude', 'universal'], 'pdf-tools': ['claude'],
          'test-writer': ['claude', 'cursor'], 'changelog': ['universal'],
          'frontend-design': ['claude', 'cursor'], 'release-notes': ['claude'],
        },
      },
      {
        id: 'frontend', name: 'Frontend', color: 'blue',
        skills: {
          'code-review': 'all', 'frontend-design': 'all', 'tailwind-helper': 'all',
          'storybook': ['claude', 'cursor'], 'a11y-audit': 'all', 'data-viz': ['cursor'],
        },
      },
      {
        id: 'backend', name: 'Backend', color: 'amber',
        skills: {
          'code-review': 'all', 'sql-helper': 'all', 'api-docs': ['universal'],
          'docker-compose': ['claude', 'universal'], 'k8s-debug': ['claude'],
        },
      },
    ],
    workspaces: [
      {
        id: 'acme-web', name: 'acme-web', path: '~/code/acme-web', dirs: ['claude', 'agents'],
        skills: {
          'code-review': 'all', 'storybook': ['claude'], 'e2e-playwright': 'all',
          'tailwind-helper': ['claude'], 'frontend-design': ['agents'],
        },
      },
      {
        id: 'api-server', name: 'api-server', path: '~/code/api-server', dirs: ['claude'],
        skills: { 'sql-helper': 'all', 'docker-compose': 'all', 'api-docs': ['claude'] },
      },
      { id: 'docs-site', name: 'docs-site', path: '~/code/docs-site', dirs: [], skills: {} },
    ],
  };

  // Copies the user edited in place ("You changed this skill here") and unmanaged
  // same-slug copies ("different copy already there"). Keys: slug@target or slug@ws/dir.
  const EDITED = new Set(['release-notes@claude', 'storybook@acme-web/claude']);
  const FOREIGN = new Set(['tailwind-helper@cursor']);

  const clone = (v) => JSON.parse(JSON.stringify(v));
  let state = clone(INITIAL);
  const listeners = new Set();

  const emit = (detail) => listeners.forEach((fn) => fn(detail));
  const bySlug = (a, b) => a.localeCompare(b);
  const placeKey = (slug, target, ws) => (ws ? `${slug}@${ws}/${target}` : `${slug}@${target}`);

  const skill = (slug) => skills.find((s) => s.slug === slug);
  const target = (id) => targets.find((t) => t.id === id);
  const wsDir = (id) => wsDirs.find((d) => d.id === id);
  const workspace = (id) => state.workspaces.find((w) => w.id === id);
  const preset = (id) => state.presets.find((p) => p.id === id);
  const activePreset = () => preset(state.activePreset);

  function presetRaw(slug, presetId = state.activePreset) {
    const raw = preset(presetId)?.skills[slug];
    return raw === undefined ? null : raw;
  }
  function presetHolds(slug, presetId) {
    const raw = presetRaw(slug, presetId);
    if (raw === 'all') return targets.map((t) => t.id);
    return raw ? targets.map((t) => t.id).filter((id) => raw.includes(id)) : [];
  }
  function wsRaw(wsId, slug) {
    const raw = workspace(wsId)?.skills[slug];
    return raw === undefined ? null : raw;
  }
  function workspaceHolds(wsId, slug) {
    const ws = workspace(wsId);
    const raw = wsRaw(wsId, slug);
    if (!ws || !raw) return [];
    return raw === 'all' ? [...ws.dirs] : ws.dirs.filter((d) => raw.includes(d));
  }
  const workspaceDirs = (wsId) => (workspace(wsId)?.dirs || []).map(wsDir);

  function whereActive(slug) {
    return {
      agents: presetHolds(slug),
      workspaces: state.workspaces
        .map((ws) => ({ id: ws.id, dirs: workspaceHolds(ws.id, slug) }))
        .filter((w) => w.dirs.length),
    };
  }
  function isActive(slug) {
    const where = whereActive(slug);
    return where.agents.length > 0 || where.workspaces.length > 0;
  }
  const agentSkills = (targetId) =>
    skills.map((s) => s.slug).filter((slug) => presetHolds(slug).includes(targetId));
  const workspaceSkills = (wsId) =>
    Object.keys(workspace(wsId)?.skills || {}).filter((slug) => workspaceHolds(wsId, slug).length).sort(bySlug);

  function targetsLabel(raw, kind = 'agents', wsId) {
    if (raw === 'all') return 'All agents';
    if (!raw || !raw.length) return '';
    if (raw.length > 1) return `${raw.length} agents`;
    return (kind === 'ws' ? wsDir(raw[0]) : target(raw[0]))?.name || raw[0];
  }
  const isEdited = (slug, place, wsId) => EDITED.has(placeKey(slug, place, wsId));
  function placeName({ target: place, ws }) {
    return ws ? `${ws} · ${wsDir(place)?.name || place}` : target(place)?.name || place;
  }

  function matches(s, { folder, status = 'all', updates, query }) {
    if (folder && s.folder !== folder) return false;
    if (updates && !s.hasUpdate) return false;
    if (status === 'active' && !isActive(s.slug)) return false;
    if (status === 'inactive' && isActive(s.slug)) return false;
    const q = (query || '').trim().toLowerCase();
    return !q || s.slug.includes(q) || s.desc.toLowerCase().includes(q);
  }
  const filterSkills = (opts = {}) => skills.filter((s) => matches(s, opts));
  function counts({ folder, query } = {}) {
    const base = { folder, query };
    return {
      all: filterSkills(base).length,
      active: filterSkills({ ...base, status: 'active' }).length,
      inactive: filterSkills({ ...base, status: 'inactive' }).length,
      updates: filterSkills({ ...base, updates: true }).length,
    };
  }
  function sidebarCounts() {
    const map = (list, fn) => Object.fromEntries(list.map((x) => [x.id, fn(x)]));
    return {
      discovery: 2,
      library: skills.length,
      presets: map(state.presets, (p) => Object.keys(p.skills).length),
      workspaces: map(state.workspaces, (w) => workspaceSkills(w.id).length),
      agents: map(targets, (t) => agentSkills(t.id).length),
    };
  }

  // ---- mutators -------------------------------------------------------------
  function writeRaw(holder, slug, value) {
    if (value === 'all') holder.skills[slug] = 'all';
    else if (value && value.length) holder.skills[slug] = [...value];
    else delete holder.skills[slug];
  }

  function setAgents(slug, value) {
    const p = activePreset();
    const prev = clone(p.skills[slug] ?? null);
    writeRaw(p, slug, value);
    emit({ type: 'agents', slug, preset: p.id });
    return () => { writeRaw(p, slug, prev); emit({ type: 'undo', slug }); };
  }
  function removeAgent(slug, targetId) {
    return setAgents(slug, presetHolds(slug).filter((id) => id !== targetId));
  }

  function setWorkspaceDirs(wsId, slug, value) {
    const ws = workspace(wsId);
    const prev = clone(ws.skills[slug] ?? null);
    const prevDirs = [...ws.dirs];
    if (Array.isArray(value)) value.forEach((d) => ws.dirs.includes(d) || ws.dirs.push(d));
    writeRaw(ws, slug, value);
    emit({ type: 'workspace', slug, ws: wsId });
    return () => { writeRaw(ws, slug, prev); ws.dirs = prevDirs; emit({ type: 'undo', slug, ws: wsId }); };
  }
  function removeWorkspaceDir(wsId, slug, dirId) {
    return setWorkspaceDirs(wsId, slug, workspaceHolds(wsId, slug).filter((d) => d !== dirId));
  }

  function problemFor(pair) {
    const key = placeKey(pair.slug, pair.target, pair.ws);
    if (pair.op === 'add' && FOREIGN.has(key)) return 'different';
    if (pair.op === 'remove' && EDITED.has(key)) return 'edited';
    return undefined;
  }
  function finishPlan(plan) {
    plan.pairs.forEach((p) => { const problem = problemFor(p); if (problem) p.problem = problem; });
    plan.adds = [...new Set(plan.pairs.filter((p) => p.op === 'add').map((p) => p.slug))].sort(bySlug);
    plan.removes = [...new Set(plan.pairs.filter((p) => p.op === 'remove').map((p) => p.slug))].sort(bySlug);
    return plan;
  }

  function planSwitch(presetId) {
    const to = preset(presetId);
    const pairs = [];
    for (const slug of skills.map((s) => s.slug)) {
      const before = presetHolds(slug);
      const after = presetHolds(slug, presetId);
      before.filter((t) => !after.includes(t)).forEach((t) => pairs.push({ slug, target: t, op: 'remove' }));
      after.filter((t) => !before.includes(t)).forEach((t) => pairs.push({ slug, target: t, op: 'add' }));
    }
    return finishPlan({ kind: 'switch', from: state.activePreset, to: presetId,
      title: `Switching to ${to.name}`, toast: `Switched to ${to.name}`, pairs });
  }
  function switchPreset(presetId) {
    const plan = planSwitch(presetId);
    state.activePreset = presetId;
    emit({ type: 'preset', preset: presetId });
    return plan;
  }
  function deletePreset(presetId) {
    if (presetId === 'default') return null;
    const wasOn = state.activePreset === presetId;
    const plan = wasOn ? planSwitch('default') : null;
    if (plan) Object.assign(plan, { kind: 'delete', title: 'Switching to Default', toast: 'Switched to Default' });
    if (wasOn) state.activePreset = 'default';
    state.presets = state.presets.filter((p) => p.id !== presetId);
    emit({ type: 'preset-deleted', preset: presetId });
    return plan;
  }

  function addSkills({ slugs, targets: chosen, ws }) {
    const pairs = [];
    for (const slug of slugs) {
      const before = ws ? workspaceHolds(ws, slug) : presetHolds(slug);
      const raw = ws ? wsRaw(ws, slug) : presetRaw(slug);
      const next = chosen === 'all' || raw === 'all' ? 'all' : [...new Set([...(raw || []), ...chosen])];
      const holder = ws ? workspace(ws) : activePreset();
      if (ws && Array.isArray(next)) next.forEach((d) => holder.dirs.includes(d) || holder.dirs.push(d));
      writeRaw(holder, slug, next);
      const after = ws ? workspaceHolds(ws, slug) : presetHolds(slug);
      after.filter((t) => !before.includes(t)).forEach((t) => pairs.push({ slug, target: t, ws, op: 'add' }));
    }
    const n = slugs.length;
    const noun = n === 1 ? slugs[0] : `${n} skills`;
    emit({ type: 'add', slugs, ws });
    return finishPlan({ kind: 'add', title: `Adding ${noun}`, toast: `Added ${noun}`, pairs });
  }

  function reset() {
    state = clone(INITIAL);
    emit({ type: 'reset' });
  }
  function on(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  window.DATA = {
    targets, wsDirs, folders, skills, discoveryCount: 2,
    skill, target, wsDir, workspace, preset, activePreset,
    presets: () => state.presets, workspaces: () => state.workspaces,
    presetRaw, presetHolds, wsRaw, workspaceHolds, workspaceDirs,
    isActive, whereActive, agentSkills, workspaceSkills, targetsLabel, isEdited, placeName,
    filterSkills, counts, sidebarCounts,
    setAgents, removeAgent, setWorkspaceDirs, removeWorkspaceDir,
    planSwitch, switchPreset, deletePreset, addSkills, reset, on,
  };
})();

</script>
<script>/* kit/shell.js */
(function () {
  'use strict';
  const D = window.DATA;
  const settings = { speed: 'slow', problems: undefined };

  // ---- DOM ------------------------------------------------------------------
  const PROPS = new Set(['checked', 'indeterminate', 'value', 'disabled']);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs == null || typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs)) {
      kids.unshift(attrs);
      attrs = {};
    }
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (PROPS.has(k)) el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    kids.flat(Infinity).forEach((c) => { if (c != null && c !== false) el.append(c instanceof Node ? c : String(c)); });
    return el;
  }
  h.html = function (markup) {
    const t = document.createElement('template');
    t.innerHTML = String(markup).trim();
    return t.content.childNodes.length === 1 ? t.content.firstChild : t.content;
  };
  const ic = (name, size = 16, cls = '') => h.html(window.icon(name, size, cls));
  const winOf = (el) => (el && el.closest && el.closest('.sb-window')) || el;

  // ---- overlay stack: Esc and outside clicks go to the top layer --------------
  const layers = [];
  function pushLayer(layer) {
    layers.push(layer);
    return () => { const i = layers.indexOf(layer); if (i >= 0) layers.splice(i, 1); };
  }
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !layers.length) return;
    e.preventDefault();
    e.stopPropagation();
    const top = layers[layers.length - 1];
    if (top.onEsc) top.onEsc();
  }, true);
  document.addEventListener('mousedown', (e) => {
    const top = layers[layers.length - 1];
    if (top && top.outside && !top.el.contains(e.target) && !(top.anchor && top.anchor.contains(e.target))) top.outside();
  }, true);

  function place(el, anchor, host, { align = 'start', gap = 4 } = {}) {
    const hr = host.getBoundingClientRect();
    const ar = anchor.getBoundingClientRect();
    const ox = hr.left + host.clientLeft;
    const oy = hr.top + host.clientTop;
    const w = el.offsetWidth;
    const ht = el.offsetHeight;
    let left = align === 'end' ? ar.right - ox - w : align === 'center' ? ar.left - ox + ar.width / 2 - w / 2 : ar.left - ox;
    let top = ar.bottom - oy + gap;
    if (top + ht > host.clientHeight - 8 && ar.top - oy - gap - ht >= 8) top = ar.top - oy - gap - ht;
    left = Math.max(8, Math.min(left, host.clientWidth - w - 8));
    top = Math.max(8, Math.min(top, host.clientHeight - ht - 8));
    el.style.left = `${left}px`;
    el.style.top = `${top}px`;
  }

  // ---- tooltips ---------------------------------------------------------------
  let tipEl = null;
  let tipFor = null;
  let tipTimer = 0;
  let tipHiddenAt = 0;
  function hideTip() {
    clearTimeout(tipTimer);
    if (tipEl) { tipEl.remove(); tipEl = null; tipHiddenAt = Date.now(); }
    tipFor = null;
  }
  function showTip(t) {
    const text = t.getAttribute('data-tip');
    if (!text || !t.isConnected) return;
    const host = t.closest('.sb-window');
    tipEl = h('div', { class: 'sb-tooltip', role: 'tooltip' }, text);
    if (host) {
      host.append(tipEl);
      place(tipEl, t, host, { align: 'center', gap: 6 });
      return;
    }
    document.body.append(tipEl);
    const r = t.getBoundingClientRect();
    const max = document.documentElement.clientWidth - tipEl.offsetWidth - 4;
    tipEl.style.left = `${Math.max(4, Math.min(r.left + r.width / 2 - tipEl.offsetWidth / 2, max)) + window.scrollX}px`;
    tipEl.style.top = `${r.bottom + 6 + window.scrollY}px`;
  }
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (t === tipFor) return;
    hideTip();
    if (!t) return;
    tipFor = t;
    tipTimer = setTimeout(() => showTip(t), Date.now() - tipHiddenAt < 400 ? 0 : 350);
  });
  document.addEventListener('mouseout', (e) => { if (!e.relatedTarget) hideTip(); });
  document.addEventListener('mousedown', hideTip, true);
  document.addEventListener('focusout', hideTip);
  document.addEventListener('scroll', (e) => {
    hideTip();
    if (openPop && !openPop.el.contains(e.target)) openPop.close();
  }, true);

  // ---- toast ------------------------------------------------------------------
  function toast(win, html, { action, onAction, ms = 4000, icon } = {}) {
    win = winOf(win);
    win.querySelectorAll(':scope > .sb-toast').forEach((t) => t.remove());
    const el = h('div', { class: `sb-toast${action ? ' has-action' : ''}`, role: 'status' },
      icon ? ic(icon, 15) : null,
      h('span', { class: 'sb-toast-text', html }),
      action ? h('button', { class: 'sb-toast-action', onclick: () => { close(); if (onAction) onAction(); } }, action) : null);
    win.append(el);
    let timer = setTimeout(close, ms);
    el.addEventListener('mouseenter', () => clearTimeout(timer));
    el.addEventListener('mouseleave', () => { timer = setTimeout(close, 1500); });
    function close() {
      clearTimeout(timer);
      if (!el.isConnected || el.classList.contains('is-leaving')) return;
      el.classList.add('is-leaving');
      setTimeout(() => el.remove(), 180);
    }
    return { el, close };
  }

  // ---- dialogs ----------------------------------------------------------------
  function openDialog(win, { title = '', body, footer, size = '', dismissible = true, top = false, onClose } = {}) {
    win = winOf(win);
    let closed = false;
    const titleEl = h('div', { class: 'sb-dialog-title' });
    const closeBtn = h('button', { class: 'sb-btn sb-btn-icon sb-btn-sm', 'aria-label': 'Close', onclick: () => api.close() }, ic('close', 16));
    const bodyEl = h('div', { class: 'sb-dialog-body' });
    const footEl = h('div', { class: 'sb-dialog-footer' });
    const box = h('div', { class: `sb-dialog${size ? ` sb-dialog-${size}` : ''}`, role: 'dialog', 'aria-modal': 'true', tabindex: '-1' },
      h('div', { class: 'sb-dialog-header' }, titleEl, closeBtn), bodyEl, footEl);
    const scrim = h('div', { class: `sb-scrim${top || size === 'lg' ? ' is-top' : ''}` }, box);
    scrim.addEventListener('mousedown', (e) => { if (e.target === scrim && api.dismissible) api.close(); });
    const asNodes = (v) => [v].flat(Infinity).filter((n) => n != null && n !== false).map((n) => (typeof n === 'string' ? h('div', n) : n));
    const api = {
      el: box, scrim, body: bodyEl, footer: footEl, dismissible, onClose,
      setTitle(text, iconHtml) {
        titleEl.replaceChildren(...(iconHtml ? [h.html(iconHtml)] : []), h('span', text));
      },
      setBody(...nodes) { bodyEl.replaceChildren(...asNodes(nodes)); },
      setFooter(...nodes) { footEl.replaceChildren(...asNodes(nodes)); },
      setDismissible(v, { closeButton = v } = {}) { api.dismissible = v; closeBtn.hidden = !closeButton; },
      close(result) {
        if (closed) return;
        closed = true;
        popLayer();
        scrim.remove();
        if (api.onClose) api.onClose(result);
      },
    };
    const popLayer = pushLayer({ el: box, onEsc: () => api.dismissible && api.close() });
    api.setTitle(title);
    api.setBody(body ?? []);
    api.setFooter(footer ?? []);
    api.setDismissible(dismissible);
    win.append(scrim);
    (box.querySelector('[data-autofocus]') || box).focus({ preventScroll: true });
    return api;
  }

  function confirmDialog(win, { title, body, confirm = 'Remove', cancel = 'Cancel', danger = true } = {}) {
    return new Promise((resolve) => {
      let ok = false;
      const d = openDialog(win, {
        title, size: 'sm', body: body ? h('div', { class: 'sb-muted' }, body) : [],
        onClose: () => resolve(ok),
        footer: [
          h('button', { class: 'sb-btn sb-btn-outline', onclick: () => d.close() }, cancel),
          h('button', { class: `sb-btn ${danger ? 'sb-btn-danger' : 'sb-btn-primary'}`, 'data-autofocus': '',
            onclick: () => { ok = true; d.close(); } }, confirm),
        ],
      });
    });
  }

  const PROBLEMS = {
    different: { text: 'Different copy there', yes: 'Replace', no: 'Keep' },
    edited: { text: 'You changed it here', yes: 'Replace', no: 'Keep' },
    unwritable: { text: "Can't write the folder", yes: 'Retry', no: 'Skip' },
  };
  const KINDS = Object.keys(PROBLEMS);
  const stepText = (p) => (p.op === 'remove'
    ? `Removing ${p.slug} from ${D.placeName(p)}`
    : `Copying ${p.slug} → ${D.placeName(p)}`);
  const warnIcon = (size) => `<span style="color:var(--sb-warning);display:grid">${window.icon('alert-circle', size)}</span>`;

  function pickProblems(pairs, problems) {
    if (typeof problems !== 'number') return pairs.filter((p) => p.problem).map((p) => ({ ...p }));
    const n = Math.min(problems, pairs.length);
    return Array.from({ length: n }, (_, k) => ({ ...pairs[Math.floor(((k + 0.5) * pairs.length) / n)], problem: KINDS[k % KINDS.length] }));
  }

  function progressDialog(win, { title, plan, problems = settings.problems, speed = settings.speed, toast: toastText } = {}) {
    win = winOf(win);
    const pairs = (plan && plan.pairs) || [];
    const heading = title || (plan && plan.title) || 'Working';
    const doneToast = toastText === undefined ? plan && plan.toast : toastText;
    const issues = pickProblems(pairs, problems);
    return new Promise((resolve) => {
      if (!pairs.length) { resolve({ problems: [] }); return; }
      const total = pairs.length;
      const totalMs = speed === 'fast' ? 160 : speed === 'slow' ? Math.min(5200, Math.max(2400, total * 240)) : Number(speed) || 1500;
      // Input is blocked from the first moment; the dialog itself appears after 300 ms.
      const blocker = h('div', { style: 'position:absolute;inset:0;z-index:69' });
      const popBlock = pushLayer({ el: blocker });
      win.append(blocker);
      let done = 0;
      let shownAt = 0;
      let d = null;
      const bar = h('span');
      const pct = h('span', { class: 'sb-progress-pct' }, '0%');
      const step = h('div', { class: 'sb-progress-step' }, stepText(pairs[0]));
      const render = () => {
        const p = Math.round((done / total) * 100);
        bar.style.width = `${p}%`;
        pct.textContent = `${p}%`;
        if (done < total) step.textContent = stepText(pairs[done]);
      };
      const show = () => {
        if (d) return;
        shownAt = Date.now();
        d = openDialog(win, { title: heading, size: 'md', dismissible: false,
          body: [h('div', { class: 'sb-progress-row' }, h('div', { class: 'sb-progress' }, bar), pct), step] });
      };
      const showTimer = setTimeout(show, 300);
      const tick = () => {
        done += 1;
        render();
        if (done < total) setTimeout(tick, totalMs / total);
        else finish();
      };
      setTimeout(tick, totalMs / total);

      function finish() {
        clearTimeout(showTimer);
        const wait = d ? Math.max(0, 500 - (Date.now() - shownAt)) : 0;
        setTimeout(() => {
          popBlock();
          blocker.remove();
          if (issues.length) showDone();
          else {
            if (d) d.close();
            if (doneToast) toast(win, doneToast, { icon: 'check-circle' });
            resolve({ problems: [] });
          }
        }, wait);
      }
      function showDone() {
        show();
        const n = issues.length;
        d.setTitle(`Done · ${n} need${n === 1 ? 's' : ''} attention`, warnIcon(18));
        d.setDismissible(true, { closeButton: false });
        step.textContent = issues.map((p) => p.slug).filter((s, i, a) => a.indexOf(s) === i).join(', ');
        d.setFooter(
          h('button', { class: 'sb-btn sb-btn-primary', 'data-autofocus': '', onclick: () => { d.close(); reviewDialog(win, issues); } }, 'Review'),
          h('button', { class: 'sb-btn sb-btn-outline', onclick: () => d.close() }, 'Close'));
        d.el.querySelector('[data-autofocus]').focus({ preventScroll: true });
        d.onClose = () => resolve({ problems: issues });
      }
    });
  }

  function reviewDialog(win, items) {
    return new Promise((resolve) => {
      const rows = items.map((it) => {
        const base = PROBLEMS[it.problem] || PROBLEMS.different;
        // An edited copy met while removing the skill: the choice is Remove / Keep, not Replace.
        const kind = it.problem === 'edited' && it.op === 'remove' ? { ...base, yes: 'Remove' } : base;
        const done = { Retry: 'Done', Remove: 'Removed' }[kind.yes] || 'Replaced';
        const end = h('div', { class: 'sb-row-end' });
        const settle = (label) => end.replaceChildren(h('span', { class: 'sb-hstack sb-muted sb-small', style: 'gap:4px' }, ic('check', 14), label));
        end.append(
          h('button', { class: 'sb-btn sb-btn-primary sb-btn-sm', onclick: () => settle(done) }, kind.yes),
          h('button', { class: 'sb-btn sb-btn-outline sb-btn-sm', onclick: () => settle(kind.no === 'Skip' ? 'Skipped' : 'Kept') }, kind.no));
        return h('div', { class: 'sb-row' },
          h('div', { class: 'sb-row-main' },
            h('div', { class: 'sb-row-title' }, h('span', { class: 'sb-slug' }, it.slug), h('span', { class: 'sb-muted sb-ellipsis' }, `→ ${D.placeName(it)}`)),
            h('div', { class: 'sb-meta' }, h.html(warnIcon(13)), kind.text)),
          end);
      });
      const d = openDialog(win, {
        title: `${items.length} need${items.length === 1 ? 's' : ''} attention`, size: 'md', onClose: resolve,
        body: h('div', { class: 'sb-card' }, rows),
        footer: h('button', { class: 'sb-btn sb-btn-outline', onclick: () => d.close() }, 'Done'),
      });
    });
  }

  // ---- popover / menu ----------------------------------------------------------
  let openPop = null;
  function popover(win, anchor, content, { align = 'start', className = '', onClose } = {}) {
    win = winOf(win || anchor);
    if (openPop) {
      const same = openPop.anchor === anchor;
      openPop.close();
      if (same) return null;
    }
    const el = h('div', { class: `sb-menu ${className}` }, content);
    win.append(el);
    place(el, anchor, win, { align });
    anchor.setAttribute('aria-expanded', 'true');
    let closed = false;
    const api = {
      el, anchor,
      reposition: () => place(el, anchor, win, { align }),
      close() {
        if (closed) return;
        closed = true;
        popLayer();
        el.remove();
        anchor.setAttribute('aria-expanded', 'false');
        if (openPop === api) openPop = null;
        if (onClose) onClose();
      },
    };
    const popLayer = pushLayer({ el, anchor, onEsc: () => api.close(), outside: () => api.close() });
    openPop = api;
    return api;
  }

  function menu(win, anchor, items, opts = {}) {
    let api = null;
    const build = () => (typeof items === 'function' ? items() : items).map((it) => {
      if (it === '-' || it.sep) return h('div', { class: 'sb-menu-sep' });
      if (it.heading) return h('div', { class: 'sb-menu-heading' }, it.heading);
      return h('button', {
        class: `sb-menu-item${it.danger ? ' is-danger' : ''}`, disabled: !!it.disabled, 'data-tip': it.tip,
        onclick: () => {
          if (it.onSelect) it.onSelect(it);
          if (!it.keepOpen) api.close();
          else if (api) api.el.replaceChildren(...build());
        },
      },
      it.icon ? h('span', { class: 'sb-menu-ic', html: it.icon }) : null,
      h('span', { class: 'sb-ellipsis' }, it.label),
      h('span', { class: 'sb-menu-trail', html: it.checked ? window.icon('check', 15) : it.trail || '' }));
    });
    api = popover(win, anchor, build(), opts);
    return api;
  }

  // ---- widgets ------------------------------------------------------------------
  const LOGOS = new Set(['claude-code', 'cursor', 'codex', 'gemini-cli', 'github-copilot', 'windsurf', 'amp', 'opencode']);
  const resolveItem = (item) => (typeof item === 'string' ? D.target(item) || D.wsDir(item) : item);
  const tipOf = (item) => [item.name, item.members ? item.members.join(', ') : item.tip].filter(Boolean).join('\n');

  function avatar(item, { size = 18, tip = true, stack = false } = {}) {
    item = resolveItem(item);
    if (stack && item.memberLogos) {
      return h('span', { class: 'sb-avatar-stack', 'data-tip': tip ? tipOf(item) : null },
        item.memberLogos.map((logo) => avatar({ name: logo, logo }, { size, tip: false })));
    }
    const kind = window.isColorLogo(item.logo) ? 'is-color' : LOGOS.has(item.logo) ? '' : 'is-glyph';
    return h('span', { class: `sb-avatar ${kind}`, style: `--sz:${size}px`, 'data-tip': tip ? tipOf(item) : null,
      html: window.icon(item.logo, size) });
  }
  function avatarStack(items, { size = 18, max = 4 } = {}) {
    const list = items.map(resolveItem);
    const shown = list.length > max ? list.slice(0, max - 1) : list;
    const rest = list.slice(shown.length);
    return h('span', { class: 'sb-avatar-stack' }, shown.map((it) => avatar(it, { size })),
      rest.length ? h('span', { class: 'sb-avatar sb-avatar-more', style: `--sz:${size}px`, 'data-tip': rest.map((r) => r.name).join('\n') }, `+${rest.length}`) : null);
  }
  function pill(item, on, { onClick, iconOnly = false, disabled = false, tip } = {}) {
    item = resolveItem(item);
    const autoTip = iconOnly || item.members || item.tip ? tipOf(item) : null;
    return h('button', {
      class: `sb-pill${on ? ' is-on' : ''}${iconOnly ? ' is-icon' : ''}`, 'aria-pressed': String(!!on),
      disabled, 'data-tip': tip === undefined ? autoTip : tip, onclick: onClick,
    }, h('span', { class: 'sb-pill-logo', html: window.icon(item.logo, 15) }), iconOnly ? null : item.name);
  }
  function wsChip(ws, { dirs, onClick } = {}) {
    ws = typeof ws === 'string' ? D.workspace(ws) : ws;
    const names = (dirs || []).map((d) => D.wsDir(d).name).join(', ');
    return h(onClick ? 'button' : 'span', { class: 'sb-chip', onclick: onClick, 'data-tip': names ? `${ws.name}\n${names}` : ws.name },
      ic('code-folder', 13), ws.name);
  }
  function presetChip({ tip } = {}) {
    const p = D.activePreset();
    return h('span', { class: 'sb-chip', 'data-tip': tip || `Saved to ${p.name}` }, h('span', { class: `sb-dot sb-tint-${p.color}` }), p.name);
  }
  function checkbox({ checked = false, indeterminate = false, disabled = false, onChange, label, tip } = {}) {
    const input = h('input', { type: 'checkbox', class: 'sb-checkbox', checked, indeterminate, disabled,
      'data-tip': label ? null : tip, onchange: (e) => onChange && onChange(e.target.checked, e) });
    return label ? h('label', { class: 'sb-check-label', 'data-tip': tip }, input, label) : input;
  }
  function seg(options, value, onChange) {
    const el = h('div', { class: 'sb-seg', role: 'tablist' });
    options.forEach((o) => el.append(h('button', {
      class: o.id === value ? 'is-active' : '', role: 'tab', 'data-id': o.id, 'data-tip': o.tip, 'aria-label': o.label || o.tip,
      onclick: () => {
        el.querySelectorAll('button').forEach((b) => b.classList.toggle('is-active', b.dataset.id === o.id));
        if (onChange) onChange(o.id);
      },
    }, o.icon ? h.html(o.icon) : null, o.label || null, o.count != null ? h('span', { class: 'sb-seg-count' }, o.count) : null)));
    return el;
  }
  function tabs(options, value, onChange, { onAdd } = {}) {
    const el = h('div', { class: 'sb-tabs' });
    options.forEach((o, i) => {
      el.append(h('button', { class: `sb-tab${o.id === value ? ' is-active' : ''}`, onclick: () => onChange && onChange(o.id) }, o.label));
      if (i === 0) el.append(h('span', { class: 'sb-tabs-sep' }));
    });
    if (onAdd) el.append(h('button', { class: 'sb-btn sb-btn-icon sb-btn-sm', 'data-tip': 'Add folder', onclick: onAdd }, ic('plus', 15)));
    return el;
  }
  function searchInput({ placeholder = 'Search skills', value = '', onInput } = {}) {
    return h('label', { class: 'sb-search' }, ic('search', 15),
      h('input', { class: 'sb-input', type: 'search', placeholder, value, oninput: (e) => onInput && onInput(e.target.value) }));
  }
  function emptyState({ icon = 'libraries', title, sub, action } = {}) {
    return h('div', { class: 'sb-empty' }, h('div', { class: 'sb-empty-ic', html: window.icon(icon, 20) }),
      title ? h('div', { class: 'sb-empty-title' }, title) : null, sub ? h('div', { class: 'sb-empty-sub' }, sub) : null,
      action ? h('div', { style: 'margin-top:8px' }, action) : null);
  }
  const spinner = (size = 14) => ic('loading', size, 'sb-spin');

  // ---- sidebar --------------------------------------------------------------------
  function renderSidebar(el, opts = {}) {
    el.__sb = Object.assign(el.__sb || {}, opts);
    el.classList.add('sb-sidebar');
    if (!el.__sbOff) el.__sbOff = D.on(() => (el.isConnected ? drawSidebar(el) : el.__sbOff()));
    drawSidebar(el);
    return { update: (o) => renderSidebar(el, o) };
  }
  function drawSidebar(el) {
    const { active = 'library', onNav, onPreset } = el.__sb;
    const c = D.sidebarCounts();
    const on = D.activePreset();
    const go = (key) => (onNav ? onNav(key) : renderSidebar(el, { active: key }));
    const row = (key, iconHtml, label, count, x = {}) => h('button', {
      class: `sb-nav-row${key === active ? ' is-active' : ''}${x.on ? ' is-on' : ''}`, 'data-nav': key, 'data-tip': x.tip,
      onclick: x.onclick || (() => go(key)),
    }, h('span', { class: 'sb-nav-ic', html: iconHtml }), h('span', { class: 'sb-nav-label' }, label, x.after || null),
    count == null ? null : h('span', { class: 'sb-nav-count' }, count));
    const section = (label, addTip) => h('div', { class: 'sb-nav-section' }, label,
      addTip ? h('button', { class: 'sb-btn sb-btn-icon sb-btn-xs', 'data-tip': addTip, 'aria-label': addTip }, ic('plus', 14)) : null);
    const switchTo = (id) => (onPreset ? onPreset(id) : progressDialog(el, { plan: D.switchPreset(id) }));
    el.replaceChildren(...[
      h('div', { class: 'sb-lights' }, h('i'), h('i'), h('i')),
      row('discovery', window.icon('compass', 15), 'Discovery', c.discovery),
      row('library', window.icon('libraries', 15), 'Library', c.library),
      section('Presets', 'Add preset'),
      D.presets().map((p) => row(`preset:${p.id}`, `<span class="sb-dot sb-tint-${p.color}"></span>`, p.name, c.presets[p.id], {
        on: p.id === on.id,
        tip: p.id === on.id ? null : `Switch to ${p.name}`,
        after: p.id === on.id ? h('span', { class: `sb-nav-on sb-tint-${p.color}`, html: window.icon('check', 13) }) : null,
        onclick: () => { if (p.id !== on.id) switchTo(p.id); },
      })),
      section('Workspaces', 'Add workspace'),
      D.workspaces().map((w) => row(`ws:${w.id}`, window.icon('code-folder', 15), w.name, c.workspaces[w.id])),
      section('Agents'),
      D.targets.map((t) => row(`agent:${t.id}`, window.icon(t.logo, 15), t.name, c.agents[t.id], { tip: t.members ? t.members.join(', ') : null })),
      h('div', { class: 'sb-nav-foot' }, row('settings', window.icon('settings', 15), 'Settings', null)),
    ].flat());
  }

  // ---- variant bar + demo controls ----------------------------------------------------
  function variantBar(root, variants, onChange) {
    // Reference mode (kit/reference.js, ?ref=1) may start on the variant its URL names.
    let current = (window.__ref && window.__ref.pickVariant(variants)) || variants[0].id;
    const segEl = h('div', { class: 'sb-vbar-seg', role: 'tablist' });
    const desc = h('div', { class: 'sb-vbar-desc' });
    const extra = h('div', { class: 'sb-vbar-extra' });
    const el = h('div', { class: 'sb-vbar' }, h('div', { class: 'sb-vbar-top' }, segEl, extra), desc);
    variants.forEach((v, i) => segEl.append(h('button', { class: 'sb-vbar-opt', role: 'tab', 'data-id': v.id, onclick: () => set(v.id) },
      h('b', String.fromCharCode(65 + i)), v.label)));
    if (root.classList.contains('sb-window')) root.before(el);
    else root.prepend(el);
    function set(id) {
      const v = variants.find((x) => x.id === id) || variants[0];
      current = v.id;
      segEl.querySelectorAll('.sb-vbar-opt').forEach((b) => {
        b.classList.toggle('is-active', b.dataset.id === v.id);
        b.setAttribute('aria-selected', String(b.dataset.id === v.id));
      });
      desc.textContent = v.desc || '';
      if (onChange) onChange(v.id, v);
    }
    set(current);
    return { el, extra, set, get: () => current };
  }
  function demoControls() {
    return h('div', { class: 'sb-hstack', style: 'gap:6px' },
      seg([{ id: 'fast', label: 'Fast', tip: 'Work ends before the dialog shows' }, { id: 'slow', label: 'Slow' }], settings.speed, (v) => { settings.speed = v; }),
      seg([{ id: 'plan', label: 'Problems', tip: "Use the plan's own problems" }, { id: 'none', label: 'Clean' }], settings.problems === 0 ? 'none' : 'plan',
        (v) => { settings.problems = v === 'none' ? 0 : undefined; }));
  }

  // Standalone (no host theme): let the page itself follow the OS appearance.
  const markStandalone = () => {
    if (!getComputedStyle(document.documentElement).getPropertyValue('--background').trim()) {
      document.documentElement.classList.add('sb-standalone');
    }
  };
  markStandalone();
  document.addEventListener('DOMContentLoaded', markStandalone);

  window.SB = {
    settings, h, ic, toast, openDialog, confirmDialog, progressDialog, reviewDialog, popover, menu,
    avatar, avatarStack, pill, wsChip, presetChip, checkbox, seg, tabs, searchInput, emptyState, spinner,
    renderSidebar, variantBar, demoControls,
  };
  Object.assign(window, window.SB);
})();

</script>
<script>
(function () {
  'use strict';
  const D = window.DATA;
  const win = document.getElementById('win');
  const side = document.getElementById('side');
  const hdr = document.getElementById('hdr');
  const page = document.getElementById('page');

  const ui = {
    variant: 'popover', filterStyle: 'seg', layout: 'list', view: 'library',
    folder: null, status: 'all', updates: false, query: '',
    folders: [...D.folders], skill: null, selected: null, scrollTop: 0,
  };
  const rows = new Map();   // slug -> {el, place, slug} for the rendered list
  const insp = h('aside', { class: 'lib-insp', 'aria-label': 'Where it is on' });
  let pop = null;           // A: {api, slug, content}
  let filtersSlot = null;   // re-painted on filter and data changes
  let skillWhere = null;    // C: the editor block on the skill page
  let switching = false;

  // ---- shell -----------------------------------------------------------------------
  renderSidebar(side, { active: 'library', onNav: nav, onPreset: switchTo });
  const bar = variantBar(document.getElementById('proto'), [
    { id: 'popover', label: 'Popover', desc: 'Click where a skill is on (right of each row) to change it in a popover.' },
    { id: 'inspector', label: 'Inspector', desc: 'Click a row to change where it is on in a side panel.' },
    { id: 'page', label: 'Skill page', desc: "Click a row to open the skill's page and change where it is on there." },
  ], (id) => { closePop(); Object.assign(ui, { variant: id, selected: null, skill: null }); insp.remove(); draw(); });
  bar.extra.append(
    h('span', { class: 'sb-muted sb-small' }, 'Filters'),
    seg([{ id: 'seg', label: 'Segmented' }, { id: 'menu', label: 'Menu' }], ui.filterStyle, (v) => { ui.filterStyle = v; draw(); }),
    demoControls());

  D.on((ev) => {
    if (switching) return;
    if (ev.type === 'preset' || ev.type === 'preset-deleted' || ev.type === 'reset') draw();
    else refresh();
  });
  // Esc in the search box only clears it; elsewhere it closes the inspector.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || e.target.closest('input')) return;
    if (ui.view === 'library' && ui.selected && !ui.skill) closeInspector();
  });
  // Repaint placements when the window is resized (full-width browser), so names and counts fit.
  new ResizeObserver(() => { if (ui.view === 'library' && !ui.skill) rows.forEach(paintItem); }).observe(win);

  function nav(key) {
    closePop();
    ui.view = key;
    ui.skill = null;
    renderSidebar(side, { active: key });
    draw();
  }

  // The list updates after the blocking switch, not under it.
  async function switchTo(id) {
    closePop();
    const plan = D.planSwitch(id);
    switching = true;
    D.switchPreset(id);
    await progressDialog(win, { plan });
    switching = false;
    draw();
  }

  function draw() {
    if (ui.view !== 'library') drawOther();
    else if (ui.skill) drawSkillPage(ui.skill);
    else drawLibrary();
  }

  function refresh() {
    if (ui.view !== 'library') return;
    if (ui.skill) { paintSkillWhere(); return; }
    paintFilters();
    rows.forEach(paintItem);
    if (pop) { keepFocus(pop.content, () => pop.content.replaceChildren(...whereSections(pop.slug, { compact: true }))); placePop(); }
    if (ui.selected && insp.isConnected) paintInspector();
  }

  // ---- Library: header, filters, list ---------------------------------------------------
  function drawLibrary() {
    closePop();
    const tabOpts = [{ id: null, label: 'All skills' }, ...ui.folders.map((f) => ({ id: f, label: f }))];
    const check = h('button', { class: 'sb-btn sb-btn-icon', 'data-tip': 'Check for updates', 'aria-label': 'Check for updates', onclick: () => {
      check.replaceChildren(spinner(16));
      setTimeout(() => {
        check.replaceChildren(ic('refresh-04', 16));
        const n = D.skills.filter((s) => s.hasUpdate).length;
        if (!n) { toast(win, 'Up to date', { icon: 'check-circle' }); return; }
        toast(win, `${n} update${n === 1 ? '' : 's'}`, { icon: 'upload-circle', action: 'Show', onAction: showUpdates });
      }, 900);
    } }, ic('refresh-04', 16));
    hdr.replaceChildren(
      tabs(tabOpts, ui.folder, (f) => { ui.folder = f; drawLibrary(); }, { onAdd: addFolder }),
      h('div', { class: 'sb-header-actions' }, check,
        h('button', { class: 'sb-btn sb-btn-icon', 'data-tip': 'Import', 'aria-label': 'Import', onclick: () => toast(win, 'Not in this prototype') }, ic('import', 16))));

    filtersSlot = h('div', { class: 'lib-filters' });
    const toolbar = h('div', { class: 'sb-toolbar lib-toolbar' },
      searchInput({ value: ui.query, onInput: (q) => { ui.query = q; paintFilters(); drawList(); } }),
      filtersSlot,
      h('span', { class: 'sb-spacer' }),
      seg([{ id: 'list', icon: icon('list-view', 15), tip: 'List' }, { id: 'grid', icon: icon('grid-view', 15), tip: 'Grid' }],
        ui.layout, (v) => { ui.layout = v; drawList(); }));
    if (ui.filterStyle === 'menu') {
      const btn = h('button', {
        class: 'sb-btn sb-btn-icon lib-fbtn', 'data-tip': 'Filter', 'aria-label': 'Filter', 'aria-haspopup': 'menu',
        html: newIcon('filter', 16).replace('data-tip="new icon"', 'data-tip="Filter\nnew icon"'),
        onclick: (e) => filterMenu(e.currentTarget),
      });
      filtersSlot.append(btn, h('div', { class: 'lib-fchips' }));
    }
    const body = h('div', { class: 'lib-body' }, h('div', { class: 'lib-scroll' }));
    page.className = 'sb-page lib-page';
    page.replaceChildren(toolbar, body);
    paintFilters();
    drawList();
    if (ui.variant === 'inspector' && ui.selected) showInspector();
    page.querySelector('.lib-scroll').scrollTop = ui.scrollTop;
    ui.scrollTop = 0;
  }

  function setFilter(patch) {
    Object.assign(ui, patch);
    closePop();
    paintFilters();
    drawList();
  }
  function showUpdates() {
    if (ui.view !== 'library' || ui.skill) return;
    Object.assign(ui, { folder: null, status: 'all', query: '', updates: true });
    drawLibrary();
  }

  // Each filter counts what it would show with the other filters applied.
  function counts() {
    const n = (o) => D.filterSkills({ folder: ui.folder, query: ui.query, ...o }).length;
    return {
      all: n({ updates: ui.updates }),
      active: n({ status: 'active', updates: ui.updates }),
      inactive: n({ status: 'inactive', updates: ui.updates }),
      updates: n({ status: ui.status, updates: true }),
    };
  }

  function paintFilters() {
    if (!filtersSlot || !filtersSlot.isConnected) return;
    const c = counts();
    if (ui.filterStyle === 'menu') {
      filtersSlot.querySelector('.lib-fbtn').classList.toggle('is-on', ui.status !== 'all' || ui.updates);
      const chips = [];
      if (ui.status !== 'all') chips.push(filterChip(null, ui.status === 'active' ? 'Active' : 'Inactive', { status: 'all' }));
      if (ui.updates) chips.push(filterChip('upload-circle', 'Updates', { updates: false }));
      filtersSlot.querySelector('.lib-fchips').replaceChildren(...chips);
      return;
    }
    filtersSlot.replaceChildren(
      seg([{ id: 'all', label: 'All', count: c.all }, { id: 'active', label: 'Active', count: c.active }, { id: 'inactive', label: 'Inactive', count: c.inactive }],
        ui.status, (s) => setFilter({ status: s })),
      h('button', {
        class: `sb-chip lib-tall${ui.updates ? ' is-active' : ''}`, 'data-tip': 'Updates', 'aria-label': 'Updates', 'aria-pressed': String(ui.updates),
        onclick: () => setFilter({ updates: !ui.updates }),
      }, ic('upload-circle', 14), h('span', { class: 'sb-chip-count' }, c.updates)));
  }

  function filterChip(iconName, label, patch) {
    return h('button', { class: 'sb-chip lib-fchip lib-tall', 'data-tip': 'Remove filter', 'aria-label': `Remove ${label} filter`, onclick: () => setFilter(patch) },
      iconName ? ic(iconName, 13) : null, label, ic('close', 12));
  }

  function filterMenu(anchor) {
    menu(win, anchor, () => {
      const c = counts();
      const count = (n) => `<span>${n}</span>`;
      const radio = (id, label) => ({
        label, icon: `<span class="lib-radio${ui.status === id ? ' is-on' : ''}"></span>`, trail: count(c[id]),
        keepOpen: true, onSelect: () => setFilter({ status: id }),
      });
      return [
        { heading: 'Status' }, radio('all', 'All'), radio('active', 'Active'), radio('inactive', 'Inactive'), '-',
        { label: 'Updates', icon: `<span class="lib-fcheck${ui.updates ? ' is-on' : ''}">${ui.updates ? icon('check', 12) : ''}</span>`,
          trail: icon('upload-circle', 13) + count(c.updates), keepOpen: true, onSelect: () => setFilter({ updates: !ui.updates }) },
      ];
    }, { className: 'lib-fmenu' });
  }

  function addFolder(e) {
    const anchor = e.currentTarget;
    const input = h('input', { class: 'sb-input', placeholder: 'Folder name', 'aria-label': 'Folder name' });
    const api = popover(win, anchor, h('form', { class: 'lib-folderpop', onsubmit: (ev) => {
      ev.preventDefault();
      const name = input.value.trim();
      if (!name) return;
      if (!ui.folders.includes(name)) ui.folders.push(name);
      api.close();
      ui.folder = name;
      drawLibrary();
    } }, input, h('button', { class: 'sb-btn sb-btn-primary', type: 'submit' }, 'Add')), { className: 'lib-pop-sm' });
    if (api) input.focus();
  }

  function drawList() {
    const scroll = page.querySelector('.lib-scroll');
    if (!scroll) return;
    rows.clear();
    const list = D.filterSkills(ui);
    if (!list.length) {
      const filtered = ui.status !== 'all' || ui.updates || ui.query;
      scroll.replaceChildren(filtered
        ? emptyState({ icon: 'search', title: 'No skills match',
          action: h('button', { class: 'sb-btn sb-btn-outline sb-btn-sm', onclick: () => { Object.assign(ui, { status: 'all', updates: false, query: '' }); drawLibrary(); } }, 'Clear filters') })
        : emptyState({ icon: 'folder', title: `No skills in ${ui.folder}` }));
      return;
    }
    const items = list.map(item);
    scroll.replaceChildren(ui.layout === 'grid' ? h('div', { class: 'lib-grid' }, items) : h('div', { class: 'sb-card' }, items));
  }

  // Edited rows stay put while their popover or inspector is open; the filter re-applies after.
  function reconcile() {
    if (ui.view !== 'library' || ui.skill || !page.querySelector('.lib-scroll')) return;
    const want = new Set(D.filterSkills(ui).map((s) => s.slug));
    if ([...want].some((s) => !rows.has(s))) { closePop(); drawList(); return; }
    [...rows.keys()].filter((s) => !want.has(s) && s !== ui.selected && !(pop && pop.slug === s)).forEach((s) => {
      rows.get(s).el.remove();
      rows.delete(s);
    });
    if (!rows.size) drawList();
    placePop();
  }

  function updateMark(s) {
    return s.hasUpdate ? h('span', { class: 'lib-upd', 'data-tip': 'Update available', html: icon('upload-circle', 14) }) : null;
  }

  function item(s) {
    const grid = ui.layout === 'grid';
    const place = ui.variant === 'popover'
      ? h('button', { class: 'lib-place is-btn', 'aria-haspopup': 'dialog', onclick: (e) => { e.stopPropagation(); openWhere(s.slug, place); } })
      : h('span', { class: 'lib-place' });
    const title = h('div', { class: 'sb-row-title' }, h('span', { class: 'sb-slug' }, s.slug), updateMark(s),
      s.folder && !ui.folder ? h('span', { class: 'sb-tag lib-foldertag' }, s.folder) : null);
    const go = ui.variant === 'page' ? h('span', { class: 'lib-go', html: icon('chevron-right', 14) }) : null;
    const el = grid
      ? h('div', { class: 'lib-tile' }, title, h('div', { class: 'sb-desc lib-tile-desc' }, s.desc), h('div', { class: 'lib-tile-foot' }, place))
      : h('div', { class: 'sb-row lib-row' }, h('div', { class: 'sb-row-main' }, title, h('div', { class: 'sb-desc' }, s.desc)),
        h('div', { class: 'sb-row-end' }, place, go));
    if (ui.variant !== 'popover') {
      el.tabIndex = 0;
      el.classList.add('is-clickable');
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', s.slug);
      el.addEventListener('click', () => activate(s.slug));
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(s.slug); } });
    }
    const r = { el, place, slug: s.slug };
    rows.set(s.slug, r);
    paintItem(r);
    return el;
  }

  function paintItem(r) {
    const active = D.isActive(r.slug);
    r.el.classList.toggle('is-dim', !active);
    r.el.classList.toggle('is-selected', ui.variant === 'inspector' && ui.selected === r.slug);
    r.place.classList.toggle('is-empty', !active);
    r.place.replaceChildren(...placement(r.slug));
    if (r.place.tagName !== 'BUTTON') return;
    if (active) { r.place.removeAttribute('data-tip'); r.place.setAttribute('aria-label', 'Change where it is on'); }
    else { r.place.setAttribute('data-tip', 'Turn on'); r.place.setAttribute('aria-label', 'Turn on'); }
  }

  // A row or tile too narrow for a workspace name (e.g. the inspector is open) shows a count.
  function isNarrow() {
    const scroll = page.querySelector('.lib-scroll');
    if (!scroll) return false;
    const w = scroll.clientWidth;
    if (ui.layout !== 'grid') return w < 440;
    const cols = Math.max(1, Math.floor((w + 10) / 190));
    return (w - (cols - 1) * 10) / cols < 200;
  }

  // Your agents as one logo stack; workspaces as chips (a count when narrow or several).
  function placement(slug) {
    const w = D.whereActive(slug);
    const isBtn = ui.variant === 'popover';
    if (!w.agents.length && !w.workspaces.length) return isBtn ? [ic('plus', 14)] : [];
    const out = [];
    if (w.agents.length) {
      const names = D.presetRaw(slug) === 'all' ? 'All agents' : w.agents.map((id) => D.target(id).name).join(', ');
      out.push(h('span', { class: 'sb-avatar-stack', 'data-tip': `Your agents\n${names}` }, w.agents.map((id) => avatar(id, { tip: false }))));
    }
    if (w.agents.length && w.workspaces.length) out.push(h('span', { class: 'lib-place-sep' }));
    const dirNames = (x) => x.dirs.map((d) => D.wsDir(d).name).join(', ');
    if (w.workspaces.length === 1 && !isNarrow()) {
      const x = w.workspaces[0];
      out.push(h('span', { class: 'sb-chip lib-wschip', 'data-tip': `${x.id}\n${dirNames(x)}` }, ic('code-folder', 13), x.id));
    } else if (w.workspaces.length) {
      out.push(h('span', { class: 'sb-chip lib-wschip', 'data-tip': w.workspaces.map((x) => `${x.id} · ${dirNames(x)}`).join('\n') },
        ic('code-folder', 13), String(w.workspaces.length)));
    }
    if (isBtn) out.push(h('span', { style: 'display:grid;opacity:.7', html: icon('arrow-down', 12) }));
    return out;
  }

  // ---- the shared "where it's on" editor --------------------------------------------------
  function withKey(el, key) { el.dataset.key = key; return el; }
  function keepFocus(root, fn) {
    const a = document.activeElement;
    const key = a && root.contains(a) ? a.dataset.key : null;
    fn();
    const next = key && root.querySelector(`[data-key="${key}"]`);
    if (next) next.focus({ preventScroll: true });
  }

  // compact (popover): agent pills are logos on the All agents line, like the workspace lines.
  function whereSections(slug, { compact = false } = {}) {
    const raw = D.presetRaw(slug);
    const holds = D.presetHolds(slug);
    const all = raw === 'all';
    const allRow = h('div', { class: compact ? 'lib-allrow is-compact' : 'lib-allrow', 'data-tip': 'Includes agents added later' }, h('span', 'All agents'),
      withKey(h('button', { class: 'lib-switch', role: 'switch', 'aria-checked': String(all), 'aria-label': 'All agents',
        onclick: () => D.setAgents(slug, all ? holds : 'all') }), 'all'));
    const pills = D.targets.map((t) =>
      withKey(pill(t, holds.includes(t.id), { iconOnly: compact, onClick: () => toggleAgent(slug, t.id) }), `a:${t.id}`));
    const agents = h('section', { class: 'lib-sec' },
      h('div', { class: 'lib-sec-head' }, h('span', { class: 'lib-sec-label' }, 'Your agents'), presetChip()),
      compact
        ? h('div', { class: 'lib-wsline' }, allRow, h('span', { class: 'lib-wspills' }, pills))
        : [allRow, h('div', { class: 'lib-pills' }, pills)]);
    const workspaces = h('section', { class: 'lib-sec' },
      h('div', { class: 'lib-sec-head' }, h('span', { class: 'lib-sec-label' }, 'Workspaces')),
      D.workspaces().map((ws) => wsLine(slug, ws)));
    return [agents, workspaces];
  }

  // A workspace with no agents yet offers every agent folder it could use.
  function wsLine(slug, ws) {
    const dirs = D.workspaceDirs(ws.id);
    const holds = D.workspaceHolds(ws.id, slug);
    const none = !dirs.length;
    return h('div', { class: 'lib-wsline' },
      h('div', { class: 'lib-wsname' },
        h('span', { class: 'lib-wsname-top' }, ic('code-folder', 14), h('span', { class: 'sb-ellipsis' }, ws.name)),
        none ? h('span', { class: 'lib-none' }, 'No agents yet') : null),
      h('span', { class: 'lib-wspills' }, (none ? D.wsDirs : dirs).map((d) =>
        withKey(pill(d, holds.includes(d.id), { iconOnly: true, onClick: () => toggleWsDir(slug, ws.id, d.id) }), `w:${ws.id}:${d.id}`))));
  }

  function confirmEdited(slug, place) {
    return confirmDialog(win, { title: 'You changed this skill here', body: `${slug} · ${place}`, confirm: 'Remove', cancel: 'Keep' });
  }

  // Unticking the last agent removes silently; only an edited copy asks.
  async function toggleAgent(slug, id) {
    const raw = D.presetRaw(slug);
    const holds = D.presetHolds(slug);
    if (!holds.includes(id)) { D.setAgents(slug, raw === 'all' ? 'all' : [...holds, id]); return; }
    if (D.isEdited(slug, id) && !(await confirmEdited(slug, D.target(id).name))) return;
    D.removeAgent(slug, id);
  }

  async function toggleWsDir(slug, wsId, dir) {
    const holds = D.workspaceHolds(wsId, slug);
    if (!holds.includes(dir)) {
      D.setWorkspaceDirs(wsId, slug, D.wsRaw(wsId, slug) === 'all' ? 'all' : [...holds, dir]);
      return;
    }
    if (D.isEdited(slug, dir, wsId) && !(await confirmEdited(slug, D.placeName({ target: dir, ws: wsId })))) return;
    D.removeWorkspaceDir(wsId, slug, dir);
  }

  // ---- A: popover -------------------------------------------------------------------
  function openWhere(slug, anchor, scrolled = false) {
    const content = h('div', { class: 'lib-where' }, whereSections(slug, { compact: true }));
    const api = popover(win, anchor, content, {
      align: ui.layout === 'grid' ? 'start' : 'end', className: 'lib-pop',
      onClose: () => { if (pop && pop.api === api) pop = null; setTimeout(reconcile, 0); },
    });
    if (!api) return;
    pop = { api, slug, content, anchor };
    api.el.setAttribute('role', 'dialog');
    api.el.setAttribute('aria-label', `Where ${slug} is on`);
    const need = placePop();
    if (!need || scrolled) return;
    // Neither side fits: scroll the list to make room, then reopen (closing and scrolling run before
    // any paint, so nothing flashes; the reopen waits for the scroll event, which closes popovers).
    const scroll = page.querySelector('.lib-scroll');
    const max = scroll.scrollHeight - scroll.clientHeight;
    const view = scroll.getBoundingClientRect();
    const item = anchor.closest('.lib-row, .lib-tile').getBoundingClientRect();
    const stays = (d) => item.top - d >= view.top && item.bottom - d <= view.bottom;   // the whole row stays in view
    const delta = [need.down, -need.up].filter((d) => scroll.scrollTop + d >= 0 && scroll.scrollTop + d <= max && stays(d))
      .sort((x, y) => Math.abs(x) - Math.abs(y))[0];
    if (delta === undefined) return;
    api.close();
    scroll.scrollTop += delta;
    requestAnimationFrame(() => requestAnimationFrame(() => { if (anchor.isConnected && !pop) openWhere(slug, anchor, true); }));
  }

  // Below the placement, or above it (above the whole tile in the grid, so its title stays
  // visible). Returns null when placed, else the scroll {down, up} that would make room; until
  // then it sits beside the placement.
  function placePop() {
    if (!pop) return null;
    const { el } = pop.api;
    const wr = win.getBoundingClientRect();
    const ox = wr.left + win.clientLeft;
    const oy = wr.top + win.clientTop;
    const rel = (r) => ({ l: r.left - ox, r: r.right - ox, t: r.top - oy, b: r.bottom - oy });
    const a = rel(pop.anchor.getBoundingClientRect());
    const tile = pop.anchor.closest('.lib-tile');
    const above = tile ? rel(tile.getBoundingClientRect()).t : a.t;
    const W = win.clientWidth;
    const H = win.clientHeight;
    const w = el.offsetWidth;
    const ht = el.offsetHeight;
    let left = tile ? a.l : a.r - w;
    let top;
    let need = null;
    if (a.b + 4 + ht <= H - 8) top = a.b + 4;
    else if (above - 4 - ht >= 8) top = above - 4 - ht;
    else {
      need = { down: Math.ceil(a.b + 4 + ht - (H - 8)), up: Math.ceil(8 - (above - 4 - ht)) };
      top = (a.t + a.b) / 2 - ht / 2;
      left = a.l - 8 - w >= 8 ? a.l - 8 - w : a.r + 8;
    }
    el.style.left = `${Math.max(8, Math.min(left, W - w - 8))}px`;
    el.style.top = `${Math.max(8, Math.min(top, H - ht - 8))}px`;
    return need;
  }
  function closePop() { if (pop) pop.api.close(); }

  // ---- B: inspector ------------------------------------------------------------------
  function activate(slug) {
    if (ui.variant === 'page') { openSkill(slug); return; }
    const prev = ui.selected;
    ui.selected = slug;
    showInspector();
    if (prev && prev !== slug) reconcile();   // the row left behind re-applies the filters
  }
  function showInspector() {
    const body = page.querySelector('.lib-body');
    if (!body) return;
    if (!insp.isConnected) body.append(insp);
    paintInspector();
    rows.forEach(paintItem);
  }
  function paintInspector() {
    const s = D.skill(ui.selected);
    keepFocus(insp, () => insp.replaceChildren(
      h('div', { class: 'lib-insp-head' },
        h('span', { class: 'sb-slug' }, s.slug), updateMark(s),
        h('button', { class: 'sb-btn sb-btn-icon sb-btn-sm', 'data-tip': 'Open skill page', 'aria-label': 'Open skill page', onclick: () => openSkill(s.slug) }, ic('book', 15)),
        h('button', { class: 'sb-btn sb-btn-icon sb-btn-sm', 'data-tip': 'Close', 'aria-label': 'Close', onclick: closeInspector }, ic('close', 15))),
      h('div', { class: 'sb-desc lib-insp-desc' }, s.desc),
      h('div', { class: 'lib-where' }, whereSections(s.slug))));
  }
  function closeInspector() {
    ui.selected = null;
    insp.remove();
    rows.forEach(paintItem);
    reconcile();
  }

  // ---- C: skill page -----------------------------------------------------------------
  function openSkill(slug) {
    closePop();
    const scroll = page.querySelector('.lib-scroll');
    ui.scrollTop = scroll ? scroll.scrollTop : 0;
    ui.skill = slug;
    drawSkillPage(slug);
  }
  function back() { ui.skill = null; drawLibrary(); }

  function drawSkillPage(slug) {
    const s = D.skill(slug);
    hdr.replaceChildren(
      h('button', { class: 'sb-btn sb-btn-icon sb-btn-sm lib-back', 'data-tip': 'Back', 'aria-label': 'Back', onclick: back }, ic('chevron-right', 16)),
      h('div', { class: 'sb-crumbs' }, h('button', { class: 'lib-crumb', onclick: back }, 'Library'), ic('chevron-right', 14), h('span', s.slug)));
    skillWhere = h('div', { class: 'lib-where is-columns' });
    page.className = 'sb-page';
    page.replaceChildren(
      h('div', { class: 'lib-skill-head' },
        h('div', { class: 'sb-row-title' }, h('span', { class: 'lib-skill-title' }, s.slug), updateMark(s), s.folder ? h('span', { class: 'sb-tag' }, s.folder) : null),
        h('div', { class: 'sb-muted' }, s.desc)),
      h('div', { class: 'lib-block' }, h('div', { class: 'lib-block-label' }, "Where it's on"), skillWhere),
      h('div', { class: 'lib-block' }, h('div', { class: 'lib-block-label' }, 'SKILL.md'), skillMd(s)));
    paintSkillWhere();
  }
  function paintSkillWhere() {
    if (!skillWhere || !skillWhere.isConnected) return;
    keepFocus(skillWhere, () => skillWhere.replaceChildren(...whereSections(ui.skill)));
  }
  function skillMd(s) {
    const title = s.slug.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
    return h('pre', { class: 'lib-md' },
      h('span', { class: 'lib-md-dim' }, `---\nname: ${s.slug}\ndescription: ${s.desc}\n---\n\n`),
      `# ${title}\n\nUse this skill when the task matches the description.\n\n## Steps\n\n1. Read the files the task touches.\n2. Make the smallest change that works.\n3. Say what changed and why.`);
  }

  // ---- other pages (out of scope) ---------------------------------------------------------
  function drawOther() {
    closePop();
    const [kind, id] = ui.view.split(':');
    const meta = kind === 'ws' ? [D.workspace(id).name, 'code-folder']
      : kind === 'agent' ? [D.target(id).name, D.target(id).logo]
        : kind === 'discovery' ? ['Discovery', 'compass'] : ['Settings', 'settings'];
    hdr.replaceChildren(h('span', { class: 'sb-title' }, meta[0]));
    page.className = 'sb-page';
    page.replaceChildren(emptyState({ icon: meta[1], title: 'Not in this prototype',
      action: h('button', { class: 'sb-btn sb-btn-outline sb-btn-sm', onclick: () => nav('library') }, 'Back to Library') }));
  }

})();
</script>
</body>
</html>
